/* 자연스러운 한국어 음성 우선순위로 점수를 매겨 고름
   (신경망 'Natural/Online' 음성 > Google > Windows 기본(Heami 등) > 그 외) */
function voiceScore(v){
  const n = (v.name||'').toLowerCase();
  let s = 0;
  if(/natural|online|neural/.test(n)) s += 100;   // Edge/Windows 자연(신경망) 음성
  if(/google/.test(n)) s += 60;                    // Google 한국의(크롬)
  if(/heami|sunhi|yuna|jimin|seoyeon|injoon|hyunsu/.test(n)) s += 30;  // 알려진 자연스러운 이름
  if(/espeak|compact|robo/.test(n)) s -= 100;      // 로봇 같은 음성 회피
  return s;
}
function refreshVoice(){
  try{
    const vs = window.speechSynthesis ? window.speechSynthesis.getVoices() : [];
    if(!vs || !vs.length) return;
    koVoices = vs.filter(v=> (v.lang||'').toLowerCase().indexOf('ko')===0)
                 .sort((a,b)=> voiceScore(b)-voiceScore(a));   // 자연스러운 음성이 앞으로
    chosenVoice = koVoices[0] || chosenVoice;
  }catch(e){}
}
const FEMALE_RE = /female|여성|여자|heami|yuna|sora|nari|sunhi|seoyeon|jimin/i;
const MALE_RE   = /male|남성|남자|injoon|minsu|gyeong|jinho|hyunsu/i;
function voiceByGender(gender){
  if(!koVoices.length) return chosenVoice;
  if(gender==='male'){
    return koVoices.find(v=> MALE_RE.test(v.name) && !FEMALE_RE.test(v.name)) || chosenVoice;
  }
  return koVoices.find(v=> FEMALE_RE.test(v.name)) || chosenVoice;
}
/* 역할별 목소리: 자연스러운 톤으로 (극단적인 pitch를 피해 사람 목소리처럼).
   음성이 하나뿐인 기기에서도 살짝의 톤 차이로 인물을 구분해요. */
function voiceProfile(role){
  if(role==='clerk'){
    const cv = voiceByGender(clerkGender) || chosenVoice;
    // 점원: 차분한 어른 톤
    return clerkGender==='male'
      ? { voice: cv, pitch: 0.9,  rate: 0.98 }
      : { voice: cv, pitch: 1.02, rate: 0.98 };
  }
  if(role==='student'){
    const cust = voiceByGender(studentGender) || chosenVoice;
    // 남자 목소리: 낮게(남자아이 느낌) / 여자 목소리: 높고 밝게 — 구분이 뚜렷하게
    return studentGender==='male'
      ? { voice: cust, pitch: 0.8,  rate: 0.98 }
      : { voice: cust, pitch: 1.28, rate: 1.03 };
  }
  return { voice: chosenVoice, pitch: 1.0, rate: 1.0 };     // 기본 안내 목소리 (자연스러운 속도)
}
// 프로그램(자동) 안내 음성 : '자동 안내'가 켜졌을 때만 재생돼요.
//   → '눌렀을 때만' 모드(기본값)에서는 저절로 나오지 않고, 🔊 버튼을 눌러야 나와요.
// role : 'clerk' | 'student' | 없음(기본 안내)
function speak(text, force, role){
  if(!voiceEnabled) return;
  if(!autoVoice) return;          // 수동 모드: 프로그램 음성은 저절로 나오지 않음
  _utter(text, role);
}
// 🔊 버튼·목소리 미리듣기 전용 : 수동 모드에서도 '누르면' 항상 재생
function sayBtn(text, role){
  if(!voiceEnabled) return;
  _utter(text, role);
}
/* ⚠️ 말이 겹치는 것을 막는 핵심 (2026-07-28)
   크롬은 cancel() 바로 뒤에 speak()를 부르면 앞말이 안 끊기고 '두 말이 겹쳐' 나올 때가 있어요.
   (화면이 바뀌는 순간에 자주 생겼어요 — 예: 찍어보GO의 '모두 합해서 ○○원이에요'와
    계산하GO 점원의 '안녕하세요! 어서 오세요'가 함께 들림)
   그래서 ①cancel 뒤 아주 잠깐(90ms) 쉬었다 말하고, ②그 사이 새 말이 들어오면
   기다리던 말은 버려요(_speakSeq 번호표). 이 두 가지로 겹침·중복을 함께 막아요. */
let _speakSeq = 0;
/* ⚠️ 말하는 중인 문장을 전역에 붙잡아 둬요.
   안 그러면 안드로이드 크롬이 말하는 도중에 이 객체를 치워 버려(가비지 컬렉션)
   말이 시작되자마자 끊기거나 아예 안 나오는 일이 있어요. (알려진 버그) */
let _heldUtter = null;
function _speakSoon(synth, u){
  _heldUtter = u;
  const my = ++_speakSeq;
  /* ⚠️ 휴대폰·태블릿은 '사용자가 누른 바로 그 순간'에 speak()를 불러야 소리를 내 줘요.
     0.09초라도 미루면 '사용자가 누른 게 아니다'라고 보고 막아 버립니다(2026-07-29 확인).
     그래서 지금 아무도 말하고 있지 않으면 기다리지 않고 곧바로 말해요.
     기다림(cancel 뒤 90ms)은 '앞말을 끊고 새 말을 할 때'만 필요하고,
     그때는 이미 화면 전환 중이라 모바일 규칙과 부딪히지 않아요. */
  let busy = false;
  try{ busy = synth.speaking || synth.pending; }catch(e){}
  if(!busy){ try{ synth.speak(u); }catch(e){} return; }
  try{ synth.cancel(); }catch(e){}
  window.setTimeout(()=>{
    if(my !== _speakSeq) return;    // 그 사이 다른 말이 시작됐으면 이 말은 취소
    try{ synth.speak(u); }catch(e){}
  }, 90);
}
/* 소리가 안 날 때 '무엇이 문제인지' 알려 주는 검사 (선생님 설정 → 소리 검사).
   기기마다 원인이 달라서(한국어 음성 없음 / 브라우저가 막음 / 설정 꺼짐) 눈으로 확인해요. */
function soundReport(){
  const L = [];
  const s = window.speechSynthesis;
  L.push('· 음성 안내 설정 : ' + (voiceEnabled ? '켜짐' : '⚠️ 꺼짐'));
  L.push('· 재생 방식 : ' + (autoVoice ? '자동 안내' : '눌렀을 때만'));
  L.push('· 효과음 설정 : ' + (sfxEnabled ? '켜짐' : '⚠️ 꺼짐'));
  if(!s){ L.push('· 말하기 기능 : ⚠️ 이 브라우저가 지원하지 않아요'); }
  else{
    let all = [];
    try{ all = s.getVoices() || []; }catch(e){}
    const ko = all.filter(v=> (v.lang||'').toLowerCase().indexOf('ko')===0);
    L.push('· 이 기기의 목소리 : 전체 ' + all.length + '개');
    L.push('· 한국어 목소리 : ' + (ko.length ? ko.length + '개 (' + (ko[0].name||'이름없음') + ')'
                                              : '⚠️ 0개 — 기기에 한국어 음성을 설치해야 해요'));
    L.push('· 지금 말하는 중 : ' + (s.speaking ? '예' : '아니요'));
  }
  L.push('· 소리 잠금 : ' + (_audioUnlocked ? '풀림' : '⚠️ 아직 안 풀림'));
  L.push('· 효과음 장치 : ' + (_actx ? _actx.state : '아직 안 만들어짐'));
  return L.join('\n');
}
function _utter(text, role){
  try{
    const synth = window.speechSynthesis;
    if(!synth) return;
    if(!koVoices.length) refreshVoice();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    const prof = voiceProfile(role);
    if(prof.voice) u.voice = prof.voice;
    u.pitch = prof.pitch;
    u.rate = prof.rate;
    _speakSoon(synth, u);
  }catch(e){}
}
/* 기다리던 말까지 함께 취소해요 (번호표를 올려서) */
function stopSpeak(){ _speakSeq++; try{ window.speechSynthesis && window.speechSynthesis.cancel(); }catch(e){} }

/* 말이 '끝난 뒤' 다음 동작으로 이어 주는 speak.
   점원이 물건을 하나씩 찍어 줄 때처럼, 정해진 시간마다 밀어붙이면
   "무지개 색연필 1,000원"을 다 말하기도 전에 다음 물건으로 넘어가 말이 잘려요.
   음성이 꺼져 있거나(수동 모드) 실패하면 기본 시간 뒤에 그냥 이어 갑니다. */
function speakThen(text, role, done, fallbackMs){
  const wait = fallbackMs || 900;
  const later = ()=> window.setTimeout(done, wait);
  if(!voiceEnabled || !autoVoice){ later(); return; }
  try{
    const synth = window.speechSynthesis;
    if(!synth){ later(); return; }
    if(!koVoices.length) refreshVoice();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    const prof = voiceProfile(role);
    if(prof.voice) u.voice = prof.voice;
    u.pitch = prof.pitch;
    u.rate = prof.rate;
    let called = false;
    const go = ()=>{ if(called) return; called = true; done(); };
    u.onend = go;
    u.onerror = go;
    window.setTimeout(go, 6000);   // onend가 오지 않는 브라우저를 대비한 안전장치
    _speakSoon(synth, u);          // 겹침 방지 (위 _speakSoon 설명 참고)
  }catch(e){ later(); }
}

/* 🔊 버튼으로 고른 말(예: 학생이 점원에게 하는 대사)을 '끝까지 말한 뒤' 이어 줘요.
   sayBtn처럼 수동 모드에서도 항상 재생하되, speakThen처럼 실제 말이 끝나는 순간(onend)에
   다음으로 넘어가요. 그래서 학생 말이 잘리거나, 말이 끝나기 전에 화면이 넘어가지 않아요.
   음성이 꺼져 있으면 글자 수로 어림한 시간 뒤에 이어 갑니다. (2026-07-28) */
function sayBtnThen(text, role, done, fallbackMs){

  if(!voiceEnabled){ later(); return; }

    if(prof.voice) u.voice = prof.voice;
    u.pitch = prof.pitch;
    u.rate = prof.rate;
    let called = false;
    const go = ()=>{ if(called) return; called = true; done(); };
    u.onend = go;
    u.onerror = go;
    window.setTimeout(go, 6000);   // onend가 오지 않는 브라우저를 대비한 안전장치
    _speakSoon(synth, u);          // 겹침 방지 (위 _speakSoon 설명 참고)
  }catch(e){ later(); }
}

/* =========================================================
   효과음 (2026-07 새 기능 ③)
   ---------------------------------------------------------
   말이 아니라 '내가 눌렀다'는 확인을 주는 짧은 소리.
   실제 문구점에서 듣는 소리(마트 바코드 삑, 계산 끝 딩동)와 이어지게 만들었어요.

   왜 소리 파일을 안 쓰고 코드로 만드나:
     · 인터넷에서 받은 효과음은 저작권 문제가 생길 수 있어서 (상품 사진 때와 같은 이유)
     · 파일이 없으니 오프라인에서 늘 똑같이 동작해요
   나중에 마음에 드는 소리를 구하면 `소리\삑.mp3` 처럼 넣기만 하면 그걸 대신 씁니다.

   ⚠️ 소리는 반드시 '짧게(0.1~0.4초)'. 청각이 예민한 학생에게
      갑작스럽고 길게 이어지는 소리는 피하고 싶은 자극이 돼요.
      음량(vol)은 0.17~0.30 — 태블릿 스피커에서 잘 안 들린다고 해서 2026-07-27에 올린 값.
      더 키워야 하면 이 숫자만 손대면 되지만, 0.4를 넘기지는 말 것(귀에 부담).
   ⚠️ '틀렸을 때 나는 소리'는 만들지 않습니다 — 이 앱은 평가가 아니에요.
========================================================= */
let sfxEnabled = true;          // 교사 설정 '효과음'
let _actx = null;
const SFX_FILES = { beep:'삑', drop:'톡', done:'딩동', bell:'딸랑', ding:'띵' };   // 소리\○○.mp3 를 넣으면 그 소리로 바뀜
const _sfxFile = {};            // 미리 받아 둔 파일 (없으면 코드가 만든 소리를 씀)

function initSfxFiles(){
  /* 파일이 없으면 조용히 넘어가요(콘솔에 오류가 쌓이지 않게 onerror를 붙여 둠).
     `소리\` 폴더는 비워 둬도 됩니다 — 그때는 코드가 만든 소리가 나요. */
  Object.keys(SFX_FILES).forEach(k=>{
    ['mp3','wav','ogg','m4a'].forEach(ext=>{
      const a = new Audio('소리/'+SFX_FILES[k]+'.'+ext);
      a.preload = 'auto';
      a.addEventListener('canplaythrough', ()=>{ if(!_sfxFile[k]) _sfxFile[k] = a; }, {once:true});
      a.addEventListener('error', ()=>{}, {once:true});
    });
  });
}
function _ac(){
  try{
    if(!_actx) _actx = new (window.AudioContext || window.webkitAudioContext)();
    if(_actx.state === 'suspended') _actx.resume();   // 태블릿은 첫 터치 뒤에야 소리가 나요
    return _actx;
  }catch(e){ return null; }
}

/* ===== 소리 잠금 풀기 (휴대폰·일부 태블릿에서 소리가 안 나던 문제 — 2026-07-29) =====
   모바일 브라우저는 '사용자가 한 번이라도 화면을 누르기 전'에는 소리를 막아요.
   이 앱은 홈 화면에 들어가자마자 안내를 시작하므로 그 첫 안내가 막히고,
   기기에 따라 그 뒤로도 계속 소리가 안 나는 일이 있었어요.
   그래서 '맨 처음 누른 순간'에 딱 한 번, 아주 짧고 소리 없는 말을 흘려보내
   브라우저에게 '사용자가 허락했다'는 자격을 얻어 둡니다. 그 뒤로는 잘 나와요. */
let _audioUnlocked = false;
function unlockAudio(){
  if(_audioUnlocked) return;
  _audioUnlocked = true;
  try{ _ac(); }catch(e){}              // 효과음(Web Audio) 깨우기
  try{
    const s = window.speechSynthesis;
    if(s){
      const u = new SpeechSynthesisUtterance(' ');
      u.lang = 'ko-KR';
      u.volume = 0;                    // 들리지 않게 (자격만 얻어요)
      s.speak(u);
      refreshVoice();                  // 이때쯤이면 목소리 목록이 준비돼 있어요
    }
  }catch(e){}
}
['pointerdown','touchend','click','keydown'].forEach(ev=>{
  try{ window.addEventListener(ev, unlockAudio, {capture:true, passive:true}); }catch(e){}
});
/* 짧은 음 하나. 시작·끝을 부드럽게 해야 '툭' 하는 잡음이 안 생겨요. */
function _tone(ac, {freq, from, dur, type='sine', vol=0.16, slideTo=null}){
  const o = ac.createOscillator(), g = ac.createGain();
  const t = ac.currentTime + (from||0);
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t+dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t+0.012);          // 살짝 올라갔다가
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);         // 부드럽게 사라짐
  o.connect(g); g.connect(ac.destination);
  o.start(t); o.stop(t+dur+0.02);
}
function playSfx(kind){
  if(!sfxEnabled) return;
  if(document.body.classList.contains('quiet')) return;       // 조용한 모드면 소리 없음
  try{
    if(_sfxFile[kind]){ const a = _sfxFile[kind].cloneNode(); a.volume = 0.8; a.play(); return; }
    const ac = _ac(); if(!ac) return;
    if(kind==='beep'){
      /* 바코드 '삑' — 마트 스캐너처럼 높고 짧게 (2093Hz = 높은 도).
         square파는 같은 vol이어도 sine보다 크게 들려서 조금 낮게 잡아요. */
      _tone(ac, {freq:2093, dur:0.09, type:'square', vol:0.17});
    } else if(kind==='drop'){
      /* 바구니에 '톡' — 물건이 담기듯 살짝 내려가는 낮은 음 */
      _tone(ac, {freq:520, slideTo:300, dur:0.13, type:'triangle', vol:0.30});
    } else if(kind==='done'){
      /* 계산 끝 '딩동' — 가게 계산대의 두 음 (솔 → 미) */
      _tone(ac, {freq:784, dur:0.16, type:'sine', vol:0.28});
      _tone(ac, {freq:659, dur:0.30, type:'sine', vol:0.28, from:0.15});
    } else if(kind==='ding'){
      /* 엘리베이터 '띵' — 문이 열릴 때. 계산 끝 '딩동'(두 음)과 헷갈리지 않게
         높은 한 음이 길게 울리도록 했어요. 옥타브 위 음을 아주 작게 얹으면 종처럼 들려요. */
      _tone(ac, {freq:1046, dur:0.55, type:'sine', vol:0.26});
      _tone(ac, {freq:2093, dur:0.35, type:'sine', vol:0.06});
    } else if(kind==='bell'){
      /* 문구점 문 '딸랑' — 가게 문에 달린 작은 방울.
         두 음을 겹쳐야 '방울' 느낌이 나고(한 음이면 그냥 삐- 소리),
         살짝 늦게 한 번 더 울려야 문이 흔들리며 딸랑거리는 느낌이 나요. */
      _tone(ac, {freq:2093, dur:0.38, type:'sine', vol:0.20});
      _tone(ac, {freq:1568, dur:0.38, type:'sine', vol:0.14});
      _tone(ac, {freq:2093, dur:0.34, type:'sine', vol:0.14, from:0.14});
      _tone(ac, {freq:1568, dur:0.34, type:'sine', vol:0.10, from:0.14});
    }
  }catch(e){}
}

/* ---------- 배경 이미지 (이미지/배경/<이름>.png 가 있으면 그 그림, 없으면 아무것도 안 보임) ---------- */

function AvatarPreset({c, px}){

/* ---------- 전체화면 모드 ---------- */
function fsSupported(){
  const el = document.documentElement;
  return !!(el.requestFullscreen || el.webkitRequestFullscreen);
}
function toggleFullscreen(){
  try{
    const el = document.documentElement;
    const cur = document.fullscreenElement || document.webkitFullscreenElement;
    if(!cur){ (el.requestFullscreen || el.webkitRequestFullscreen).call(el); }
    else{ (document.exitFullscreen || document.webkitExitFullscreen).call(document); }
  }catch(e){}
}
function FullscreenBtn({big}){
  const [fs, setFs] = useState(false);
  useEffect(()=>{
    const on = ()=> setFs(!!(document.fullscreenElement || document.webkitFullscreenElement));
    document.addEventListener('fullscreenchange', on);
    document.addEventListener('webkitfullscreenchange', on);
    return ()=>{ document.removeEventListener('fullscreenchange', on); document.removeEventListener('webkitfullscreenchange', on); };
  }, []);
  if(!fsSupported()) return null;
  if(big) return (
    <button className="btn ghost" onClick={toggleFullscreen}>
      {fs? '🡼 전체화면 나가기' : '⛶ 전체화면으로 보기'}
    </button>
  );
  return (
    <button className="iconbtn" title={fs?'전체화면 나가기':'전체화면으로 보기'} onClick={toggleFullscreen}>
      {fs? '🡼' : '⛶'}
    </button>
  );
}

/* onSpeak: 배너(칩) 자체를 눌러도 그 내용을 읽어 줘요 (2026-07-28).
   작은 🔊 단추를 정확히 누르기 어려운 학생도 넓은 칸을 눌러 들을 수 있어요. */
function Hint({children, kind='', text, style, onSpeak}){
  const tap = onSpeak ? ()=> sayBtn(onSpeak) : null;
  return (
    <div className={"hint "+kind+(tap?' tappable':'')} style={style}
      onClick={tap || undefined} role={tap?'button':undefined} tabIndex={tap?0:undefined}
      onKeyDown={tap? (e)=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); tap(); } } : undefined}>
      <span>{children}</span>
      <span className="spacer"></span>
      {text && <Speak text={text} />}
    </div>
  );
}

/* ---------- 축하 반짝이 ---------- */
function Confetti({show}){
  if(!show) return null;
  const cols=['#ff6b6b','#ffd23f','#5ec8f2','#4ecdc4','#b39ddb'];
  const bits=[];
  for(let i=0;i<40;i++){
    bits.push(<i key={i} style={{left:(Math.random()*100)+'%',background:cols[i%cols.length],
      animationDelay:(Math.random()*0.6)+'s'}} />);
  }
  return <div className="confetti">{bits}</div>;
}

  currentCharacter = character;
  useEffect(()=>{ currentCharacter = character; saveStore('go_character', character); }, [character]);

  /* 선생님이 우리 반에 맞게 더한 상품 (기본 96개 뒤에 이어 붙어요) */
  const [customProducts, setCustomProducts] = useState(()=> loadStore('go_custom_products', []));
  useEffect(()=> saveStore('go_custom_products', customProducts), [customProducts]);
  const allProducts = customProducts.length ? [...PRODUCTS, ...customProducts] : PRODUCTS;

  /* ---- 학생 명단 (하트·기록을 학생별로 따로 모아요) ----
     캐릭터는 학생마다 고정하지 않아요. 그날 마음에 드는 캐릭터를 매번 새로 골라요. */
  const [students, setStudents] = useState(()=> loadStudents());
  const [studentId, setStudentId] = useState(null);        // 이번에 쇼핑하는 학생
  useEffect(()=> saveStudents(students), [students]);
  const student = students.find(s=>s.id===studentId) || null;

  /* 이름과 목소리는 '학생 명단'을 유일한 출처로 삼아요.
     (예전엔 settings에서 읽어서, 명단에서 이름을 고치면 옛 이름이 남는 문제가 있었어요) */
  currentStudentName = (student && student.name) || settings.name || '';
  studentGender = (student && student.voice) || settings.studentVoice || 'female';

  // 고른 학생의 이름을 설정에도 맞춰 둬요 (영수증·결과표·작품 파일이름이 함께 따라와요)
  useEffect(()=>{
    if(student && settings.name !== student.name) setSettings(s=>({...s, name: student.name}));
  }, [student && student.name]);

  // 하트가 바뀌면 그 학생 자료에 모아 둬요 (다음에 와도 남아 있어요)
  useEffect(()=>{
    if(!studentId) return;
    setStudents(list=> list.map(s=> s.id===studentId ? {...s, likes} : s));
  }, [likes, studentId]);

  // 학생을 고르면 이름과 그동안 누른 하트를 함께 불러와요
  const chooseStudent = (id)=>{
    const st = students.find(s=>s.id===id);
    if(!st) return;
    setStudentId(id);
    setSettings(s=>({...s, name: st.name}));   // 화면·기록에 쓰는 이름
    setLikes(st.likes || []);
  };

  /* 쇼핑 도장 — '잘했다'가 아니라 '오늘도 즐겁게 다녀왔다'는 기념이에요.
     한 번 다녀오면 도장 1개. 같은 회기에 두 번 주지 않아요. */
  const [stampGiven, setStampGiven] = useState(false);
  const giveStamp = ()=>{
    if(stampGiven || !studentId) return;
    setStampGiven(true);
    const t = new Date();
    const day = (t.getMonth()+1)+'/'+t.getDate();
    setStudents(list=> list.map(s=> s.id===studentId
      ? {...s, stamps:[...(s.stamps||[]), {date:day}]} : s));
  };

  // 그 학생의 회기 기록에 한 줄 더하기
  const addHistory = (entry)=>{
    if(!studentId){ const h=loadStore('go_history',[]); saveStore('go_history',[...h, entry]); return; }
    setStudents(list=> list.map(s=> s.id===studentId ? {...s, history:[...(s.history||[]), entry]} : s));
  };
  const clearHistory = ()=>{
    if(!studentId){ saveStore('go_history', []); return; }
    setStudents(list=> list.map(s=> s.id===studentId ? {...s, history:[]} : s));
  };

  /* 캐릭터 그림을 앱 시작할 때 미리 받아 둬요.
     (안 그러면 '캐릭터 골라요' 화면에서 그림이 하나씩 뜨며 빈 칸이 보여요) */
  useEffect(()=>{
    // 화면에서 쓰는 주소와 '똑같이'(?v= 포함) 받아 둬야 다시 안 받아요.
    // 실제로 있는 '한글 이름' 그림만 받아 둬요 (없는 주소까지 받으면 오히려 느려져요)
    CHARACTERS.forEach(c=>{
      const im = new Image(); im.src = imgList('이미지/캐릭터/'+c.name)[0];
    });
    initSfxFiles();   // 소리\삑.mp3 같은 파일이 있으면 그걸 쓰려고 미리 찾아 둬요
  }, []);

  // 전체화면일 때 body 에 표시(네비바 숨기고 화면을 최대한 크게)
  useEffect(()=>{
    const on = ()=> document.body.classList.toggle('fs-active', !!(document.fullscreenElement || document.webkitFullscreenElement));
    document.addEventListener('fullscreenchange', on);
    document.addEventListener('webkitfullscreenchange', on);
    on();
    return ()=>{ document.removeEventListener('fullscreenchange', on); document.removeEventListener('webkitfullscreenchange', on); };
  }, []);

  /* 새 쇼핑 시작: 바구니·지갑은 새로 비워요.
     하트는 학생을 고른 경우엔 그 학생 것으로 이어가고(keepLikes), 명단이 없으면 예전처럼 비워요. */
  const startShopping = (opts)=>{
    const keepLikes = !!(opts && opts.keepLikes);
    lastBrowse = { floor:null, scene:'facade' };   // 새 쇼핑은 건물 입구부터
    setBasket([]); setScanned([]); setPayMethod(null); setPaidBills([]); setCheckoutMode(null);
    setReceipt(null); setActivity(null); setStudentBudget(null);
    setBarcodeDone(false); setTeacherChecks({}); setHelpCount(0); setRetryCount(0); setStampGiven(false);
    saveStore('go_basket', []); saveStore('go_studentBudget', null);
    if(!keepLikes){ setLikes([]); saveStore('go_likes', []); }
    setStage('browse'); setMaxReached('browse');
  };

  const budget = (settings.budgetByStudent!==false && studentBudget!=null) ? studentBudget : settings.budget;
  const total = sum(basket);
  const remaining = budget - total;

  // 단계 이동
  // 구경하GO!·고르GO!는 여가답게 언제든 자유롭게 오갈 수 있어요.
  // 찍어보GO!·계산하GO!·즐기GO!는 문구를 담은 뒤(도달한 단계까지) 갈 수 있어요.
  const goStage = (key)=>{
    const idx = STEPS.findIndex(s=>s.key===key);
    const maxIdx = STEPS.findIndex(s=>s.key===maxReached);
    const alwaysOpen = (key==='browse' || key==='choose');
    if(idx > maxIdx && !alwaysOpen){ speak('먼저 마음에 드는 문구를 바구니에 담아 볼까요?'); return; }
    stopSpeak(); setStage(key);
  };
  const advance = (key)=>{
    const idx = STEPS.findIndex(s=>s.key===key);
    const maxIdx = STEPS.findIndex(s=>s.key===maxReached);
    if(idx > maxIdx) setMaxReached(key);
    stopSpeak(); setStage(key);
  };

  const addRetry = ()=> setRetryCount(c=>c+1);
  const askHelp = ()=>{ setHelpCount(c=>c+1); setHelpOpen(true); };

  const resetAll = ()=>{
    lastBrowse = { floor:null, scene:'facade' };
    setLikes([]); setBasket([]); setScanned([]); setPayMethod(null); setPaidBills([]); setCheckoutMode(null);
    setReceipt(null); setActivity(null);
    setHelpCount(0); setRetryCount(0); setBarcodeDone(false); setTeacherChecks({});
    setStage('browse'); setMaxReached('browse'); setScreen('home'); setStudentBudget(null);
    saveStore('go_likes', []); saveStore('go_basket', []); saveStore('go_studentBudget', null);
    stopSpeak();
  };

  // ---- 홈 화면 ----
  if(screen==='home'){
    return <Home settings={settings}
      onEnter={()=>{
        stopSpeak();
        // 명단이 있으면 '누가 쇼핑할까요?'부터, 없으면 예전처럼 바로 캐릭터 고르기로
        if(students.length>0){ setScreen('student'); }
        else { setStudentId(null); startShopping(); setScreen('charselect'); }
      }}
      onTeacher={()=> setScreen('teacher')}
      onToggleVoice={()=> setSettings(s=>({...s, voice:!s.voice}))} />;
  }

  // ---- 누가 쇼핑할까요? (학생 고르기) ----
  if(screen==='student'){
    return <StudentSelect students={students}
      onHome={()=>{ stopSpeak(); setScreen('home'); }}
      onPick={(id)=>{
        /* 여기서 stopSpeak()를 부르면 방금 읽어 준 '학생 이름'이 바로 끊겨요.
           고른 이름을 끝까지 듣게 두고, 다음 화면 안내는 CharacterSelect가 조금 늦게 시작해요. */
        startShopping({keepLikes:true});
        chooseStudent(id);
        setScreen('charselect');
      }} />;
  }

  // ---- 쇼핑 캐릭터 고르기 ----
  if(screen==='charselect'){
    return <CharacterSelect initial={character}
      onHome={()=>{ stopSpeak(); setScreen('home'); }}
      /* 명단을 쓸 때만 '누가 쇼핑할까요?'로 돌아가는 버튼이 나와요 */
      onBack={students.length>0 ? ()=>{ stopSpeak(); setScreen('student'); } : null}
      lockedName={student ? student.name : null}
      onConfirm={(ch)=>{
        setCharacter(ch); currentCharacter = ch;
        if(charFromShopping){ setCharFromShopping(false); setScreen('activity'); return; }  // 하던 쇼핑으로 복귀
        if(settings.budgetByStudent!==false){ setScreen('walletsetup'); }
        else { setScreen('activity'); setStage('browse'); setMaxReached('browse'); }
      }} />;
  }

  // ---- 지갑 예산 정하기 (학생이 직접 선택) ----
  if(screen==='walletsetup'){
    return <WalletSetup name={settings.name} initial={studentBudget || settings.budget}
      onHome={()=>{ stopSpeak(); setScreen('home'); }}
      onConfirm={(amt)=>{ setStudentBudget(amt); setScreen('activity'); setStage('browse'); setMaxReached('browse'); }} />;
  }

  // ---- 교사 설정 ----
  if(screen==='teacher'){
    return <TeacherSettings settings={settings} setSettings={setSettings}
      students={students} setStudents={setStudents}
      customProducts={customProducts} setCustomProducts={setCustomProducts}
      onDone={()=> setScreen('home')} onResult={()=> setScreen('result')} />;
  }

  // ---- 교사 결과 ----
  if(screen==='result'){
    return <TeacherResult
      settings={settings} likes={likes} basket={basket} scanned={scanned}
      receipt={receipt} activity={activity}
      helpCount={helpCount} retryCount={retryCount} barcodeDone={barcodeDone}
      total={total} budget={budget}
      checks={teacherChecks} setChecks={setTeacherChecks}
      student={student} history={student? (student.history||[]) : loadStore('go_history',[])}
      onSaveSession={addHistory} onClearHistory={clearHistory}
      onBack={()=> setScreen('teacher')} />;
  }

  // ---- 실제 문구점 쇼핑 리스트 인쇄 ----
  if(screen==='printlist'){
    return <ShoppingListPrint settings={settings} basket={basket} budget={budget}
      onBack={()=> setScreen('finish')} />;
  }

  // ---- 결제 페이지 (계산하GO! 두 번째 장) ----
  if(screen==='paying'){
    return (
      <div>
        <BgImg name="벽지" className="wallpaper" />
        <Confetti show={confetti} />
        <SwitchScanner enabled={settings.switchScan} interval={settings.scanSpeed} />
        <TopBar stage="pay" maxReached={maxReached}
          goStage={(k)=>{ stopSpeak(); setScreen('activity'); setStage(k); }}
          onHome={()=>{ if(confirm('처음 화면으로 갈까요? 활동은 저장돼요.')) setScreen('home'); }}
          settings={settings} setSettings={setSettings} onHelp={askHelp} />
        <PayingPage settings={settings} basket={basket} total={total} method={payMethod} checkoutMode={checkoutMode}
          paidBills={paidBills} setPaidBills={setPaidBills} onRetry={addRetry}
          onBack={()=>{ stopSpeak(); setPayMethod(null); setPaidBills([]); setScreen('activity'); setStage('pay'); }}
          onDone={(info)=>{ setReceipt(info); setScreen('activity'); advance('enjoy'); celebrate(); }} />
        {helpOpen && <HelpModal stage="pay" onClose={()=>setHelpOpen(false)} />}
      </div>
    );
  }

  // ---- 여가활동 선택 페이지 (즐기GO! 두 번째 장) ----
  if(screen==='play'){
    return (
      <div>
        <BgImg name="벽지" className="wallpaper" />
        <Confetti show={confetti} />
        <SwitchScanner enabled={settings.switchScan} interval={settings.scanSpeed} />
        <TopBar stage="enjoy" maxReached={maxReached}
          goStage={(k)=>{ stopSpeak(); setScreen('activity'); setStage(k); }}
          onHome={()=>{ if(confirm('처음 화면으로 갈까요? 활동은 저장돼요.')) setScreen('home'); }}
          settings={settings} setSettings={setSettings} onHelp={askHelp} />
        <PlayPage settings={settings} basket={basket} activity={activity} setActivity={setActivity}
          onBack={()=>{ stopSpeak(); setScreen('activity'); setStage('enjoy'); }}
          onFinish={()=>{ stopSpeak(); setScreen('finish'); }}
          onGoPlayground={()=>{ stopSpeak(); setScreen('playground'); }} />
        {helpOpen && <HelpModal stage="enjoy" onClose={()=>setHelpOpen(false)} />}
      </div>
    );
  }

  // ---- 꾸미기 놀이터 (즐기GO! · 화면에서 놀기 전용 화면) ----
  if(screen==='playground'){
    return (
      <div>
        <BgImg name="벽지" className="wallpaper" />
        <Confetti show={confetti} />
        <SwitchScanner enabled={settings.switchScan} interval={settings.scanSpeed} />
        <TopBar stage="enjoy" maxReached={maxReached}
          goStage={(k)=>{ stopSpeak(); setScreen('activity'); setStage(k); }}
          onHome={()=>{ if(confirm('처음 화면으로 갈까요? 활동은 저장돼요.')) setScreen('home'); }}
          settings={settings} setSettings={setSettings} onHelp={askHelp} />
        <div className="app">
          <Playground settings={settings} basket={basket} activity={activity}
            onBack={()=>{ stopSpeak(); setScreen('play'); }}
            onDone={()=>{ stopSpeak(); setScreen('finish'); }} />
        </div>
        {helpOpen && <HelpModal stage="enjoy" onClose={()=>setHelpOpen(false)} />}
      </div>
    );
  }

  // ---- 마무리 화면 ----
  if(screen==='finish'){
    return (
      <div>
        <SwitchScanner enabled={settings.switchScan} interval={settings.scanSpeed} />
        <TopBar stage={stage} maxReached={maxReached} goStage={()=>{}} onHome={()=>setScreen('home')} settings={settings} setSettings={setSettings} onHelp={askHelp} />
        <FinishScreen settings={settings} basket={basket} likes={likes} activity={activity}
          stamps={student? (student.stamps||[]) : null} onStamp={giveStamp}
          onReplay={()=>{ setScreen('activity'); setStage('browse'); }}
          onRestart={resetAll} onPrintList={()=> setScreen('printlist')} />
        {helpOpen && <HelpModal stage="finish" onClose={()=>setHelpOpen(false)} />}
      </div>
    );
  }

  // ---- 활동 화면 (5단계) ----
  return (
    <div>
      <BgImg name="벽지" className="wallpaper" />
      <Confetti show={confetti} />
      <SwitchScanner enabled={settings.switchScan} interval={settings.scanSpeed} />
      <TopBar stage={stage} maxReached={maxReached} goStage={goStage} onHome={()=>{ if(confirm('처음 화면으로 갈까요? 활동은 저장돼요.')) setScreen('home'); }}
        settings={settings} setSettings={setSettings} onHelp={askHelp} />
      <div className="app">
        {stage==='browse' && <BrowseStage
          settings={settings} products={allProducts} likes={likes} setLikes={setLikes}
          basket={basket} setBasket={setBasket} budget={budget} total={total} remaining={remaining}
          maxItems={settings.maxItems} onNext={()=>advance('choose')} celebrate={celebrate}
          onCheckout={()=>advance('scan')}
          onAddProduct={(p)=> setCustomProducts(l=>[...l, p])}
          onChangeCharacter={()=>{ stopSpeak(); setCharFromShopping(true); setScreen('charselect'); }}
          onWalletReset={settings.budgetByStudent!==false ? ()=>{ stopSpeak(); setScreen('walletsetup'); } : null} />}

        {stage==='choose' && <ChooseStage
          settings={settings} likes={likes} basket={basket} setBasket={setBasket}
          budget={budget} total={total} remaining={remaining} maxItems={settings.maxItems}
          onBack={()=>goStage('browse')} onNext={()=>advance('scan')} onRetry={addRetry}
          onChangeCharacter={()=>{ stopSpeak(); setCharFromShopping(true); setScreen('charselect'); }}
          onWalletReset={settings.budgetByStudent!==false ? ()=>{ stopSpeak(); setScreen('walletsetup'); } : null} />}

        {stage==='scan' && <ScanStage
          settings={settings} basket={basket} scanned={scanned} setScanned={setScanned}
          budget={budget} total={total} onDone={()=>setBarcodeDone(true)}
          onBack={()=>goStage('choose')} onNext={()=>advance('pay')} celebrate={celebrate}
          checkoutMode={checkoutMode} setCheckoutMode={setCheckoutMode} />}

        {stage==='pay' && <PayStage
          settings={settings} basket={basket} total={total} budget={budget} checkoutMode={checkoutMode}
          onBack={()=>goStage('scan')}
          onGoPay={(m)=>{ stopSpeak(); setPayMethod(m); setPaidBills([]); setScreen('paying'); }} />}

        {stage==='enjoy' && <EnjoyStage
          settings={settings} basket={basket} receipt={receipt}
          onBack={()=>goStage('pay')}
          onGoPlay={()=>{ stopSpeak(); setScreen('play'); }} />}
      </div>
      {helpOpen && <HelpModal stage={stage} onClose={()=>setHelpOpen(false)} />}
    </div>
  );
}

/* =========================================================
   상단 스텝바
========================================================= */
function TopBar({stage, maxReached, goStage, onHome, settings, setSettings, onHelp}){
  const maxIdx = STEPS.findIndex(s=>s.key===maxReached);
  return (
    <React.Fragment>
    {/* 전체화면일 때만 보이는 작은 나가기 버튼 (네비바가 숨겨져도 나갈 수 있어요) */}
    <button className="fs-exit-fab noprint" onClick={toggleFullscreen} title="전체화면 나가기" aria-label="전체화면 나가기">🡼</button>
    <div className="topbar noprint">
      <div className="topbar-inner">
        <button className="brand step-btn" onClick={onHome} title="처음 화면">
          <BrandLogo />
        </button>
        <div className="steps">
          {STEPS.map((s,i)=>{
            const done = i < STEPS.findIndex(x=>x.key===stage);
            const active = s.key===stage;
            const alwaysOpen = (s.key==='browse' || s.key==='choose');
            const locked = i > maxIdx && !alwaysOpen;
            return (
              <button key={s.key} className={"step-btn"} disabled={locked && !active}
                onClick={()=>goStage(s.key)}>
                <span className={"step "+(active?'active':done?'done':'')+(locked?' locked':'')}>
                  <span className="num">{done? '✓' : i+1}</span>
                  <span>{s.icon} {s.label}</span>
                </span>
              </button>
            );
          })}
        </div>
        {onHelp && <button className="iconbtn" title="도움이 필요해요" onClick={onHelp}>🙋</button>}
        <FullscreenBtn />
        <button className="iconbtn" title={settings.quietMode?'조용한 모드 끄기':'조용한 모드 켜기 (소리·반짝임 줄이기)'}
          onClick={()=> setSettings(s=>({...s, quietMode:!s.quietMode}))}
          style={settings.quietMode?{background:'#2b2b3a', color:'#fff'}:null}>
          {settings.quietMode? '🔕':'🔔'}
        </button>
        <button className="iconbtn" title={settings.voice?'음성 끄기':'음성 켜기'}
          onClick={()=> setSettings(s=>({...s, voice:!s.voice}))}>
          {settings.voice? '🔊':'🔇'}
        </button>
      </div>
    </div>
    </React.Fragment>
  );
}

/* =========================================================
   홈 화면
========================================================= */
function HeroImage(){
  const srcs = imgList('이미지/문구점 메인').concat(imgList('이미지/메인'));
  const [i, setI] = useState(0);
  const [failed, setFailed] = useState(false);
  if(failed) return <h1>구경하GO! 고르GO! 즐기GO!</h1>;
  return (
    <img className="hero-img" src={srcs[i]}
      alt="구경하GO! 고르GO! 즐기GO! — 문구점에서 문구를 구경하고 고르고 즐기는 아이들"
      onError={()=>{ if(i<srcs.length-1) setI(i+1); else setFailed(true); }} />
  );
}
function Home({settings, onEnter, onTeacher, onToggleVoice}){
  useEffect(()=>{ const t=setTimeout(()=> speak('GO! 문구마켓에 온 것을 환영해요. 여가활동에 필요한 물건을 골라 보세요.'), 400); return ()=>clearTimeout(t); }, []);
  return (
    <div className="app home-screen" style={{paddingTop:14}}>
      <BgImg name="벽지" className="wallpaper" />
      <SwitchScanner enabled={settings.switchScan} interval={settings.scanSpeed} />
      <div className="home-stage">
        <div className="home-img-wrap">
          {/* 그림을 누르면 문구점에 들어가요 */}
          <button className="home-enter" onClick={onEnter} aria-label="문구점에 들어가기 — 그림을 눌러요">
            <HeroImage />
            <span className="home-enter-hint">🚪 그림을 눌러서 들어가기</span>
          </button>
          {/* 오른쪽 위 이모지 버튼 3개 */}
          <div className="home-tools">
            <button className="iconbtn" onClick={onToggleVoice} title={settings.voice?'음성 끄기':'음성 켜기'} aria-label="음성 켜기/끄기">{settings.voice? '🔊':'🔇'}</button>
            <FullscreenBtn />
            <button className="iconbtn" onClick={onTeacher} title="선생님 설정" aria-label="선생님 설정">⚙️</button>
          </div>
        </div>
      </div>
    </div>
  );
}

/* =========================================================
   교사 설정
========================================================= */
function TeacherSettings({settings, setSettings, onDone, onResult, students, setStudents, customProducts, setCustomProducts}){
  const [s, setS] = useState(settings);
  const [custom, setCustom] = useState(String(settings.budget));
  const [markOpen, setMarkOpen] = useState(null);   // 표시 고르는 중인 학생 id
  const [soundInfo, setSoundInfo] = useState(null); // '소리 검사' 결과
  // 새 상품 입력칸
  const [np, setNp] = useState({corner:'write', name:'', price:1000, color:'', feat:'', use:'', emoji:'🛍️', photo:null});
  const npSet = (k,v)=> setNp(p=>({...p,[k]:v}));
  const photoRef = useRef(null);
  const onProductPhoto = (e)=> readProductPhoto(e, (url)=> npSet('photo', url));
  const addProduct = ()=>{
    const name = np.name.trim();
    if(!name){ alert('상품 이름을 적어 주세요.'); return; }
    setCustomProducts(list=>[...list, makeCustomProduct(np)]);
    setNp({corner:np.corner, name:'', price:1000, color:'', feat:'', use:'', emoji:'🛍️', photo:null});
  };
  const set = (k,v)=> setS(p=>({...p,[k]:v}));
  const Choice = ({on, onClick, children})=>(
    <button className={"choice "+(on?'on':'')} onClick={onClick}>{on?'✓ ':''}{children}</button>
  );
  const save = ()=>{ setSettings(s); onDone(); };
  return (
    <div className="app tset" style={{paddingTop:30, maxWidth:860}}>
      <div className="panel">
        <div className="section-title">선생님 설정 <span className="spacer"></span>
          <button className="btn sm purple" style={{fontSize:'.62em'}} onClick={onResult}>활동 결과 보기</button>
          <button className="btn sm ghost" style={{fontSize:'.62em'}} onClick={onDone}>닫기</button></div>

        <div className="field">
          <label>1. 우리 반 학생 <span className="muted" style={{fontWeight:400,fontSize:'.85em'}}>학생마다 좋아요·활동 기록이 따로 모여요</span></label>
          {students.length===0 && (
            <p className="muted" style={{margin:'0 0 8px', fontSize:'.92em'}}>
              아직 학생이 없어요. 학생을 추가하면 쇼핑을 시작할 때 <b>“누가 쇼핑할까요?”</b> 화면이 나와요.
              (추가하지 않으면 지금처럼 바로 쇼핑을 시작해요.)
            </p>
          )}
          <div className="col" style={{gap:8}}>
            {students.map(st=>(
              <div key={st.id} className="stu-edit">
                <div className="row" style={{gap:8, margin:0, alignItems:'center'}}>
                  <button className="btn ghost sm" style={{fontSize:'1.4em', minWidth:56}}
                    onClick={()=> setMarkOpen(markOpen===st.id? null : st.id)} title="이름 옆 표시 바꾸기">
                    {st.mark||'🙂'}
                  </button>
                  <input className="input" style={{flex:1, margin:0}} value={st.name} placeholder="이름"
                    onChange={e=> setStudents(list=> list.map(x=> x.id===st.id? {...x, name:e.target.value} : x))} />
                  {/* 이 학생이 말할 때 나오는 목소리 — 이름으로는 성별을 알 수 없어서 선생님이 정해요 */}
                  <span className="stu-voice">
                    <button className={"choice sm"+((st.voice||'female')==='female'?' on':'')}
                      onClick={()=>{ setStudents(list=> list.map(x=> x.id===st.id? {...x, voice:'female'} : x));
                        studentGender='female'; sayBtn('안녕하세요! 제 목소리예요.', 'student'); }}>여자</button>
                    <button className={"choice sm"+(st.voice==='male'?' on':'')}
                      onClick={()=>{ setStudents(list=> list.map(x=> x.id===st.id? {...x, voice:'male'} : x));
                        studentGender='male'; sayBtn('안녕하세요! 제 목소리예요.', 'student'); }}>남자</button>
                  </span>
                  <button className="btn ghost sm" onClick={()=>{
                    if(confirm(`'${st.name||'이 학생'}'을(를) 명단에서 지울까요?\n그동안 모은 좋아요와 활동 기록도 함께 지워져요.`)){
                      setStudents(list=> list.filter(x=>x.id!==st.id)); setMarkOpen(null);
                    }
                  }}>지우기</button>
                </div>
                {markOpen===st.id && (
                  <div className="stu-marks">
                    {STUDENT_MARKS.map(m=>(
                      <button key={m} className={"stu-mark-pick"+(st.mark===m?' on':'')}

            setStudents(list=>[...list, { id:'s'+Date.now()+Math.floor(Math.random()*1000),

        </div>

        <div className="field">
          <label>2. 예산(지갑 돈) 정하기</label>
          <div className="choices">
            <Choice on={s.budgetByStudent!==false} onClick={()=>set('budgetByStudent',true)}>학생이 지갑에서 고름</Choice>
            <Choice on={s.budgetByStudent===false} onClick={()=>set('budgetByStudent',false)}>선생님이 정함</Choice>

            </div>

        </div>

        <div className="field">
          <label>3. 최대 구매 개수</label>
          <div className="choices">
            {[{v:1,t:'1개'},{v:2,t:'2개'},{v:3,t:'3개'},{v:5,t:'5개'},{v:99,t:'제한 없음'}].map(o=>

            <p className="muted" style={{fontSize:'.85em', margin:'8px 0 0'}}>

            <Choice on={s.moneyPractice===true} onClick={()=>set('moneyPractice',true)}>계산 연습 (지폐·거스름돈)</Choice>

          {/* 두 방식을 견주어 보는 설명이라 '한 줄에 하나씩' 놓아요 (이어 쓰면 어디까지가 어느 쪽 설명인지 헷갈려요) */}
          <p className="muted" style={{fontSize:'.85em', marginTop:6}}>
            <span style={{display:'block'}}>‘간단히’는 돈을 건네거나 카드를 대면 바로 계산돼요.</span>

          </p>
        </div>

        <button className="btn primary big" style={{width:'100%'}} onClick={save}>설정 완료</button>
      </div>
    </div>
  );
}

function BudgetBar({name, budget, total, remaining, basketCount, maxItems, wallet, onWalletReset, onBasket, art, caption, onChangeCharacter}){
  const pct = Math.min(100, Math.round((total/Math.max(1,budget))*100));
  const over = total>budget;
  const [askReset, setAskReset] = useState(false);
  const basketClick = ()=>{
    if(!onBasket) return;
    if(basketCount>0){ stopSpeak(); onBasket(); }
    else sayBtn('먼저 마음에 드는 문구를 바구니에 담아 볼까요?');
  };
  const basketInner = (<React.Fragment>
    <span className="lbl">내 바구니</span>
    <b>🧺 {basketCount}개{maxItems<99?` / ${maxItems}개`:''}{onBasket && basketCount>0 ? ' ›' : ''}</b>
  </React.Fragment>);
  return (
    <div className={"topbar-row"+(art?' has-art':'')}>
      <div className="topbar-left">
      <ShopperChip onChange={onChangeCharacter} />
      <div className="budgetbar">
        <div className="b-item"><span className="lbl">예산</span><b>{won(budget)}</b></div>
        <div className="b-divider"></div>
        <div className="b-item"><span className="lbl">현재 합계</span><b style={{color:'#c0392b'}}>{won(total)}</b></div>
        <div className="b-divider"></div>
        <div className="b-item"><span className="lbl">남은 돈</span><b style={{color: over?'#e8663a':'#2fbf71'}}>{won(remaining)}</b></div>
        <div className="b-divider"></div>
        {onBasket
          ? <button className={"b-item b-basket-btn"+(basketCount>0?' has':'')} onClick={basketClick}
              title="장바구니 열기">{basketInner}</button>
          : <div className="b-item">{basketInner}</div>}
        {/* 지금 무엇을 하는지 — '내 바구니' 바로 옆 (2026-07-27).
            예전엔 여기에 큰 삽화(.topbar-art)를 넣었는데, 폭을 272px이나 써서
            지갑 지폐가 4장만 넘어도 줄이 바뀌고 매장 그림이 밀려 내려갔어요.
            이 화면은 '나 캐릭터'가 직접 걸어다니며 고르는 모습이 이미 보이므로
            그림 없이 글자만으로 충분하고, 그만큼 지폐를 한 장씩 더 보여 줄 수 있어요. */}
        {caption && (<React.Fragment>
          <div className="b-divider"></div>
          <div className="b-item b-caption"><b>{caption}</b><Speak text={caption} /></div>
        </React.Fragment>)}
      </div>
      {wallet && <Wallet amount={remaining} over={over}
        onReset={onWalletReset ? ()=>{ sayBtn('지갑을 다시 정할까요?'); setAskReset(true); } : null} />}
      {art && <div className="topbar-art">{art}</div>}
      </div>

      {askReset && (
        <div className="overlay" onClick={()=>setAskReset(false)}>
          <div className="modal center" style={{flexDirection:'column', gap:18, maxWidth:440}} onClick={e=>e.stopPropagation()}>
            <div style={{fontSize:'3.4em'}}>👛</div>
            <div className="section-title" style={{margin:0, justifyContent:'center'}}>지갑을 다시 정할까요? <Speak text="지갑을 다시 정할까요?" /></div>
            <p className="muted center" style={{margin:0}}>지금 담은 문구는 그대로 있어요.</p>
            <div className="row center" style={{gap:12}}>
              <button className="btn ghost big" onClick={()=>setAskReset(false)}>아니요, 계속 쇼핑할래요</button>
              <button className="btn primary big" onClick={()=>{ setAskReset(false); onWalletReset && onWalletReset(); }}>네, 다시 정할래요</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

/* =========================================================
   ① 구경하GO!
========================================================= */
function BrowseStage({settings, products, likes, setLikes, basket, setBasket, budget, total, remaining, maxItems, onNext, onCheckout, celebrate, onWalletReset, onChangeCharacter, onAddProduct}){
  const [floor, setFloor] = useState(()=> lastBrowse.floor);       // null=입장 전 | 1·2·3=층 파노라마
  const [scene, setScene] = useState(()=> lastBrowse.scene);       // facade(건물 정면) | elevator(엘리베이터)
  const [evFrom, setEvFrom] = useState(()=> lastBrowse.floor||1);  // 엘리베이터 출발 층
  useEffect(()=>{ lastBrowse = {floor, scene}; }, [floor, scene]); // 다시 와도 같은 층에서 이어가요
  const [corner, setCorner] = useState(null);
  const [detail, setDetail] = useState(null);
  const [showLiked, setShowLiked] = useState(false);
  const [quickAdd, setQuickAdd] = useState(false);   // 코너에서 바로 문구 더하기 창
  const inBasket = (id)=> basket.some(p=>p.id===id);
  const toggleLike = (p)=>{
    setLikes(l=> l.some(x=>x.id===p.id)? l.filter(x=>x.id!==p.id) : [...l, p]);
  };
  const qtyIn = (id)=> { const f = basket.find(p=>p.id===id); return f ? qtyOf(f) : 0; };
  /* ⚠️ 개수를 바꿀 땐 반드시 setBasket(b=> ...) 안에서 '지금 b'를 보고 계산해요 (2026-08-09).
     바깥의 basket 값을 보고 계산하면, 빠르게 두 번 누를 때 두 번 다 '옛 개수'를 보고
     같은 결과를 써서 한 번만 눌린 것처럼 됩니다. 손이 떨려 연속으로 눌리는 학생에게 꼭 필요해요. */
  const addBasket = (p)=>{
    if(countOf(basket) >= maxItems){ speak(`바구니에는 ${maxItems}개까지 담을 수 있어요.`); return; }
    // 예산을 넘어도 막지 않아요. 좋아하는 문구를 자유롭게 담고, 필요하면 스스로 바꿔요.
    const already = inBasket(p.id);
    setBasket(b=> b.some(x=>x.id===p.id)
      ? b.map(x=> x.id===p.id ? {...x, qty:qtyOf(x)+1} : x)
      : [...b, {...p, qty:1}]);
    playSfx('drop'); celebrate();
    speak(already ? p.name+' 하나 더 담았어요.' : p.name+'을 바구니에 담았어요.');
  };
  /* ➖ : 2개 이상이면 하나 줄이고, 1개일 때 누르면 바구니에서 빼요 */
  const lessBasket = (p)=>{
    const last = qtyIn(p.id) <= 1;
    setBasket(b=>{
      const cur = b.find(x=>x.id===p.id);
      if(!cur) return b;
      return qtyOf(cur) <= 1 ? b.filter(x=>x.id!==p.id)
                             : b.map(x=> x.id===p.id ? {...x, qty:qtyOf(x)-1} : x);
    });
    playSfx('drop');
    speak(last ? p.name+'을 바구니에서 뺐어요.' : p.name+' 하나 뺐어요.');
  };
  const removeBasket = (id)=> setBasket(b=>b.filter(p=>p.id!==id));

  const list = showLiked ? likes
    : corner ? products.filter(p=>p.corner===corner)
    : [];

  /* 건물 정면(문을 열기 전)에는 위쪽 예산바를 아예 감춰요 (2026-07-28).
     아직 아무것도 안 샀으니 예산·합계·바구니가 할 일이 없고, 지갑은 바로 앞 화면에서 봤어요.
     대신 '문구점 앞에 도착했다'는 그림을 온전히 크게 보여 줍니다. */
  const onFacade = !corner && !showLiked && floor==null && scene==='facade';

  return (
    <div className="col" style={{gap:9}}>
      {!onFacade && (
        <BudgetBar name={settings.name} budget={budget} total={total} remaining={remaining} basketCount={countOf(basket)} maxItems={maxItems} wallet={settings.walletView!==false} onWalletReset={onWalletReset} onBasket={onNext}
          caption="문구점을 구경해요" onChangeCharacter={onChangeCharacter} />
      )}

      {!corner && !showLiked && floor==null && scene==='facade' && (
        <StoreFacade onEnter={()=>{
          // 문을 열면 바로 1층 매장에 도착해요 (엘리베이터는 위층에 갈 때만 타요)
          setEvFrom(1); setFloor(1);
          const f = FLOORS.find(x=>x.no===1);
          speak('문구점 1층에 들어왔어요. '+f.desc+' 코너가 있어요. 위층에 가고 싶으면 엘리베이터를 타요.');
        }} />
      )}

      {/* onCheckout : 다 골랐으면 층을 거치지 않고 엘리베이터에서 곧장 계산대로 (2026-08-09).
          바구니가 비어 있으면 단추 자체를 만들지 않아요(null) — 누를 수 없는 단추를
          보여 주는 것보다, 담은 뒤에 나타나는 편이 학생에게 덜 헷갈립니다. */}
      {!corner && !showLiked && floor==null && scene==='elevator' && (
        <ElevatorScene from={evFrom}
          onStay={()=>{ setFloor(evFrom); speak(evFrom+'층으로 다시 왔어요.'); }}
          onCheckout={ basket.length>0 ? onCheckout : null }
          onArrive={(no)=>{
            const f = FLOORS.find(x=>x.no===no);
            setFloor(no); speak(no+'층이에요. '+f.desc+' 코너가 있어요. 화면을 밀면서 구경해 보세요.');
          }} />
      )}

      {!corner && !showLiked && floor!=null && (
        <FloorPanorama floorNo={floor} products={products} likesCount={likes.length}
          onCorner={(id)=>{
            const c = CORNERS.find(x=>x.id===id);
            setCorner(id); speak(c.title+' 코너예요. '+c.desc);
          }}
          onElevator={()=>{ setEvFrom(floor); setFloor(null); setScene('elevator'); }}
          onLiked={()=>{ setShowLiked(true); speak('내가 "좋아요"를 누른 문구예요.'); }} />
      )}

      {(corner || showLiked) && (
        <div>
          <div className="corner-head">
            {corner && <BgImg name={'코너_'+CORNERS.find(c=>c.id===corner).title} />}
            <div className="row" style={{margin:0, position:'relative', zIndex:1}}>
              <button className="btn ghost" onClick={()=>{setCorner(null); setShowLiked(false);}}>⬅️ 매장으로 돌아가기</button>
              <div className="section-title corner-title" style={{margin:0}}>
                {showLiked? '💗 좋아요'
                  : <React.Fragment><CornerIcon id={corner} /> {CORNERS.find(c=>c.id===corner).title} 코너</React.Fragment>}
              </div>
              {/* 선생님이 진열된 문구를 보면서 그 자리에서 우리 반 문구를 넣을 수 있어요.
                  설정 화면(12번)까지 가지 않아도 되고, 코너는 이미 정해져 있습니다. (2026-08-09) */}
              {corner && onAddProduct && (
                <button className="btn ghost sm add-here" title="이 코너에 우리 반 문구 넣기"
                  onClick={()=>{ stopSpeak(); setQuickAdd(true); }}>＋ 우리 반 문구</button>
              )}
            </div>
          </div>
          {list.length===0 && <div className="card muted">아직 담긴 문구가 없어요.</div>}
          <Paged items={list} per={6} resetKey={(corner||'')+'_'+(showLiked?'liked':'')}
            render={p=>(
              <ProductCard key={p.id} p={p} liked={likes.some(x=>x.id===p.id)} qty={qtyIn(p.id)}
                soldOut={settings.soldOut && p.id==='d4'} onLike={()=>toggleLike(p)}
                onDetail={()=>setDetail(p)} onAdd={()=>addBasket(p)} onLess={()=>lessBasket(p)} />
            )} />
          <div className="row" style={{marginTop:10, justifyContent:'flex-end'}}>
            <button className="btn primary big" disabled={basket.length===0}
              onClick={()=> basket.length? onNext() : speak('먼저 마음에 드는 문구를 바구니에 담아 주세요.')}>
              🧺 이제 골라볼래요 ({countOf(basket)}개) ▶
            </button>
          </div>
        </div>
      )}

      {/* 자세히 보기 창: 처음 담을 땐(onAdd) 예전처럼 창이 닫히고,
          이미 담은 뒤엔 창 안에서 ➖ ➕ 로 개수를 바꿔요(onPlus·onLess). */}
      {detail && <DetailModal p={detail} liked={likes.some(x=>x.id===detail.id)} qty={qtyIn(detail.id)}
        onLike={()=>toggleLike(detail)}
        onAdd={()=>{addBasket(detail); setDetail(null);}}
        onPlus={()=>addBasket(detail)} onLess={()=>lessBasket(detail)}
        onClose={()=>setDetail(null)} />}

      {quickAdd && corner && <QuickAddModal corner={corner}
        onAdd={(p)=>{ onAddProduct(p); playSfx('done'); speak(p.name+'을 매장에 넣었어요.'); }}
        onClose={()=>setQuickAdd(false)} />}
    </div>
  );
}

/* ---------- 상품 페이지 넘기기 (스크롤 대신 ◀ 이전 / 다음 ▶ 버튼) ---------- */
/* 쪽 표시는 '1 / 2 쪽'입니다 — 갈래 이름은 일부러 안 띄워요 (2026-08-11).
   한때 여기에 '쓰는 것 (1/2)'처럼 갈래를 띄웠지만, 화면을 간결하게 두기로 해서
   뺐습니다. 갈래는 상품을 늘어놓은 '순서'로 남아 있어요 (PRODUCTS 위 표 참고). */
function Paged({items, per, resetKey, render, cls, followLast}){
  const [page, setPage] = useState(0);
  const p = per||4;
  const pages = Math.max(1, Math.ceil(items.length/p));
  useEffect(()=>{ setPage(0); }, [resetKey]);
  /* followLast: 목록이 늘어나면(점원이 물건을 하나씩 안내할 때) 방금 추가된
     물건이 있는 마지막 쪽으로 화면이 자동으로 넘어가요. 학생이 '다음'을 누르지
     않아도 지금 안내되는 물건과 가격을 눈으로 함께 볼 수 있어요. (2026-07-28) */
  useEffect(()=>{ if(followLast) setPage(Math.max(0, Math.ceil(items.length/p)-1)); }, [followLast, items.length, p]);
  const cur = Math.min(page, pages-1);
  const slice = items.slice(cur*p, cur*p+p);
  return (
    <div className="col" style={{gap:14}}>
      <div className={(cls||'grid')+' paged'}>{slice.map((it,i)=> render(it, i, cur*p+i===items.length-1))}</div>
      {pages>1 && (
        <div className="pager">
          <button className="btn sky" disabled={cur===0}
            onClick={()=>{ setPage(cur-1); speak('앞을 봐요.'); }}>◀ 이전</button>
          <span className="col" style={{alignItems:'center', gap:6}}>
            <span className="pager-info">{cur+1} / {pages} 쪽</span>
            <span className="pager-dots">{Array.from({length:pages}).map((_,i)=><i key={i} className={i===cur?'on':''}></i>)}</span>
          </span>
          <button className="btn primary" disabled={cur===pages-1}
            onClick={()=>{ setPage(cur+1); speak('다음을 봐요.'); }}>다음 ▶</button>
        </div>
      )}
    </div>
  );
}

      <div className="building">

/* ---------- 게임풍 도입 ①: 건물 정면 — 문을 눌러 열고 들어가요 ---------- */
/* 건물 그림(공용): 홈 화면과 매장 입장 화면에서 함께 써요 */
function FacadeBuilding({opening, onDoor}){
  return (
    <div className="facade">
      <div className="f-roof">🛍️ GO! 문구마켓</div>
      {[...FLOORS].reverse().map(f=>(
        <div key={f.no} className="f-row" style={{background:f.wall}}>
          <span className="f-no">{f.no}층</span>
          {f.corners.map(id=>(
            <span key={id} className="f-window"><CornerIcon id={id} /></span>
          ))}
        </div>
      ))}
      <div className="f-ground">
        <div className="f-awning"></div>
        <button className={"f-door"+(opening?' open':'')} onClick={onDoor} aria-label="문을 열고 들어가기">
          <span className="f-door-panel left"></span>
          <span className="f-door-panel right"></span>
          <span className="f-door-label">{opening? '어서 오세요!' : '🚪 문을 눌러 들어가요'}</span>
        </button>
      </div>
    </div>
  );
}

/* 건물 그림 자동 선택: 이미지/배경/건물.png 가 있으면 그 그림 + 문 애니메이션 겹침,
   없으면 CSS로 그린 건물. (그림의 아래 가운데를 출입구로 비워 두는 규칙 — 가이드 참고) */
function FacadeArt({opening, onDoor}){
  const srcs = imgList('이미지/배경/건물');
  const [i, setI] = useState(0);
  const [ok, setOk] = useState(null);   // null=시도 중 | true=그림 사용 | false=CSS 건물
  if(ok===false) return <FacadeBuilding opening={opening} onDoor={onDoor} />;
  return (
    <div className="facade-art">
      <img className="facade-img" src={srcs[i]} alt="GO! 문구마켓 건물"
        onLoad={()=>setOk(true)}
        onError={()=>{ if(i<srcs.length-1) setI(i+1); else setOk(false); }} />
      {ok && (
        <React.Fragment>
          {/* 건물 간판(빈 판)에 가게 이름을 얹어요 */}
          <div className="facade-title"><span className="ft-go">GO!</span> 문구마켓</div>
          {/* 문 위에는 글자를 얹지 않아요 — 대문이 가려져서 아래로 내렸어요(StoreFacade 참고) */}
          <button className={"f-door art-door"+(opening?' open':'')} onClick={onDoor} aria-label="문을 열고 들어가기">
            <span className="f-door-panel left"></span>
            <span className="f-door-panel right"></span>
          </button>
        </React.Fragment>
      )}
    </div>
  );
}

/* 건물 정면 안내 문구 — 화면 글자와 음성이 같아야 해서 한 곳에 두고 같이 씁니다 */
const FACADE_HINT = '문구마켓에 도착했어요! 문을 눌러 볼까요?';
function StoreFacade({onEnter}){
  const [opening, setOpening] = useState(false);
  /* 안내는 '도착했을 때' 해요. 예전엔 문을 누르는 순간에야 말이 시작돼서,
     0.95초 뒤 1층으로 넘어가며 말이 뚝 끊겼어요(자동 안내를 켠 교실에서 문제됨). */
  useEffect(()=>{ speak(FACADE_HINT); }, []);
  const open = ()=>{
    if(opening) return;
    setOpening(true);
    stopSpeak();                // 안내가 아직 나오는 중이면 멈추고
    playSfx('bell');            // 가게 문 방울 소리로 '들어간다'를 알려요
    /* 여기서 또 말을 걸지 않아요 — 어차피 0.95초 뒤 1층 안내가 시작되며 끊기고,
       문에는 이미 '어서 오세요!' 글자가 뜨거든요. */
    setTimeout(onEnter, 950);
  };
  /* ⚠️ 2026-07-29: 문구를 건물 아래로 내리려고 .facade-wrap 으로 감쌌더니
     배경 그림(건물배경)이 가로로 줄어들어 사라져 보였어요 → 예전 배치로 되돌렸습니다.
     대문을 가리던 문 위 라벨('🚪 문을 눌러 들어가요')만 없앴어요. */
  return (
    <div className="facade-scene">
      <BgImg name="건물배경" />
      <FacadeArt opening={opening} onDoor={open} />
      <div className="scene-hint">
        🏬 {FACADE_HINT}
        <Speak text={FACADE_HINT} />
      </div>
    </div>
  );
}

/* 홈 화면용 건물: 문을 누르면 바로 문구점에 들어가요.
   ※ 지금은 화면에 쓰이지 않아요 — 홈은 큰 메인 그림(문구점 메인.png)을 누르는 방식이고,
     문을 여는 장면은 구경하GO의 StoreFacade 한 곳뿐이에요.
     홈을 건물 그림으로 바꾸고 싶어질 때를 위해 남겨 둡니다. */
function HomeFacade({onEnter}){
  const [opening, setOpening] = useState(false);
  const open = ()=>{
    if(opening) return;
    setOpening(true);
    playSfx('bell');
    speak('문이 열려요. 어서 오세요!');
    setTimeout(onEnter, 900);
  };
  return (
    <div className="home-facade">
      <FacadeArt opening={opening} onDoor={open} />
    </div>
  );
}

/* ---------- 게임풍 도입 ②: 엘리베이터 — 층 버튼을 눌러 이동해요 ---------- */
function ElevatorScene({from, onArrive, onStay, onCheckout}){
  const start = from || 1;
  const [phase, setPhase] = useState('closed');   // closed | opening | open | closing | moving | arriving
  const [target, setTarget] = useState(null);
  const [ind, setInd] = useState(start);           // 층 표시등
  const [called, setCalled] = useState(null);      // 누른 호출 버튼 'up' | 'down'
  const timers = useRef([]);
  const later = (fn, ms)=>{ timers.current.push(setTimeout(fn, ms)); };
  useEffect(()=> ()=> timers.current.forEach(clearTimeout), []);

  // ▲▼ 호출 버튼 → 문이 열려요
  const call = (dir)=>{
    if(phase!=='closed') return;
    setCalled(dir); setPhase('opening');
    playSfx('ding');            // 엘리베이터가 도착해 문이 열리는 차임
    /* 문이 열리는 건 '띵' 소리와 열리는 그림이 알려 줘요 — 여기서 말을 걸지 않아요.
       예전엔 '엘리베이터가 왔어요. 문이 열려요.'(약 2.5초)를 말하고 0.85초 만에
       다음 안내가 시작돼, 앞말이 '엘리베이터…'에서 뚝 끊겼어요.
       그래서 '엘리베이터'를 두 번 말하는 것처럼 들렸어요. */
    later(()=>{ setPhase('open'); speak('엘리베이터에 탔어요. 몇 층으로 갈까요?'); }, 850);
  };

  // 엘리베이터 안의 층 버튼 → 문 닫고 이동
  const go = (no)=>{
    if(phase!=='open') return;
    setTarget(no); setPhase('closing');
    speak(no+'층 버튼을 눌렀어요.');
    later(()=>{
      if(no===start){
        /* 도착 안내는 '띵' 소리와 화면 글자에 맡겨요.
           여기서 말을 걸면 곧바로 층 화면의 안내(“○층이에요. ○○ 코너가 있어요…”)가
           시작되며 말이 뚝 끊겨요. 게다가 두 안내가 다 “○층이에요”로 겹쳐요. */
        setPhase('arriving'); playSfx('ding');
        later(()=> onArrive(no), 1000);
        return;
      }
      setPhase('moving');
      const dir = no>start? 1 : -1;
      let cur = start;
      const iv = setInterval(()=>{
        cur += dir; setInd(cur);
        if(cur===no){
          clearInterval(iv);
          /* 도착 안내는 '띵' 소리와 화면 글자로 — 말은 층 화면이 이어받아요 (위 설명 참고) */
          later(()=>{ setPhase('arriving'); playSfx('ding'); }, 350);
          later(()=> onArrive(no), 1500);
        }
      }, 550);
      timers.current.push(iv);
    }, 800);
  };

  const doorsOpen = (phase==='open' || phase==='arriving');
  const targetFloor = target? FLOORS.find(f=>f.no===target) : null;
  const msg = {
    closed:'🛗 오른쪽 ▲ 또는 ▼ 버튼을 눌러 엘리베이터를 불러요!',
    opening:'엘리베이터가 왔어요. 문이 열려요…',
    open:'몇 층으로 갈까요? 엘리베이터 안의 버튼을 눌러요!',
    closing:'문이 닫혀요…',
    moving:'위잉— 이동해요!',
    arriving:(target||'')+'층 도착! 문이 열려요',
  }[phase];

  return (
    <div className="elev-scene">
      <BgImg name="엘리베이터배경" />
      {/* 왼쪽: 층별 안내판 */}
      <div className="ev-board">
        <div className="ev-board-title">🏬 층별 안내</div>
        {[...FLOORS].reverse().map(f=>(
          <div key={f.no} className="ev-board-row" style={{background:f.wall}}>
            <span className="ev-board-no">{f.no}층</span>
            <span className="ev-board-desc">
              <span className="ev-board-icons">{f.corners.map(id=><CornerIcon key={id} id={id} />)}</span>
              <b>{f.desc}</b>
            </span>
          </div>
        ))}
      </div>

      {/* 가운데: 엘리베이터 (문 안에 층 버튼) */}
      <div className={"ev-frame"+(phase==='moving'?' moving':'')}>
        <div className="ev-ind">{phase==='moving'? '▲ ' : '● '}{ind}층</div>
        <div className={"ev-doors"+(doorsOpen?' open':'')}>
          <span className="ev-door left"></span>
          <span className="ev-door right"></span>
          <div className="ev-inside" style={targetFloor && phase==='arriving'? {background:targetFloor.wall}:null}>
            {(phase==='closed' || phase==='opening') ? (
              <span></span>   /* 문이 닫혀 있을 땐 빈 채로 — 엘리베이터 그림 안에 또 엘리베이터 이모지를 넣지 않아요 */
            ) : (
              <React.Fragment>
                {phase==='arriving' && targetFloor && (
                  <div className="ev-arrive"><b>{target}층 도착!</b></div>
                )}
                {phase==='open' && (
                  <div className="ev-inpanel">
                    <span className="ev-inpanel-lbl">몇 층?</span>
                    <span className="ev-inpanel-row">
                      {FLOORS.map(f=>{
                        const here = f.no===start;   // 지금 있는 층은 누를 수 없어요(회색)
                        return (
                          <button key={f.no} className={"ev-inbtn"+(target===f.no?' on':'')+(here?' here':'')}
                            disabled={here} onClick={()=>go(f.no)}
                            aria-label={here? f.no+'층 — 지금 있는 층':(f.no+'층 — '+f.desc)}>
                            {f.no}{here && <span className="ev-here">지금</span>}
                          </button>
                        );
                      })}
                    </span>
                  </div>
                )}
                {(phase==='closing' || phase==='moving') && (
                  <span className="ev-riding-lbl">{phase==='moving'?'타는 중…':'문이 닫혀요…'}</span>
                )}
                {/* 내 캐릭터가 엘리베이터를 타요 */}
                <div className={"ev-rider"+(phase==='moving'?' riding':'')}>
                  <Avatar size={96} />
                  {currentStudentName && <div className="pano-char-name">{currentStudentName}</div>}
                </div>
              </React.Fragment>
            )}
          </div>
        </div>
      </div>

      {/* 오른쪽: 실제 엘리베이터처럼 ▲▼ 호출 버튼 */}
      <div className="ev-call">
        <span className="ev-call-lbl">엘리베이터<br/>부르기</span>
        <button className={"ev-call-btn up"+(called==='up'?' on':'')} disabled={phase!=='closed' || start===FLOORS[FLOORS.length-1].no}
          onClick={()=>call('up')} aria-label="위로 가는 엘리베이터 부르기">▲</button>
        <button className={"ev-call-btn down"+(called==='down'?' on':'')} disabled={phase!=='closed' || start===FLOORS[0].no}
          onClick={()=>call('down')} aria-label="아래로 가는 엘리베이터 부르기">▼</button>
        {/* 아래 단추는 딱 두 가지 뜻만 남겼어요 — '다 샀다'와 '더 볼래' (2026-08-09).
            예전엔 '🚪 밖으로 나가기'가 하나 더 있었는데 뺐습니다:
            밖에는 할 일이 없고(다시 들어오려면 문을 또 눌러야 함), 잘못 누르면 흐름이 끊겼어요.
            실제 엘리베이터에도 '밖으로 나가는 버튼'은 없습니다.
            문 열고 들어가기를 다시 해 보려면 처음 화면에서 새로 시작하면 돼요. */}
        {/* 다 골랐으면 층을 다시 거치지 않고 여기서 곧장 계산대로 — 바구니가 비면 안 나와요 */}
        {onCheckout && <button className="ev-exit checkout" onClick={()=>{ stopSpeak(); onCheckout(); }}
          disabled={phase!=='closed' && phase!=='open'}>🧾 계산대로 가기</button>}
        {/* 마음이 바뀌면 타지 않고 원래 있던 층으로 그냥 돌아갈 수 있어요 */}
        {onStay && <button className="ev-exit stay" onClick={onStay} disabled={phase!=='closed' && phase!=='open'}>↩️ {start}층으로 돌아가기</button>}
      </div>

      <div className="scene-hint">{msg}</div>
    </div>
  );
}

/* ---------- 1인칭 매장 파노라마 (내 캐릭터가 진열대로 걸어가요) ---------- */
/* 층 배경 그림 : 이미지/배경/N층.png 를 '통짜'로 보여줘요(좌우로 다 둘러볼 수 있게). */
function PanoFloor({floorNo, wall}){
  const srcs = imgList('이미지/배경/'+floorNo+'층');
  const [i, setI] = useState(0);
  const [failed, setFailed] = useState(false);
  if(failed) return <div className="pano-floor-fallback" style={{background:wall}}></div>;
  return <img className="pano-floor-img" src={srcs[i]} alt="" aria-hidden="true"
    onError={()=>{ if(i<srcs.length-1) setI(i+1); else setFailed(true); }} />;
}

/* 좋아한 문구 그림 — 이미지\좋아한 문구 아이콘.png 가 있으면 그 그림, 없으면 이모지 */
function LikedMark(){
  const srcs = imgList('이미지/좋아한 문구 아이콘');
  const [i, setI] = useState(0);
  const [failed, setFailed] = useState(false);
  if(failed) return <React.Fragment><span className="shelf-item">💗</span><span className="shelf-item">🛍️</span></React.Fragment>;
  return <img className="shelf-liked-img" src={srcs[i]} alt=""
    onError={()=>{ if(i<srcs.length-1) setI(i+1); else setFailed(true); }} />;
}
/* 코너 진열대의 '대표 그림' — 2026-08-09
   예전엔 진열대마다 상품 사진을 6개씩 늘어놓았어요. 1층만 해도 18개가 한 화면에 떠서
   "정보가 너무 많다"는 이야기가 나왔습니다. 이제 코너마다 큰 그림 한 장만 보여 줘요.
   (물건은 진열대를 눌러 코너에 들어가면 차분히 볼 수 있어요.)

   그림 자리: 이미지\코너대표\쓰기.png · 그리기.png · 꾸미기.png … (코너 이름 그대로)
   그림이 없으면 이미 있는 코너 아이콘(SVG)을 크게 그려요 — 그래서 아무것도 안 넣어도 됩니다. */
function CornerBigMark({id}){
  const c = CORNERS.find(x=>x.id===id);
  const srcs = imgList('이미지/코너대표/'+(c? c.title : id));
  const [i, setI] = useState(0);
  const [failed, setFailed] = useState(false);
  if(failed) return <span className="shelf-bigicon"><CornerIcon id={id} /></span>;
  return <img className="shelf-rep-img" src={srcs[i]} alt=""
    onError={()=>{ if(i<srcs.length-1) setI(i+1); else setFailed(true); }} />;
}
function ShelfUnit({shelf, items, likesCount, accent, style, innerRef, onClick, here}){
  if(shelf.kind==='liked'){
    return (
      <button className={"shelf heart"+(here?' here':'')} ref={innerRef} style={style} onClick={onClick} aria-label="좋아요를 누른 문구 보기">
        <span className="shelf-sign" style={{background:'#ff8a8a'}}>💗 좋아요</span>
        {/* 개수 라벨('하트 누른 문구 ○개')을 뺐어요 (2026-07-29).
            이 진열대만 아래에 라벨이 하나 더 붙어서 다른 진열대와 높이가 안 맞고
            혼자 붕 떠 보였어요. 개수는 몰라도 되는 정보예요. */}
        <span className="shelf-body"><span className="shelf-row"><LikedMark /></span></span>
      </button>
    );
  }
  const c = shelf.c;
  return (
    <button className={"shelf"+(here?' here':'')} ref={innerRef} style={style} onClick={onClick}
      aria-label={c.title+' 코너 진열대'+(here?' — 지금 여기예요. 한 번 더 누르면 들어가요':'')}>
      {/* 간판은 글자만 — 바로 아래 대표 그림과 같은 아이콘이 두 번 나오지 않게 (2026-08-09) */}
      <span className="shelf-sign" style={{background:accent}}>{c.title}</span>
      <span className="shelf-body">
        <span className="shelf-row rep"><CornerBigMark id={c.id} /></span>
      </span>
      {/* '눌러서 구경하기' 라벨을 뺐어요 (2026-07-28).
          진열대마다 똑같은 말이 3~4번 반복되는데, 화면 아래 안내
          "진열대를 누르면 내 캐릭터가 그 앞으로 걸어가요"와도 겹쳤어요.
          게다가 캐릭터가 진열대 가운데에 서면 이름표와 라벨이 포개져 글자를 읽기 어려웠어요.
          누를 수 있다는 단서는 아래 안내 한 줄 + 캐릭터가 설 때의 노란 테두리(.shelf.here)로 충분해요.
          ※ '좋아한 문구' 진열대의 라벨은 개수를 알려 주는 정보라서 그대로 둡니다. */}
    </button>
  );
}

function FloorPanorama({floorNo, products, likesCount, onCorner, onElevator, onLiked}){
  const floor = FLOORS.find(f=>f.no===floorNo);
  const viewRef = useRef(null);
  const stripRef = useRef(null);
  const shelfRefs = useRef({});
  const [pan, setPan] = useState(0);
  const [drag, setDrag] = useState(null);
  const [charX, setCharX] = useState(0);      // 캐릭터의 매장 안 가로 위치(px)
  const [walking, setWalking] = useState(false);
  const [atShelf, setAtShelf] = useState(null);   // 캐릭터가 지금 서 있는 진열대 (두 번째 누르면 들어가요)
  const [ready, setReady] = useState(false);
  const moved = useRef(false);

  // 진열대 목록(코너 + 좋아한 문구)을 매장 가운데에 나란히 배치해요.
  const shelves = floor.corners.map(id=>({key:id, kind:'corner', id, c:CORNERS.find(x=>x.id===id)}));
  if(likesCount>0) shelves.push({key:'liked', kind:'liked'});
  const n = shelves.length;
  /* 진열대 자리 (2026-07-29 → 2026-08-03 간격 조정)
     예전엔 '매장 폭의 20%'로 벌렸는데, 태블릿은 층 그림이 작아지면서 20%가
     진열대 폭보다 좁아져 진열대끼리 딱 붙어 버렸어요.
     이제 '진열대 폭 + 70px'만큼 px로 벌려서, 화면이 작아도 간격이 늘 같아요.
     (--shelfw 는 화면 크기에 따라 CSS에서 310/250/215px 로 바뀝니다)
     📌 간격을 바꾸려면 아래 70px 숫자만 고치면 됩니다.
        벌릴수록 매장이 옆으로 길어져서 ◀▶를 더 눌러야 하니 균형을 볼 것. */
  const SHELF_GAP = 70;
  const posCss = (i)=>{
    const off = i - (n-1)/2;                       // …-1.5, -0.5, 0.5, 1.5…
    if(off === 0) return '50%';
    const sign = off < 0 ? '-' : '+';
    return `calc(50% ${sign} ${Math.abs(off)} * (var(--shelfw) + ${SHELF_GAP}px))`;
  };

  /* 진열대의 '가운데' 좌표.
     ⚠️ `.shelf`는 left:○○% + transform:translateX(-50%) 로 놓여 있어서
        offsetLeft 가 이미 '가운데'예요. 여기에 폭의 절반을 또 더하면
        캐릭터가 진열대에서 한참 오른쪽(폭의 절반=141px)에 서게 됩니다.
        캐릭터(.pano-char)도 같은 방식이라 left 값이 곧 가운데예요. */
  const shelfCenter = (el)=> el.offsetLeft;
  const maxPan = ()=>{ const vw=viewRef.current?viewRef.current.clientWidth:0; const sw=stripRef.current?stripRef.current.scrollWidth:0; return Math.max(0, sw-vw); };
  const clamp = (v)=> Math.max(0, Math.min(v, maxPan()));
  /* ◀▶ 는 '그쪽으로 걸어가기' — 캐릭터가 걷고 화면이 따라가요.
     예전엔 화면(카메라)만 옮겨서, 오른쪽 끝 진열대를 보러 가면 캐릭터는 왼쪽에 남아
     화면 밖으로 사라졌어요. 그러면 “나 어디 있지?”가 되고,
     '내 캐릭터가 매장을 돌아다니며 구경한다'는 이 앱의 느낌이 깨져요.
     (드래그는 그대로 화면만 움직여요 — 가만히 둘러보기용) */
  /* 캐릭터가 걸어다닐 수 있는 범위 = 첫 진열대 ~ 마지막 진열대 (2026-07-27).
     이걸 안 두면 진열대가 없는 빈 매장 구석까지 걸어가서 '길 잃은' 느낌이 나요. */
  const walkRange = ()=>{
    const xs = shelves.map(s=>shelfRefs.current[s.key]).filter(Boolean).map(shelfCenter);
    if(!xs.length) return null;
    return { min: Math.min.apply(null, xs), max: Math.max.apply(null, xs) };
  };
  const turn = (dir)=>{
    if(walking) return;
    const vw = viewRef.current ? viewRef.current.clientWidth : 0;
    const r = walkRange();
    if(!r) return;
    const step = (vw || 580) * 0.55;
    const nx = Math.max(r.min, Math.min(charX + dir*step, r.max));
    if(Math.abs(nx - charX) < 1) return;               // 양 끝에 닿았으면 그대로
    setWalking(true);
    setCharX(nx);
    setPan(clamp(nx - vw/2));
    /* 화살표로 움직이면 진열대 '앞'이 아니게 되므로, 다시 눌러서 걸어가야 들어가요 */
    setAtShelf(shelves.reduce((hit,s)=>{
      const el = shelfRefs.current[s.key];
      return (el && Math.abs(shelfCenter(el) - nx) < 8) ? s.key : hit;
    }, null));
    window.setTimeout(()=> setWalking(false), 700);    // 다음 화살표를 곧 누를 수 있게 짧게
  };

  // 시작할 때 첫 진열대 앞에 캐릭터를 세우고 카메라를 맞춰요
  // (캐릭터는 '진열대를 누를 때만' 걸어가요 — 마우스를 따라다니지 않아요)
  useEffect(()=>{
    setWalking(false); setReady(false);
    let dead = false, tries = 0;
    /* 매장 폭은 '층 배경 그림'이 다 받아져야 정해져요. 그 전에는 진열대 위치가 0으로 읽혀서
       캐릭터가 매장 왼쪽 끝(첫 진열대가 아닌 곳)에 서 버렸어요.
       그 상태로는 ▶를 눌러도 계속 왼쪽에 머무는 것처럼 보였고요.
       그래서 위치가 제대로 읽힐 때까지 잠깐씩 다시 재 봅니다(최대 1.6초). */
    const place = ()=>{
      if(dead) return;
      const first = shelfRefs.current[shelves[0] && shelves[0].key];
      const cx = first ? shelfCenter(first) : 0;
      if(cx <= 0 && tries < 20){ tries++; setTimeout(place, 80); return; }
      const x = cx > 0 ? cx : (stripRef.current? stripRef.current.scrollWidth/2 : 200);
      setCharX(x);
      const vw = viewRef.current? viewRef.current.clientWidth : 0;
      setPan(clamp(x - vw/2));
      /* 매장에 들어오면 첫 진열대 앞에 서 있으므로, 그 진열대는 한 번만 눌러도 들어가요 */
      setAtShelf(cx > 0 && shelves[0] ? shelves[0].key : null);
      setReady(true);
    };
    const t = setTimeout(place, 60);
    return ()=>{ dead = true; clearTimeout(t); };
  }, [floorNo]);

  const onDown = (e)=>{ if(walking) return; moved.current=false; setDrag({x:e.clientX, pan}); };
  const onMove = (e)=>{ if(!drag) return; const d=e.clientX-drag.x; if(Math.abs(d)>8) moved.current=true; setPan(clamp(drag.pan-d)); };
  const onUp = ()=> setDrag(null);

  /* 진열대 누르기는 '두 걸음'이에요 (2026-07-27).
       첫 번째 누름 → 캐릭터가 그 앞으로 걸어가기만 해요.
       두 번째 누름 → 그때 코너로 들어가요.
     예전엔 한 번 누르면 2초 뒤 저절로 들어가서, 매장을 밀다가 손이 스치거나
     잘못 눌러도 원치 않는 코너로 들어가 버렸어요.
     ※ '더블클릭'이 아니라 '두 번 누르기'입니다 — 빨리 눌러야 하는 시간 제한이 없어요.
        발달·지적장애 학생에게 더블클릭은 어렵고, 태블릿 터치에서는 더 어렵습니다.
     ※ 캐릭터가 이미 그 진열대 앞에 서 있으면(=매장에 막 들어와 첫 진열대 앞일 때)
        한 번 누르면 바로 들어가요. 규칙은 '내가 서 있는 곳의 진열대를 누르면 들어간다'. */
  const reduce = document.body.classList.contains('reduce-motion');
  const walkTo = (key, cb)=>{
    if(walking || moved.current) return;
    const el = shelfRefs.current[key];
    if(!el){ cb(); return; }
    if(atShelf === key){ cb(); return; }            // 이미 그 앞이면 → 들어가요
    const target = shelfCenter(el);
    const vw = viewRef.current ? viewRef.current.clientWidth : 0;
    setCharX(target);
    setPan(clamp(target - vw/2));                   // 카메라가 캐릭터를 따라가요
    setAtShelf(key);
    if(reduce) return;
    setWalking(true);
    window.setTimeout(()=> setWalking(false), 1200);
  };

  return (
    <div className="pano-frame">
      <div className="pano-top">
        <span>🏬 {floor.title} · {floor.desc}</span>
        <span className="spacer" style={{flex:1}}></span>
        <span className="elev">
          <button className="elev-btn" onClick={onElevator} disabled={walking}>🛗 엘리베이터 타기 (다른 층 가기)</button>
        </span>
      </div>
      <div className="pano-view" ref={viewRef} style={{background:floor.wall}}
        onPointerDown={onDown} onPointerMove={onMove} onPointerUp={onUp} onPointerLeave={onUp}>
        <button className="pano-nav left" onClick={()=>turn(-1)} disabled={pan<=0||walking} aria-label="왼쪽으로 둘러보기">◀</button>
        <button className="pano-nav right" onClick={()=>turn(1)} disabled={pan>=maxPan()||walking} aria-label="오른쪽으로 둘러보기">▶</button>
        <div className={"pano-strip"+(drag?' dragging':'')} ref={stripRef}
          style={{transform:'translateX('+(-pan)+'px)', visibility: ready? 'visible':'hidden'}}>
          <PanoFloor floorNo={floor.no} wall={floor.wall} />
          {shelves.map((s,i)=>(
            <ShelfUnit key={s.key} shelf={s}
              items={s.kind==='corner'? products.filter(p=>p.corner===s.id).slice(0,6) : []}
              here={atShelf===s.key}
              likesCount={likesCount} accent={floor.accent} style={{left:posCss(i)}}
              innerRef={el=>{ if(el) shelfRefs.current[s.key]=el; }}
              onClick={()=> s.kind==='corner'? walkTo(s.key, ()=>onCorner(s.id)) : walkTo(s.key, onLiked)} />
          ))}
          {/* 내 쇼핑 캐릭터 — 진열대로 걸어가요 */}
          <div className={"pano-char"+(walking?' walking':'')} style={{left:charX+'px'}} aria-hidden="true">
            <div className="pano-char-inner"><Avatar size={100} /></div>
            {currentStudentName && <div className="pano-char-name">{currentStudentName}</div>}
            <div className="pano-char-shadow"></div>
          </div>
        </div>
      </div>
      <div className="pano-hint">
        {walking ? '👟 진열대로 걸어가는 중…'
          : atShelf ? '👀 여기예요! 한 번 더 누르면 들어가요.'
          : '진열대를 누르면 내 캐릭터가 그 앞으로 걸어가요. ◀ ▶ 로 매장을 둘러봐요.'}
      </div>
    </div>
  );
}

/* 코너 사진이 있는지 한 번만 확인해서 기억해요 (없으면 기본 그림 사용) */
const cornerPhotoCache = {};
function useCornerPhoto(name){
  const [src, setSrc] = useState(()=> name ? (cornerPhotoCache[name] || null) : null);
  useEffect(()=>{
    if(!name || cornerPhotoCache[name] !== undefined) return;   // 이미 확인했으면 다시 안 해요
    const list = ['png','jpg','jpeg','webp'].map(e=>'이미지/코너/'+name+'.'+e);
    let i = 0, dead = false;
    const tryNext = ()=>{
      if(dead) return;
      if(i >= list.length){ cornerPhotoCache[name] = null; return; }
      const url = list[i++];
      const im = new Image();
      im.onload = ()=>{ if(dead) return; cornerPhotoCache[name] = url; setSrc(url); };
      im.onerror = tryNext;
      im.src = url;
    };
    tryNext();
    return ()=>{ dead = true; };
  }, [name]);
  return src;
}

function CornerIcon({id, className}){
  const c = CORNERS.find(x=>x.id===id);
  const photo = useCornerPhoto(c && c.title);
  const cls = 'cicon' + (className ? ' '+className : '');
  if(!c) return null;
  if(photo) return <img className={cls} src={photo} alt="" aria-hidden="true" />;
  return <span className={cls} aria-hidden="true">{CornerArt({id}) || c.icon}</span>;
}

/* 상품 실물 사진: 이미지/상품/<상품이름>.png 가 있으면 사진, 없으면 이모지 */

/* ── 우리 반 문구 더하기 — 함께 쓰는 도구 (2026-08-09) ──
   교사 설정(12번)과 코너 안의 '＋ 우리 반 문구' 두 곳이 같은 코드를 씁니다. */

/* 찍은 사진을 320×320 정사각형으로 줄여 저장해요.
   원본 그대로 두면 사진 한 장이 몇 MB라 브라우저 저장 공간이 금방 찹니다. */
function readProductPhoto(e, done){
  const file = e.target.files && e.target.files[0];
  e.target.value = '';
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev)=>{
    const img = new Image();
    img.onload = ()=>{
      try{
        const S=320, cv=document.createElement('canvas'); cv.width=S; cv.height=S;
        const ctx=cv.getContext('2d');
        ctx.fillStyle='#fff'; ctx.fillRect(0,0,S,S);
        const r=Math.min(S/img.width, S/img.height), w=img.width*r, h=img.height*r;
        ctx.drawImage(img, (S-w)/2, (S-h)/2, w, h);
        let url; try{ url=cv.toDataURL('image/jpeg', 0.82); }catch(_){ url=ev.target.result; }
        done(url);
      }catch(_){ done(ev.target.result); }
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

/* 입력한 값으로 '매장에 넣을 문구' 하나를 만들어요. 안 적은 칸은 무난한 말로 채웁니다. */
function makeCustomProduct(np){
  const name = (np.name||'').trim();
  return {
    id:'c'+Date.now()+Math.floor(Math.random()*1000),
    corner:np.corner, name, price:np.price, emoji:np.emoji||'🛍️',
    color:(np.color||'').trim()||'여러 색', feat:(np.feat||'').trim()||'우리 반 문구',
    use:(np.use||'').trim()||(name+'을(를) 즐겁게 사용해요.'), photo:np.photo||null, custom:true
  };
}

        </div>
      </div>
    </div>
  );
}

/* 수량 고르기 단추 (2026-08-09)
   ➖ 를 1개에서 한 번 더 누르면 바구니에서 빠져요 — '빼기' 단추를 따로 두지 않아

function ProductCard({p, liked, qty, soldOut, onLike, onDetail, onAdd, onLess}){
  const inBasket = qty>0;
  return (
