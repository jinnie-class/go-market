<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0" />
<!-- 검색엔진(구글·네이버 등)에 노출하지 않아요 — 주소를 받은 사람만 들어오도록. -->
<meta name="robots" content="noindex, nofollow" />
<title>구경하GO! 고르GO! 즐기GO!</title>
<script src="vendor/react.js"></script>
<script src="vendor/react-dom.js"></script>
<script src="vendor/babel.js"></script>
<style>
@font-face{
  font-family:'Santteutdotum';
  src:url('vendor/Santteut-Light.woff2') format('woff2');
  font-weight:400 600;font-style:normal;font-display:swap;
}
@font-face{
  font-family:'Santteutdotum';
  src:url('vendor/Santteut-Medium.woff2') format('woff2');
  font-weight:700 900;font-style:normal;font-display:swap;
}
:root{
  --white:#ffffff;
  --ink:#2b2b3a;
  --ink-soft:#5a5a6e;
  --red:#ff6b6b;
  --yellow:#ffd23f;
  --sky:#5ec8f2;
  --mint:#4ecdc4;
  --purple:#b39ddb;
  --line:#e7e7ef;
  --bg:#f6f8fc;
  --good:#2fbf71;
  --shadow:0 8px 24px rgba(50,60,90,.10);
  --shadow-lg:0 14px 40px rgba(50,60,90,.16);
  --radius:22px;
  --fs:1;            /* 글자 크기 배율 */
  /* 매장 진열대 한 칸의 폭. 진열대 사이 간격도 이 값을 기준으로 벌려요(FloorPanorama.posCss).
     화면이 작아지면 아래 미디어쿼리에서 줄어듭니다 — 태블릿에서 진열대가 붙던 문제 때문. */
  --shelfw:310px;
}
/* 태블릿·작은 노트북 : 진열대를 줄여 간격이 남게 */
@media (max-width:1200px){ :root{ --shelfw:250px; } }
@media (max-width:900px){  :root{ --shelfw:215px; } }
@media (max-height:820px){ :root{ --shelfw:250px; } }
@media (max-height:700px){ :root{ --shelfw:215px; } }
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:"한컴산뜻돋움","HancomSandeutDotum","Santteutdotum","학교안심 산뜻돋움","Malgun Gothic","맑은 고딕",sans-serif;
  background:var(--bg);
  color:var(--ink);
  font-size:calc(19px * var(--fs));
  line-height:1.55;
  word-break:keep-all;
  overflow-wrap:break-word;
  -webkit-font-smoothing:antialiased;
}
#root{min-height:100vh;}
button{font-family:inherit;cursor:pointer;}
img{max-width:100%;}

/* 애니메이션 줄이기 */
.reduce-motion *{animation:none !important;transition:none !important;}

/* 포커스 표시 */
:focus-visible{outline:4px solid var(--sky);outline-offset:3px;border-radius:8px;}

/* ===== 공통 레이아웃 (4:3 전자칠판·아이패드 기준) ===== */
.app{max-width:1060px;margin:0 auto;padding:0 16px 60px;}
.center{display:flex;align-items:center;justify-content:center;}
.col{display:flex;flex-direction:column;}
.wrap{display:flex;flex-wrap:wrap;}

/* ===== 버튼 ===== */
.btn{
  border:none;border-radius:18px;padding:16px 22px;font-size:1.05em;font-weight:800;
  background:var(--white);color:var(--ink);box-shadow:var(--shadow);
  display:inline-flex;align-items:center;gap:10px;justify-content:center;
  border:2px solid var(--line);transition:transform .12s ease, box-shadow .12s ease;
  min-height:60px;
}
.btn:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);}
.btn:active{transform:translateY(0);}
.btn.big{font-size:1.35em;padding:22px 34px;min-height:78px;border-radius:22px;}
.btn.primary{background:linear-gradient(135deg,#ff8a8a,#ff6b6b);color:#fff;border-color:transparent;}
.btn.sky{background:linear-gradient(135deg,#7dd6f6,#5ec8f2);color:#0b4a63;border-color:transparent;}
.btn.mint{background:linear-gradient(135deg,#6fded6,#4ecdc4);color:#0b4f4a;border-color:transparent;}
.btn.yellow{background:linear-gradient(135deg,#ffe17a,#ffd23f);color:#6a5200;border-color:transparent;}
.btn.purple{background:linear-gradient(135deg,#c9b6ea,#b39ddb);color:#3e2e63;border-color:transparent;}
.btn.ghost{background:#fff;}
.btn.disabled,.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none;transform:none;}
.btn.sm{padding:10px 14px;min-height:46px;font-size:.95em;border-radius:14px;}
.iconbtn{border:2px solid var(--line);background:#fff;border-radius:50%;width:52px;height:52px;
  display:inline-flex;align-items:center;justify-content:center;font-size:1.3em;box-shadow:var(--shadow);}

/* 스피커 버튼 */
.speak{border:2px solid var(--sky);background:#eaf7fe;border-radius:50%;width:46px;height:46px;
  display:inline-flex;align-items:center;justify-content:center;font-size:1.2em;flex:0 0 auto;}
.speak:hover{background:#d6f0fc;}

/* ===== 상단 스텝바 ===== */
.topbar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.92);backdrop-filter:blur(6px);
  border-bottom:2px solid var(--line);margin-bottom:20px;}
.topbar-inner{max-width:1060px;margin:0 auto;padding:8px 10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.brand{font-weight:900;font-size:1.05em;display:flex;align-items:center;gap:8px;white-space:nowrap;}
.brand-logo{width:150px;height:auto;display:block;}
.steps{display:flex;gap:5px;flex:1;flex-wrap:wrap;justify-content:center;}
.step{border:2px solid var(--line);background:#fff;border-radius:14px;padding:5px 8px;font-weight:800;
  display:flex;align-items:center;gap:5px;font-size:.76em;color:var(--ink-soft);min-height:42px;transition:all .15s;}
.step .num{width:21px;height:21px;border-radius:50%;background:#eef0f6;display:inline-flex;align-items:center;
  justify-content:center;font-size:.85em;color:var(--ink-soft);}
.step.done{background:#eafaf1;border-color:#bfe9cf;color:#177245;}
.step.done .num{background:var(--good);color:#fff;}
.step.active{background:linear-gradient(135deg,#fff2c2,#ffd23f);border-color:transparent;color:#5c4600;
  transform:scale(1.06);box-shadow:var(--shadow);}
.step.active .num{background:#fff;color:#a07a00;}
.step.locked{opacity:.55;}
.step-btn{border:none;background:none;padding:0;font:inherit;color:inherit;cursor:pointer;}
.step-btn:disabled{cursor:default;}

/* ===== 카드 ===== */
.card{background:#fff;border:2px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;}
.panel{background:#fff;border:2px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px;}

/* 상품 카드 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px;}
.product{background:#fff;border:2px solid var(--line);border-radius:20px;box-shadow:var(--shadow);
  padding:14px;display:flex;flex-direction:column;gap:10px;position:relative;}
.product .art{font-size:56px;height:110px;display:flex;align-items:center;justify-content:center;
  background:#f7f9ff;border-radius:16px;overflow:hidden;}
/* 상품 실물 사진 */
.prod-photo{max-width:100%;max-height:100%;object-fit:contain;display:block;margin:0 auto;border-radius:10px;}
.art .prod-photo{max-height:104px;}
.bigart .prod-photo{max-height:230px;}
.prod-mini{width:44px;height:44px;object-fit:contain;border-radius:8px;display:block;}
.product .name{font-weight:800;font-size:1.05em;}
.product .price{font-weight:900;color:#c0392b;font-size:1.15em;}
.product .feat{color:var(--ink-soft);font-size:.9em;}
.pill{display:inline-block;background:#f0f3fb;border-radius:999px;padding:7px 16px;font-weight:700;font-size:1.02em;color:var(--ink-soft);}
.heart-btn{position:absolute;top:10px;right:10px;border:2px solid var(--line);background:#fff;border-radius:50%;
  width:46px;height:46px;font-size:1.2em;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);}
.heart-btn.on{background:#ffe3e3;border-color:#ffb3b3;}
.selected-mark{border:3px solid var(--mint) !important;box-shadow:0 0 0 4px rgba(78,205,196,.22),var(--shadow) !important;}
.soldout{position:absolute;inset:0;background:rgba(255,255,255,.72);border-radius:20px;display:flex;
  align-items:center;justify-content:center;font-weight:900;color:#8a8a9a;font-size:1.1em;flex-direction:column;gap:6px;}

/* 예산 바 */
.budgetbar{display:inline-flex;gap:10px;flex-wrap:wrap;background:#fff;border:2px solid var(--line);border-radius:18px;
  padding:12px 20px;box-shadow:var(--shadow);align-items:center;justify-content:center;width:fit-content;max-width:100%;}
.budgetbar .b-item{display:flex;flex-direction:column;line-height:1.2;padding:2px 8px;text-align:center;}
.b-divider{width:2px;align-self:stretch;background:var(--line);border-radius:2px;margin:2px 0;}
/* 현금 계산 요약칸: 이름 아래에 금액 (붙어 보이지 않게) */
.paysum{gap:12px;flex-wrap:wrap;}
.pay-item{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 18px;line-height:1.25;}
/* 현금 계산: 왼쪽(금액 확인) / 오른쪽(지폐 넣기) 2단 */
.paycols{display:flex;gap:24px;align-items:stretch;justify-content:center;flex-wrap:wrap;margin-bottom:6px;}
.paycols .paycol{flex:1 1 320px;min-width:280px;justify-content:flex-start;}
.paycols .paycol.right{border-left:2px solid var(--line);padding-left:22px;}
@media (max-width:720px){ .paycols .paycol.right{border-left:none;padding-left:0;border-top:2px solid var(--line);padding-top:14px;} }
.pay-item .lbl{font-size:.92em;color:var(--ink-soft);font-weight:800;}
.pay-item .bignum{font-size:1.5em;}
.budgetbar .b-item b{font-size:1.25em;}
.budgetbar .lbl{font-size:.8em;color:var(--ink-soft);font-weight:700;}
/* 클릭 가능한 '내 바구니' (누르면 장바구니가 열려요) */
.b-basket-btn{border:none;background:none;font:inherit;color:inherit;cursor:pointer;border-radius:12px;transition:background .12s, transform .1s;}
.b-basket-btn.has{background:#eafaf1;box-shadow:0 0 0 2px #bfe9cf inset;}
.b-basket-btn.has b{color:#177245;}
.b-basket-btn:hover{transform:translateY(-1px);}
.b-basket-btn.has:hover{background:#d7f5e3;}
.bmeter{height:14px;background:#eef0f6;border-radius:999px;overflow:hidden;flex:1;min-width:120px;}
.bmeter > span{display:block;height:100%;background:linear-gradient(90deg,var(--mint),var(--sky));border-radius:999px;transition:width .3s;}
.bmeter.over > span{background:linear-gradient(90deg,#ffb36b,#ff8a8a);}

/* 코너 카드 */
.corners{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px;}
.corner{border:2px solid var(--line);border-radius:22px;padding:24px;display:flex;flex-direction:column;gap:8px;
  background:#fff;box-shadow:var(--shadow);text-align:left;font:inherit;color:inherit;transition:transform .12s;}
.corner:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);}
.corner .ci{font-size:52px;}
.corner .ci-img{width:96px;height:96px;object-fit:contain;border-radius:14px;display:block;}
/* 코너 아이콘: 글자 크기를 따라가서 화면이 작아지면 아이콘도 같이 작아져요 */
.cicon{display:inline-block;width:1.15em;height:1.15em;vertical-align:-.2em;flex:none;}
.cicon svg,.cicon img{width:100%;height:100%;display:block;object-fit:contain;}
img.cicon{object-fit:contain;border-radius:.2em;}
.corner .ct{font-weight:900;font-size:1.25em;}
.corner .cd{color:var(--ink-soft);}

/* 모달 */
.overlay{position:fixed;inset:0;background:rgba(30,34,54,.5);display:flex;align-items:center;justify-content:center;
  z-index:50;padding:16px;}
.modal{background:#fff;border-radius:26px;max-width:680px;width:100%;padding:26px;box-shadow:var(--shadow-lg);
  max-height:92vh;overflow:auto;}
.modal .bigart{font-size:96px;text-align:center;background:#f7f9ff;border-radius:20px;padding:16px;}

/* 안내 배너 */
.hint{background:#eaf7fe;border:2px solid #cbeafb;border-radius:16px;padding:14px 18px;display:flex;gap:10px;
  align-items:center;font-weight:700;color:#0b4a63;font-size:1.12em;line-height:1.5;}
.hint.warm{background:#fff6e6;border-color:#ffe1a8;color:#6a5200;}
/* 글자 길이에 딱 맞게 줄어드는 안내 상자 (가운데 정렬) */
.hint.fit{width:fit-content;max-width:100%;margin-left:auto;margin-right:auto;text-align:center;}
.hint.soft{background:#f3f0fb;border-color:#e0d6f5;color:#3e2e63;}
/* 눌러서 들을 수 있는 안내 상자 — 누를 수 있다는 걸 손 모양·살짝 뜨는 느낌으로 알려요. */
.hint.tappable{cursor:pointer;transition:transform .12s ease, box-shadow .12s ease;}
.hint.tappable:hover{transform:translateY(-2px);box-shadow:var(--shadow);}
.hint.tappable:active{transform:translateY(0);}
/* 상품 설명·오늘의 문구 취향: 문장이 중간에 끊기지 않고 '문장 단위'로 줄바꿈되게.
   아이콘은 따로 떼어 두어, 줄이 바뀌어도 글자가 아이콘 밑으로 들어가지 않아요. */
.use-text{display:flex;align-items:baseline;gap:6px;}
.use-ico{flex:none;}
/* 글자는 따로 묶어 둬요 — 줄이 바뀌어도 ✨ 밑이 아니라 '첫 문장이 시작한 자리'에 맞춰져요 */
.use-body{flex:1;min-width:0;}
.use-sent{display:inline-block;margin-right:4px;}
.hint.soft .sent{display:inline-block;}

/* 수량 고르기 (➖ 2개 ➕) — 2026-08-09
   손가락으로 누르기 쉽게 단추를 넉넉히 잡았어요. */
.qtybox{display:inline-flex;align-items:center;background:#fff;border:2px solid var(--mint,#59c9a5);
  border-radius:14px;overflow:hidden;box-shadow:var(--shadow);flex:none;}
.qtybox .qtybtn{border:none;background:#eafaf4;color:#14795c;font-size:1.05em;font-weight:900;
  width:40px;height:38px;cursor:pointer;line-height:1;padding:0;}
.qtybox .qtybtn:hover{background:#d3f3e8;}
.qtybox .qtynum{min-width:52px;text-align:center;font-weight:900;color:#14795c;font-size:.98em;
  padding:0 4px;white-space:nowrap;}
.qtybox.big .qtybtn{width:52px;height:48px;font-size:1.2em;}
.qtybox.big .qtynum{min-width:64px;font-size:1.1em;}
/* 코너 제목 옆 '＋ 우리 반 문구' — 선생님용이라 학생 단추보다 조용한 색으로 (2026-08-09) */
.add-here{margin-left:auto;flex:none;border:2px dashed #b9c6d1;color:#5b6b7a;background:#f7fafc;font-weight:800;}
.add-here:hover{background:#eaf3f9;border-color:#8fb4cd;color:#2c4a63;}
/* 목록에서 '2개 이상'일 때만 이름 옆에 붙는 작은 표시 (×2) */
.qty-tag{flex:none;background:#eafaf4;color:#14795c;border-radius:8px;padding:1px 7px;
  font-size:.85em;font-weight:900;white-space:nowrap;margin-left:4px;}

/* 지폐 */
/* 지폐 — 실제 지폐처럼 가로로 긴 비율(세로를 줄여 앞 화면 지폐와 통일) */
.bill{border-radius:12px;color:#fff;font-weight:900;padding:9px 14px;min-width:136px;text-align:center;
  box-shadow:var(--shadow);border:none;position:relative;line-height:1.1;}
.bill{display:flex;align-items:center;justify-content:center;min-height:58px;}
.bill .amt{font-size:1.55em;display:flex;align-items:baseline;justify-content:center;gap:3px;white-space:nowrap;}
.bill .won{font-size:.62em;opacity:.95;}
/* 실제 한국 지폐 색 — 천 원 파랑 · 오천 원 주황 · 만 원 초록 · 오만 원 노랑
   (지폐 사진이 없을 때만 쓰이는 대체 그림이에요) */
.bill.b1000{background:linear-gradient(135deg,#79b7f0,#3f79c0);}
.bill.b5000{background:linear-gradient(135deg,#ff9e7a,#e8663a);}
.bill.b10000{background:linear-gradient(135deg,#7fd8a6,#3fa06a);}
.bill.b50000{background:linear-gradient(135deg,#f6d365,#d99a24);}
.bill.dim{opacity:.32;filter:grayscale(.4);}
.bill.glow{box-shadow:0 0 0 4px #ffd23f, var(--shadow-lg);}
/* 실제 지폐 그림을 넣었을 때 (이미지/지폐/1000·5000·10000·50000.png)
   그림이 있으면 위의 색깔 그라데이션 대신 사진이 버튼이 됩니다.
   그림 파일을 지우면 자동으로 다시 색깔 버튼으로 돌아가요 (2026-08-09).

   ⚠️ height만 정하고 width는 auto 로 둡니다 — 이유가 있어요.
   우리나라 지폐는 높이가 68mm로 전부 같고 가로만 조금씩 길어져요.
     천 원 136 · 오천 원 142 · 만 원 148 · 오만 원 154 (mm)
   width를 고정하면 이 차이가 사라져서 네 장이 똑같은 크기로 보입니다.
   높이만 맞추면 실제처럼 '액수가 클수록 조금 더 긴' 모양이 그대로 나와요.
   (학생이 길이만 보고도 큰돈인지 알 수 있어요) */
.bill-img{display:block;height:86px;width:auto;border-radius:7px;}
.bill:has(.bill-img){padding:5px;min-width:0;min-height:0;background:#fbfbfb;border:2px solid #e2e2e2;}

/* 스캐너 */
.scanner{border:3px dashed var(--sky);border-radius:22px;background:#f0faff;min-height:150px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;position:relative;overflow:hidden;}
.scanline{position:absolute;left:6%;right:6%;height:5px;background:#ff6b6b;border-radius:4px;
  box-shadow:0 0 12px 3px rgba(255,107,107,.7);animation:scan 2.2s ease-in-out infinite;}
@keyframes scan{0%{top:16%}50%{top:80%}100%{top:16%}}
.barcode{display:inline-flex;gap:2px;align-items:flex-end;height:26px;}
.barcode i{width:3px;background:#2b2b3a;height:100%;display:block;}
.barcode i:nth-child(odd){height:70%;}
.barcode i:nth-child(3n){width:5px;}

/* 드래그로 바코드 찍기 */
.drag-item{touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;}
.drag-item:active{cursor:grabbing;}
.drag-ghost{position:fixed;transform:translate(-50%,-50%);font-size:3.6em;pointer-events:none;z-index:90;
  filter:drop-shadow(0 8px 14px rgba(0,0,0,.32));}
.drag-ghost-inner{display:flex;align-items:center;justify-content:center;width:92px;height:92px;border-radius:50%;
  background:#fff;border:4px solid var(--sky);box-shadow:var(--shadow-lg);}
.drag-ghost-inner .prod-mini{width:66px;height:66px;}
.scanner.hot{background:#e9fff0 !important;border-color:var(--good) !important;
  box-shadow:0 0 0 8px rgba(47,191,113,.22);transform:scale(1.02);}
.grab-hint{display:inline-flex;align-items:center;gap:4px;background:#fff4e0;color:#8a5a00;
  border-radius:999px;padding:4px 10px;font-weight:800;font-size:.8em;}

/* 영수증 */
.receipt{background:#fffef8;border:2px dashed #d9d4bf;border-radius:14px;padding:22px;max-width:420px;margin:0 auto;
  font-family:"Courier New",monospace;box-shadow:var(--shadow);}
.receipt .r-row{display:flex;justify-content:space-between;padding:3px 0;}
.receipt hr{border:none;border-top:1px dashed #c9c4ae;margin:10px 0;}
@keyframes rollout{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
.rollout{animation:rollout .5s ease;}

/* 축하 반짝이 */
.confetti{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden;}
.confetti i{position:absolute;top:-20px;width:12px;height:12px;border-radius:2px;animation:fall 2.6s linear forwards;}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.9}}
.pop{animation:pop .4s ease;}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.12)}100%{transform:scale(1)}}

/* 홈 */
.hero{background:linear-gradient(160deg,#ffffff,#eef5ff);border:2px solid var(--line);border-radius:30px;
  padding:40px 28px;text-align:center;box-shadow:var(--shadow-lg);position:relative;overflow:hidden;}
.hero h1{font-size:2.4em;margin:10px 0 6px;font-weight:900;}
.hero .sub{font-size:1.2em;color:var(--ink-soft);font-weight:700;}
.shelf{font-size:64px;letter-spacing:6px;margin:6px 0;}
.hero-img{width:100%;max-width:860px;height:auto;border-radius:20px;display:block;margin:0 auto 12px;box-shadow:var(--shadow-lg);
  background:#fff;padding:8px;border:2px solid #e9ecf4;}
.brand-txt{font-size:1.18em;font-weight:900;letter-spacing:.5px;
  text-shadow:1.5px 1.5px 0 #fff,-1.5px 1.5px 0 #fff,1.5px -1.5px 0 #fff,-1.5px -1.5px 0 #fff;}
.brand-go{color:#ee7f4f;}
.brand-name{color:#3fa896;}

/* 설정 */
.field{margin-bottom:20px;}
.field > label{display:block;font-weight:800;margin-bottom:10px;font-size:1.05em;}
/* 선생님 설정 화면: 글자 크게 */
.tset .section-title{font-size:1.7em;}
.tset .field{margin-bottom:26px;}
.tset .field > label{font-size:1.3em;margin-bottom:12px;}
.tset .choice{font-size:1.12em;padding:14px 22px;min-height:60px;}
.tset .lbl{font-size:1.05em !important;}
.tset .input{font-size:1.1em;min-height:56px;}
.tset .muted{font-size:1em !important;}
.choices{display:flex;gap:10px;flex-wrap:wrap;}
.choice{border:2px solid var(--line);background:#fff;border-radius:14px;padding:12px 18px;font-weight:800;min-height:54px;
  display:inline-flex;align-items:center;gap:8px;}
.choice.on{background:linear-gradient(135deg,#d7f5f1,#a8ebe4);border-color:var(--mint);color:#0b4f4a;box-shadow:var(--shadow);}
.input{border:2px solid var(--line);border-radius:12px;padding:12px 14px;font-size:1em;font-family:inherit;min-height:52px;width:100%;max-width:280px;}

/* 활동/즐기기 */
.actgrid{display:flex;flex-wrap:wrap;justify-content:center;gap:16px;}
/* 마무리 화면: 보여주기용이라 카드를 조금 좁혀 4장이 한 줄에 들어가요(스크롤 방지) */
.actgrid.compact{gap:14px;}
.actgrid.compact .act{width:200px;padding:12px;gap:5px;}
.actgrid.compact .act .ai{font-size:38px;}
.act{border:2px solid var(--line);border-radius:20px;padding:20px;background:#fff;box-shadow:var(--shadow);
  text-align:center;font:inherit;color:inherit;display:flex;flex-direction:column;gap:8px;transition:transform .12s;
  width:240px;max-width:100%;}
.act:hover{transform:translateY(-3px);}
.act.on{border-color:var(--purple);box-shadow:0 0 0 4px rgba(179,157,219,.3),var(--shadow);}
.act .ai{font-size:48px;}
.act .act-thumb{width:100%;height:auto;border-radius:12px;display:block;box-shadow:var(--shadow);}
.timer{font-size:2.6em;font-weight:900;text-align:center;color:var(--mint);}

/* ===== 꾸미기 놀이터 ===== */
.pg-canvas{position:relative;width:100%;max-width:560px;height:340px;border-radius:20px;border:3px solid var(--line);
  box-shadow:var(--shadow);overflow:hidden;margin:2px auto;cursor:pointer;touch-action:manipulation;}
.pg-stamp{position:absolute;transform:translate(-50%,-50%);user-select:none;pointer-events:none;line-height:1;
  animation:pgpop .25s ease;}
@keyframes pgpop{0%{transform:translate(-50%,-50%) scale(.2);}70%{transform:translate(-50%,-50%) scale(1.25);}100%{transform:translate(-50%,-50%) scale(1);}}
.pg-tool{border:2px solid var(--line);background:#fff;border-radius:14px;min-width:54px;min-height:54px;font-size:26px;
  display:inline-flex;align-items:center;justify-content:center;box-shadow:var(--shadow);}
.pg-tool.on{border-color:var(--purple);box-shadow:0 0 0 4px rgba(179,157,219,.35),var(--shadow);transform:translateY(-2px);}
.pg-paper{border:2px solid var(--line);width:44px;height:44px;border-radius:12px;box-shadow:var(--shadow);padding:0;}
.pg-paper.on{outline:4px solid var(--purple);outline-offset:2px;}
.pg-hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  color:var(--ink-soft);font-weight:800;pointer-events:none;opacity:.6;}
.pg-cv{width:100%;max-width:560px;aspect-ratio:560 / 340;height:auto;display:block;margin:2px auto;
  border-radius:20px;border:3px solid var(--line);box-shadow:var(--shadow);touch-action:none;}
.pg-swatch{width:42px;height:42px;border-radius:50%;border:3px solid #fff;box-shadow:var(--shadow);padding:0;}
.pg-swatch.on{outline:4px solid var(--purple);outline-offset:2px;}
.pg-proud-img{max-width:100%;border-radius:16px;border:3px solid var(--line);box-shadow:var(--shadow-lg);}

/* 취향 문장 */
.taste{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;}
.taste button{border:2px solid var(--line);background:#fff;border-radius:14px;padding:14px 18px;font-weight:800;
  min-height:58px;text-align:left;display:flex;align-items:center;justify-content:flex-start;}
.taste button.on{background:linear-gradient(135deg,#fff2c2,#ffd23f);border-color:transparent;color:#5c4600;}

/* 도움 패널 */
.help-fab{position:fixed;right:18px;bottom:18px;z-index:40;background:linear-gradient(135deg,#ffd27a,#ffb84d);
  color:#5c3d00;border:none;border-radius:999px;padding:16px 22px;font-weight:900;font-size:1.05em;
  box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:8px;min-height:60px;}

.section-title{font-size:1.5em;font-weight:900;margin:6px 0 14px;display:flex;align-items:center;gap:10px;}
.muted{color:var(--ink-soft);}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;}
.spacer{flex:1;}
.tag-heart{color:#ff6b6b;}
.bignum{font-size:1.6em;font-weight:900;}
.good-txt{color:var(--good);font-weight:900;}
.list-item{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;border:2px solid var(--line);
  border-radius:14px;background:#fff;margin:0 auto 10px;gap:12px;max-width:600px;}
/* 점원이 지금 읽고 있는 물건을 살짝 강조 — 학생이 안내되는 물건을 눈으로 짚어요. */
.list-item.now{border-color:#2fbf71;background:#eafaf1;box-shadow:0 0 0 3px rgba(47,191,113,.18);}

/* ===== 추가 기능 스타일 ===== */
/* 지갑 시각화 */
.wallet{display:inline-flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--line);border-radius:16px;
  padding:10px 18px;box-shadow:var(--shadow);flex-wrap:wrap;justify-content:center;width:fit-content;max-width:100%;}
.wallet-bills{flex:0 1 auto !important;}
.wallet-ico{font-size:1.8em;}
.wallet-lbl{font-weight:800;color:var(--ink-soft);}
.wallet-bills{display:flex;gap:6px;flex-wrap:wrap;flex:1;min-width:80px;}
.wallet-amt{font-size:1.35em;}
/* 지폐 묶음 (10,000 ×4) — 지폐 그림은 그대로 두고 장수만 옆에 붙여요 */
.bill-group{display:inline-flex;align-items:center;gap:3px;}
.bill-x{font-weight:900;color:var(--ink-soft);font-size:.95em;letter-spacing:-.5px;white-space:nowrap;}
/* 지폐 그림 (실제 화폐 사진이 없으면 지폐 모양 그래픽) */
.billnote-img{height:34px;width:auto;border-radius:5px;box-shadow:var(--shadow);display:block;}
.billnote{display:inline-flex;flex-direction:row;align-items:center;justify-content:center;gap:1px;
  width:74px;height:34px;border-radius:6px;border:1.5px solid rgba(255,255,255,.7);color:#173d2a;
  font-weight:900;line-height:1;box-shadow:var(--shadow);overflow:hidden;white-space:nowrap;text-align:center;}
.billnote-num{font-size:.82em;letter-spacing:-.5px;}
.billnote-won{font-size:.62em;opacity:.85;}
/* 지갑 속 작은 지폐도 같은 색 (천 원 파랑 · 오천 원 주황 · 만 원 초록) */
.billnote.n1000{background:linear-gradient(135deg,#a9d3f5,#5b93c8);color:#0d3350;}
.billnote.n5000{background:linear-gradient(135deg,#ffc59e,#f08a4b);color:#6a3410;}
.billnote.n10000{background:linear-gradient(135deg,#a7e8c4,#5bb883);color:#0d4a2e;}
.billnote.n50000{background:linear-gradient(135deg,#fbe3a0,#e0b64a);color:#5a4310;}
.wallet-ico-btn{border:2px solid var(--sky);background:#eaf7fe;border-radius:50%;width:44px;height:44px;
  display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0;box-shadow:var(--shadow);
  transition:transform .1s;}
.wallet-ico-btn:hover{background:#d6f0fc;transform:scale(1.06);}

/* 점원 대화 */
.cashier{background:linear-gradient(160deg,#fff,#f1fbff);}
.cashier-row,.student-row{display:flex;gap:12px;align-items:flex-start;margin:10px 0;}
.student-row{flex-direction:row-reverse;}
.cashier-face,.student-face{font-size:2.8em;flex:0 0 auto;line-height:1;}
.person-art{flex:0 0 auto;align-self:flex-start;}
.person-photo{height:110px;width:auto;max-width:130px;object-fit:contain;flex:0 0 auto;align-self:flex-start;border-radius:12px;}
.choice-figure{margin:6px 0 10px;display:flex;justify-content:center;}
.choice-figure .person-photo{height:150px;max-width:190px;align-self:center;}
.handover-fig{display:flex;justify-content:center;}
.handover-fig .person-photo{height:130px;max-width:190px;align-self:center;}
/* 점원·학생 대화: 채팅창 느낌 + 똑같은 크기의 원형 아바타 */
.chatbox{background:#eef5fb;border:1.5px solid #dbe6f0;border-radius:18px;padding:14px 16px;
  margin:10px 0;display:flex;flex-direction:column;gap:16px;}
/* 채팅창 속 얼굴 — 정원(正圓) 안에 '잘리지 않고' 전체가 들어가요(contain).
   '나' 캐릭터 원과 크기를 똑같이 맞춰요. */
.cashier-row .person-photo, .student-row .person-photo{
  width:116px;height:116px;max-width:none;border-radius:50%;
  /* 얼굴이 크게 그려진 그림이라 원을 꽉 채워요 ('나' 캐릭터 원과 같은 모양) */
  object-fit:cover;object-position:center 30%;
  border:4px solid #fff;box-shadow:0 0 0 3px #dbe6f0,var(--shadow);align-self:center;background:#fff;}
.cashier-row .figure-avatar .avatar, .student-row .figure-avatar .avatar{
  width:116px !important;height:116px !important;}
.cashier-row, .student-row{align-items:center;}
.card-terminal{width:230px;max-width:100%;height:auto;display:block;}
/* 카드 드래그해서 꽂기 */
.card-face{width:84px;height:130px;border-radius:11px;background:linear-gradient(135deg,#ff9e7a,#e8663a);
  box-shadow:var(--shadow);position:relative;flex:0 0 auto;}
.card-face::after{content:"";position:absolute;top:14px;left:50%;transform:translateX(-50%);width:27px;height:20px;border-radius:4px;background:#ffd66b;}
.card-face::before{content:"";position:absolute;top:46px;left:0;right:0;height:13px;background:#c9502a;}
.drag-card{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;border:none;padding:0;background:none;}
.drag-card .card-face{cursor:grab;}
.card-ghost{position:fixed;transform:translate(-50%,-50%);pointer-events:none;z-index:80;}
.card-slot{position:absolute;left:26%;top:66%;width:48%;height:28%;border-radius:10px;}
.card-slot.hot{background:rgba(94,200,242,.28);outline:3px dashed #5ec8f2;color:#2b8fc0;}
.scene-mini{width:160px;max-width:100%;height:auto;display:block;margin:0 auto;border-radius:16px;box-shadow:var(--shadow);
  background:#fff;padding:6px;border:2px solid #e9ecf4;}
.wallet-kid{width:100%;max-width:560px;height:auto;display:block;margin:6px auto 10px;border-radius:20px;box-shadow:var(--shadow);
  background:#fff;padding:8px;border:2px solid #e9ecf4;}

/* 단계 안내띠: 그림 + 큰 글씨를 '가로로 나란히' — 세로 공간을 적게 쓰면서 그림은 크게 보여요.
   크기는 '높이'가 정하고 가로는 그림 비율대로 늘어나요.
   → 두 장을 붙여 만든 가로로 긴 그림(카드로 계산해요 3104x1024)은 자동으로 두 배 넓게 나와요. */
.stepbar{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;
  background:#fff;border:2px solid #e9ecf4;border-radius:20px;padding:8px 18px;
  box-shadow:var(--shadow);margin:0 auto 6px;
  /* 띠가 화면 전체로 늘어나지 않고 '내용 크기'만큼만 차지해서, 그림과 글씨가 붙어 가운데에 놓여요 */
  width:max-content;max-width:100%;}
.stepbar .stage-scene{height:clamp(58px,12vh,132px);width:auto;max-width:100%;max-height:none;
  border:none;box-shadow:none;background:none;padding:0;border-radius:12px;display:block;flex:none;}
.stepbar-cap{display:flex;align-items:center;gap:10px;font-weight:900;font-size:1.3em;color:var(--ink);}

/* 상단 줄: 왼쪽에 이름·예산·지갑, 오른쪽 빈 자리에 단계 그림 */
.topbar-row{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;}
.topbar-left{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;}
/* 정보와 그림을 양 끝으로 벌리지 않고, 한 덩어리로 가운데에 모아요 (시선 분산 방지) */
/* 예산바 안의 '지금 무엇을 하는지' 글자 (내 바구니 옆).
   다른 칸은 라벨+숫자가 세로로 쌓이지만 여기는 글자와 🔊를 '가로로' 둬야
   예산바 높이가 커지지 않아요(세로로 쌓으면 89px이 되어 줄이 밀림). */
.b-caption{flex-direction:row !important;align-items:center;gap:6px;white-space:nowrap;}
.b-caption b{color:#1b4b8f;}

/* 지갑은 늘 '자기 줄'을 차지해 가로 폭을 다 써요 — 지폐를 한 장씩 더 많이 보여 주려고 */
.topbar-left .wallet{flex:1 0 100%;max-width:100%;}
.topbar-art{flex:0 0 auto;}
.topbar-art .stepbar{margin:0;padding:5px 12px;gap:10px;flex-wrap:nowrap;}
.topbar-art .stepbar .stage-scene{height:clamp(44px,7.4vh,86px);}
.topbar-art .stepbar-cap{font-size:.98em;max-width:8em;line-height:1.25;}
@media (max-width:900px){
  .topbar-art .stepbar-cap{display:none;}   /* 좁으면 그림만 */
}

/* 단계별 장면 그림 */
.scene-wrap{margin-bottom:6px;}
.stage-scene{width:100%;max-width:560px;height:auto;display:block;margin:0 auto;border-radius:20px;box-shadow:var(--shadow);
  background:#fff;padding:8px;border:2px solid #e9ecf4;}
.scene-cap{display:flex;align-items:center;justify-content:center;gap:10px;font-weight:900;
  color:var(--ink);margin-top:10px;font-size:1.5em;}
.art-slot{border:3px dashed #cbd5e6;border-radius:20px;min-height:150px;display:flex;align-items:center;
  justify-content:center;color:#9aa3b5;font-weight:800;background:#fafbff;text-align:center;padding:24px;
  font-size:.95em;line-height:1.6;}
.stage-back{margin:2px 0 14px;}
.stage-back .btn{background:#fff;border:2px solid var(--sky);color:#0b4a63;}
.stage-back .btn:hover{background:#eaf7fe;}
.speech{background:#eaf7fe;border:2px solid #cbeafb;border-radius:16px 16px 16px 4px;padding:14px 18px;
  font-weight:800;color:#0b4a63;display:flex;gap:8px;align-items:center;font-size:1.15em;min-height:58px;}
.talkcard{border-radius:16px;}
/* 학생 답변 말풍선 — 점원 말풍선과 글자 크기·바 높이를 똑같이 맞춰요.
   (button은 글자 크기가 기본값부터 시작해서 작아지므로 font:inherit 로 먼저 맞춰요) */
.talkbubble{background:#e4f8f1;border:2px solid #a9e4d5;border-radius:16px 16px 4px 16px;padding:14px 18px;
  font:inherit;font-weight:800;color:#0b4f4a;font-size:1.15em;min-height:58px;
  display:inline-flex;gap:8px;align-items:center;
  cursor:pointer;box-shadow:var(--shadow);transition:transform .1s ease;}
.talkbubble:hover{transform:translateY(-2px);}
.talkbubble:active{transform:translateY(0);}
/* 학생이 말하는 동안엔 잠깐 잠겨요 — 말이 끝나면 다시 눌러져요. */
.talkbubble:disabled{opacity:.55;cursor:default;transform:none;box-shadow:none;}
.tb-spk{font-size:1.15em;line-height:1;}
.peerbanner{font-size:1.05em;}

/* 스위치 훑기 하이라이트 */
.scan-hi{outline:5px solid #ff6b6b !important;outline-offset:3px;border-radius:12px;
  box-shadow:0 0 0 6px rgba(255,107,107,.25) !important;animation:scanpulse 1s ease-in-out infinite;}
@keyframes scanpulse{0%,100%{box-shadow:0 0 0 6px rgba(255,107,107,.28)}50%{box-shadow:0 0 0 11px rgba(255,107,107,.10)}}
.scan-badge{position:fixed;left:18px;bottom:18px;z-index:40;background:#2b2b3a;color:#fff;border-radius:999px;
  padding:10px 16px;font-weight:800;box-shadow:var(--shadow-lg);font-size:.95em;}

/* 조용한 모드 */
body.quiet{--red:#e79a9a;--yellow:#e8d48a;--sky:#a9d6e8;--mint:#9ed7d1;--purple:#c3b6dd;}
body.quiet .btn.primary,body.quiet .btn.sky,body.quiet .btn.mint,body.quiet .btn.yellow,body.quiet .btn.purple{filter:saturate(.7);}
body.quiet .confetti{display:none !important;}

/* 인쇄용 봉투/체크리스트 */
.wallet-box{background:#fffef2;border:2px dashed #e5dcae;border-radius:14px;padding:16px;margin-top:16px;}
.checklist{background:#f2fbff;border-radius:12px;padding:14px 16px;margin-top:14px;font-weight:700;color:#0b4a63;}
/* 한 줄에 하나씩, 네모칸을 왼쪽 기준선에 맞춰 정렬 + 줄무늬 배경 (손으로 체크하기 쉽게) */
.check-line{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;font-size:1.02em;}
.check-line:nth-child(even){background:rgba(255,255,255,.75);}
.check-box{flex:none;width:1.5em;text-align:center;font-size:1.5em;line-height:1;color:#2fbf71;}
.check-icon{display:inline-flex;align-items:center;justify-content:center;width:1.15em;height:1.15em;
  background:#2fbf71;color:#fff;border-radius:5px;font-size:.82em;margin-right:5px;vertical-align:middle;font-weight:900;
  -webkit-print-color-adjust:exact;print-color-adjust:exact;}
.print-sign{margin-top:18px;text-align:center;font-weight:700;}
/* 이름은 함께 인쇄되지만, 덧쓰거나 다른 학생이 쓸 수 있게 밑줄은 남겨 둬요 (글자 길이에 맞게) */
.name-line{display:inline-block;min-width:110px;border-bottom:2px solid #333;text-align:center;padding:0 10px;}

/* 인쇄 */
@media print{
  .noprint{display:none !important;}
  body{background:#fff;font-size:14px;}
  .topbar{display:none;}
  .panel,.card{box-shadow:none;border:1px solid #ccc;}
  /* 지폐·체크박스 색이 그대로 인쇄되게 (브라우저가 배경색을 빼버리는 걸 막아요) */
  *{-webkit-print-color-adjust:exact !important;print-color-adjust:exact !important;}
  /* 종이 여백을 줄여 한 장에 넉넉히 */
  @page{margin:12mm;}
  .app{padding:0 !important;max-width:100% !important;}
  .wallet-box{break-inside:avoid;}
  .checklist{break-inside:avoid;}
  .print-head{display:flex !important;}
}
/* 인쇄물 맨 위 줄 (화면에선 숨기고 인쇄할 때만 보여요) */
.print-head{display:none;align-items:baseline;justify-content:space-between;gap:12px;
  border-bottom:2px solid #333;padding-bottom:6px;margin-bottom:10px;font-weight:800;}
.print-head .ph-title{font-size:.95em;color:#555;}

/* ===== 3층 건물 뷰 ===== */
.building{max-width:720px;margin:0 auto;width:100%;display:flex;flex-direction:column;}
.b-roof{background:linear-gradient(135deg,#ff8a8a,#ff6b6b);color:#fff;border-radius:26px 26px 8px 8px;
  padding:18px 12px;text-align:center;font-weight:900;font-size:1.35em;box-shadow:var(--shadow);
  letter-spacing:1px;}
.b-floor{display:flex;align-items:center;gap:16px;width:100%;border:3px solid var(--line);border-top:none;
  background:#fff;padding:20px 22px;cursor:pointer;font:inherit;color:inherit;text-align:left;
  transition:transform .12s ease, box-shadow .12s ease, background .12s;}
.b-floor:hover{transform:translateX(6px);box-shadow:var(--shadow-lg);background:#fffdf2;}
.b-floor .fno{font-size:1.35em;font-weight:900;background:#f0f3fb;border-radius:14px;padding:10px 16px;white-space:nowrap;}
.b-floor .ficons{font-size:1.75em;line-height:1.2;display:flex;gap:8px;align-items:center;}
.b-floor .fdesc{color:var(--ink-soft);font-weight:800;}
.b-floor .fgo{font-size:1.5em;color:var(--ink-soft);}
.b-ground{background:linear-gradient(135deg,#8d6e63,#6d4c41);border-radius:0 0 18px 18px;min-height:44px;
  display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;gap:8px;}

/* ===== 게임풍 도입 : 건물 정면(문 열고 입장) ===== */
.facade-scene,.elev-scene{position:relative;border-radius:24px;overflow:hidden;
  border:3px solid var(--line);box-shadow:var(--shadow-lg);}
.elev-scene{height:clamp(400px,68vh,700px);}
.facade-scene{height:clamp(440px,80vh,820px);}
.facade-scene{display:flex;align-items:flex-end;justify-content:center;
  background:linear-gradient(#cfeeff,#eaf7fe 55%,#dfe9d8);}
.facade{position:relative;z-index:1;width:min(520px,88%);display:flex;flex-direction:column;
  filter:drop-shadow(0 12px 20px rgba(50,60,90,.28));}
.f-roof{background:linear-gradient(135deg,#ff8a8a,#ff6b6b);color:#fff;border-radius:18px 18px 6px 6px;
  text-align:center;font-weight:900;font-size:1.15em;padding:9px;letter-spacing:1px;}
.f-row{display:flex;align-items:center;gap:10px;padding:8px 14px;border:3px solid #e3d6c3;border-top:none;}
.f-no{font-weight:900;background:rgba(255,255,255,.85);border-radius:10px;padding:2px 9px;font-size:.85em;}
.f-window{width:46px;height:40px;background:#e8f6ff;border:3px solid #bcd9ea;border-radius:8px 8px 3px 3px;
  display:flex;align-items:center;justify-content:center;font-size:21px;}
.f-ground{position:relative;background:#f7e8cf;border:3px solid #e3d6c3;border-top:none;
  border-radius:0 0 12px 12px;padding:20px 14px 0;display:flex;justify-content:center;}
.f-awning{position:absolute;top:0;left:0;right:0;height:15px;
  background:repeating-linear-gradient(90deg,#ff8a8a 0 26px,#fff6f6 26px 52px);border-radius:0 0 10px 10px;}
.f-door{position:relative;width:180px;height:118px;border:4px solid #8d6e63;border-bottom:none;
  border-radius:16px 16px 0 0;overflow:hidden;cursor:pointer;padding:0;font:inherit;background:none;}
.f-door::before{content:'🛗';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:40px;background:radial-gradient(circle at 50% 35%, #fff7e0, #ffe9b8);}
.f-door-panel{position:absolute;top:0;bottom:0;width:50%;background:linear-gradient(135deg,#a1887f,#8d6e63);
  transition:transform .85s ease;z-index:2;}
.f-door-panel.left{left:0;border-right:2px solid #5d4037;}
.f-door-panel.right{right:0;border-left:2px solid #5d4037;}
.f-door-panel::after{content:'';position:absolute;top:44%;width:7px;height:22px;border-radius:4px;background:#ffd23f;}
.f-door-panel.left::after{right:8px;} .f-door-panel.right::after{left:8px;}
.f-door.open .f-door-panel.left{transform:translateX(-102%);}
.f-door.open .f-door-panel.right{transform:translateX(102%);}
.f-door-label{position:absolute;left:50%;bottom:7px;transform:translateX(-50%);white-space:nowrap;z-index:3;
  background:rgba(255,255,255,.93);border-radius:999px;padding:5px 12px;font-weight:900;font-size:.82em;box-shadow:var(--shadow);}
.f-door:hover .f-door-label{background:#fff2c2;}
.scene-hint{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);z-index:6;white-space:nowrap;
  background:rgba(255,255,255,.94);border:2px solid var(--line);border-radius:999px;padding:8px 18px;
  font-weight:900;box-shadow:var(--shadow);max-width:94%;overflow:hidden;text-overflow:ellipsis;
  /* 🔊 버튼이 들어와도 글자와 같은 줄 가운데에 오도록 */
  display:inline-flex;align-items:center;gap:8px;}

/* ===== 게임풍 도입 : 엘리베이터 ===== */
.elev-scene{display:flex;align-items:center;justify-content:center;gap:28px;
  background:linear-gradient(#f1ecf9,#e2d9f0);}
.ev-frame{position:relative;z-index:1;width:min(320px,52%);height:84%;background:#cfc4e6;
  border:5px solid #9c8fc0;border-radius:16px;display:flex;flex-direction:column;box-shadow:var(--shadow-lg);}
.ev-frame.moving{animation:evmove 1s ease-in-out infinite;}
@keyframes evmove{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.ev-ind{background:#2b2b3a;color:#ffd23f;font-weight:900;text-align:center;border-radius:10px;
  margin:10px auto 4px;padding:3px 20px;font-size:1.15em;letter-spacing:2px;min-width:110px;}
.ev-doors{position:relative;flex:1;margin:6px 12px 12px;background:#3e3654;border-radius:10px;overflow:hidden;}
.ev-door{position:absolute;top:0;bottom:0;width:50%;background:linear-gradient(135deg,#beb2e0,#a396cc);
  transition:transform .75s ease;z-index:2;}
.ev-door.left{left:0;border-right:2px solid #7c6fa8;}
.ev-door.right{right:0;border-left:2px solid #7c6fa8;}
.ev-doors.open .ev-door.left{transform:translateX(-102%);}
.ev-doors.open .ev-door.right{transform:translateX(102%);}
.ev-inside{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:8px;z-index:1;font-weight:900;font-size:1.15em;text-align:center;
  background:linear-gradient(#f6f2ff,#e8e1f6);}
/* 엘리베이터 옆 층별 안내판 */
.ev-board{position:relative;z-index:1;background:#fff;border:4px solid #9c8fc0;border-radius:16px;
  padding:10px;display:flex;flex-direction:column;gap:7px;box-shadow:var(--shadow-lg);width:min(230px,26vw);}
.ev-board-title{font-weight:900;text-align:center;background:#3e2e63;color:#fff;border-radius:10px;padding:5px;}
.ev-board-row{display:flex;align-items:center;gap:9px;border:2px solid rgba(0,0,0,.08);border-radius:12px;padding:6px 10px;}
.ev-board-no{font-weight:900;background:rgba(255,255,255,.9);border-radius:9px;padding:2px 8px;flex:0 0 auto;font-size:.92em;}
.ev-board-desc{display:flex;flex-direction:column;line-height:1.25;min-width:0;font-size:.82em;}
.ev-board-icons{font-size:1.15em;display:inline-flex;gap:5px;align-items:center;vertical-align:middle;}
@media (max-width:760px){ .ev-board{display:none;} }
.ev-panel{position:relative;z-index:1;display:flex;flex-direction:column;gap:12px;align-items:center;}
.ev-lbl{font-weight:900;color:#3e2e63;background:rgba(255,255,255,.85);border-radius:999px;padding:4px 14px;font-size:.9em;}
.ev-row{display:flex;align-items:center;gap:12px;border:3px solid #9c8fc0;background:#fff;border-radius:18px;
  padding:8px 16px 8px 8px;cursor:pointer;font:inherit;color:var(--ink);box-shadow:var(--shadow);
  width:min(250px,64vw);text-align:left;transition:transform .1s;}
.ev-row:hover{background:#fff2c2;transform:translateX(3px);}
.ev-row.on{background:linear-gradient(135deg,#ffe17a,#ffd23f);border-color:#e0b400;}
.ev-row:disabled{opacity:.45;cursor:default;transform:none;}
.ev-num{width:54px;height:54px;border-radius:50%;border:3px solid #9c8fc0;background:#fff;display:flex;
  align-items:center;justify-content:center;font-weight:900;font-size:1.35em;flex:0 0 auto;}
.ev-row.on .ev-num{border-color:#e0b400;}
.ev-info{display:flex;flex-direction:column;line-height:1.3;min-width:0;}
.ev-info b{font-size:.95em;}
.ev-icons{font-size:1.05em;letter-spacing:3px;}
.ev-numbtn{justify-content:flex-start;gap:14px;}
.ev-floor-lbl{font-size:1.2em;}

/* 엘리베이터 안의 층 버튼 패널 */
.ev-inpanel{display:flex;flex-direction:column;align-items:center;gap:8px;padding:4px;}
.ev-inpanel-row{display:flex;gap:10px;justify-content:center;}
.ev-inpanel-lbl{font-weight:900;color:#3e2e63;background:rgba(255,255,255,.85);border-radius:999px;padding:3px 14px;font-size:.85em;}
.ev-inbtn{width:64px;height:64px;border-radius:50%;border:4px solid #9c8fc0;background:#fff;color:var(--ink);
  font-size:1.5em;font-weight:900;box-shadow:var(--shadow);cursor:pointer;font-family:inherit;}
.ev-inbtn:hover{background:#fff2c2;}
.ev-inbtn.on{background:linear-gradient(135deg,#ffe17a,#ffd23f);border-color:#e0b400;}
/* 지금 있는 층 버튼: 이미 켜진 것처럼 회색·비활성 (진짜 엘리베이터처럼) */
.ev-inbtn.here,.ev-inbtn.here:hover{background:#e7e5ef;border-color:#c7c0dd;color:#9a92b0;cursor:default;
  box-shadow:inset 0 0 0 2px #d4cee6;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;}
.ev-inbtn .ev-here{font-size:10px;font-weight:800;margin-top:2px;letter-spacing:1px;}
/* 엘리베이터에 탄 내 캐릭터 */
.ev-inside{gap:8px;}
.ev-rider{margin-top:4px;display:flex;flex-direction:column;align-items:center;}
.ev-rider .avatar{border-width:3px;}
.ev-rider.riding{animation:charwalk .5s ease-in-out infinite;}
.ev-arrive{display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:900;}
.ev-riding-lbl{font-weight:800;color:#3e2e63;font-size:.9em;}

/* 오른쪽 벽면 ▲▼ 호출 버튼 */
.ev-call{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:12px;
  background:#efe9fb;border:4px solid #9c8fc0;border-radius:18px;padding:16px 14px;box-shadow:var(--shadow-lg);}
.ev-call-lbl{font-weight:900;color:#3e2e63;text-align:center;line-height:1.2;font-size:.9em;}
.ev-call-btn{width:78px;height:78px;border-radius:50%;border:4px solid #b9aee0;background:#fff;color:#6a5ca8;
  font-size:1.7em;font-weight:900;box-shadow:var(--shadow);cursor:pointer;font-family:inherit;transition:transform .1s;}
.ev-call-btn:hover{background:#fff7d6;transform:scale(1.05);}
.ev-call-btn.on{background:linear-gradient(135deg,#ffe17a,#ffd23f);border-color:#e0b400;color:#5c4600;
  box-shadow:0 0 0 5px rgba(255,210,63,.4),var(--shadow);}
.ev-call-btn:disabled{opacity:.5;cursor:default;transform:none;box-shadow:var(--shadow);}
@media (max-height:860px){
  .ev-inbtn{width:52px;height:52px;font-size:1.25em;}
  .ev-call-btn{width:64px;height:64px;font-size:1.4em;}
  .ev-call{padding:12px 10px;gap:9px;}
}
.ev-exit{border:2px solid var(--line);background:#fff;border-radius:14px;padding:9px 14px;
  font:inherit;font-weight:800;box-shadow:var(--shadow);cursor:pointer;white-space:nowrap;}
.ev-exit.stay{background:#eaf7fe;border-color:#bcd9ea;color:#0b4a63;}
/* '계산대로 가기'는 다음 단계로 넘어가는 단추라, 층 이동 단추들과 색으로 구분해요 */
.ev-exit.checkout{background:#fff0d6;border-color:#f0c274;color:#7a4a06;}
@media (max-height:860px){
  .facade-scene,.elev-scene{height:clamp(380px,64vh,580px);}
  /* 건물 정면은 위쪽 예산바를 감추므로 그만큼 그림을 크게 보여 줘요 (2026-07-28).
     2026-07-29: 태블릿에서 아래가 남아 보여 '남는 높이 전부'를 쓰도록 calc로 바꿨어요.
     빼는 136px = 위 스텝바(약 56) + 아래 여백(60) + 사이 여백(20). */
  .facade-scene{height:clamp(400px, calc(100vh - 136px), 760px);}
  .ev-num{width:46px;height:46px;font-size:1.15em;}
  .ev-row{padding:6px 12px 6px 6px;}
}
/* 홈 화면의 건물 그림 */
.home-facade{width:min(440px,100%);align-self:flex-end;}
.home-facade .facade{width:100%;}

/* 건물 일러스트(이미지\배경\건물.png)가 있으면 CSS 건물 대신 그림 + 문 애니메이션만 겹쳐요 */
.facade-art{position:relative;z-index:1;display:flex;align-items:flex-end;justify-content:center;height:100%;width:100%;}
.facade-img{max-height:100%;max-width:100%;display:block;filter:drop-shadow(0 10px 18px rgba(50,60,90,.25));}
/* 건물 간판 이름 (그림의 빈 간판 위에 얹혀요) */
.facade-title{position:absolute;top:12%;left:50%;transform:translateX(-50%);z-index:3;white-space:nowrap;
  font-weight:900;font-size:clamp(0.95em,2.4vw,1.5em);color:#fff;letter-spacing:.5px;
  background:linear-gradient(135deg,#ff8a8a,#ff6b6b);padding:5px 18px;border-radius:11px;
  box-shadow:0 5px 12px rgba(50,60,90,.26);border:2px solid rgba(255,255,255,.85);}
.facade-title .ft-go{color:#ffe17a;}
/* 안내 칩을 '문 위쪽'으로 올려요 (2026-07-29).
   문(.art-door)은 그림 아래 24%를 차지하는데, 칩이 bottom:10px에 있어서
   태블릿에서는 문을 통째로 가렸어요. 26%로 올려 문이 온전히 보이게 합니다. */
.facade-scene .scene-hint{bottom:26%;}
@media (max-width:820px){
  /* 좁은 화면에선 글자를 줄여 칩이 문 폭을 넘지 않게 */
  .facade-scene .scene-hint{font-size:.92em;padding:7px 14px;}
}
.art-door{position:absolute;left:50%;transform:translateX(-50%);bottom:0;width:33%;height:24%;
  border:none;border-radius:12px 12px 0 0;background:none;overflow:hidden;cursor:pointer;padding:0;font:inherit;}
.art-door::before{content:none;}
.art-door .f-door-panel{transition:transform .85s ease;}
.home-facade .facade-art{height:auto;}
.home-facade .facade-img{max-height:56vh;}

/* ===== 1인칭 매장 파노라마 ===== */
.pano-frame{border:5px solid #2b2b3a;border-radius:26px;overflow:hidden;background:#1d2233;box-shadow:var(--shadow-lg);}
/* 매장 그림만 앱 폭(1060px)을 벗어나 화면 전체를 씁니다 (2026-08-03).
   전자칠판(1920)에서도 앱이 1060px로 묶여 있어 매장이 아이패드와 거의 같은 크기였고,
   진열대가 1개 반밖에 안 보였어요(주 사용 기기가 전자칠판인데도).
   가운데 기준으로 펼쳐서 큰 화면에서는 진열대 3개가 온전히 보입니다.
   ⚠️ 매장(파노라마)에만 적용 — 다른 화면은 글이 너무 넓게 퍼지면 읽기 어려워 1060px 유지. */
.pano-frame{width:min(1700px, calc(100vw - 32px));margin-left:50%;transform:translateX(-50%);}
.pano-top{display:flex;align-items:center;gap:8px;padding:10px 16px;color:#fff;font-weight:800;flex-wrap:wrap;}
.pano-top .elev{display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
.elev-btn{border:2px solid #4a5270;background:#2e3550;color:#fff;border-radius:12px;padding:8px 14px;
  font:inherit;font-weight:900;min-height:44px;}
.elev-btn.on{background:linear-gradient(135deg,#ffe17a,#ffd23f);color:#5c4600;border-color:transparent;}
.pano-view{position:relative;overflow:hidden;touch-action:pan-y;height:clamp(340px,60vh,720px);}
.pano-strip{display:block;position:relative;will-change:transform;
  transition:transform .35s ease;height:100%;width:max-content;
  cursor:grab;user-select:none;-webkit-user-select:none;}
/* 층 배경 그림을 통짜로 (좌우로 다 둘러볼 수 있게) — 그림 폭이 매장 폭이 돼요 */
.pano-floor-img{height:100%;width:auto;max-width:none;display:block;pointer-events:none;}
.pano-floor-fallback{height:100%;width:170vh;}
.pano-strip.dragging{cursor:grabbing;transition:none;}
.pano-strip img{pointer-events:none;}
.pano-floorline{position:absolute;left:0;right:0;bottom:0;height:44px;
  background:repeating-linear-gradient(90deg,#e6d7bd 0 90px,#dccaa9 90px 180px);}
.pano-deco{flex:0 0 auto;font-size:64px;padding-bottom:56px;filter:saturate(.9);}
.pano-nav{position:absolute;top:50%;transform:translateY(-50%);z-index:6;width:64px;height:64px;border-radius:50%;
  border:3px solid var(--line);font-size:1.5em;background:rgba(255,255,255,.94);box-shadow:var(--shadow-lg);cursor:pointer;}
.pano-nav:disabled{opacity:.25;cursor:default;}
.pano-nav.left{left:12px;} .pano-nav.right{right:12px;}
.pano-hint{color:#dfe4f5;font-weight:700;font-size:.85em;padding:8px 16px 12px;text-align:center;}

/* 진열대 (층 그림 위에 놓여요) */
.shelf{position:absolute;bottom:8%;transform:translateX(-50%);border:none;background:none;cursor:pointer;
  font:inherit;color:inherit;display:flex;flex-direction:column;align-items:center;z-index:3;}
.shelf-sign{border-radius:16px 16px 0 0;padding:11px 28px;font-weight:900;font-size:1.28em;color:#fff;
  display:flex;gap:8px;align-items:center;box-shadow:var(--shadow);}
.shelf-body{width:var(--shelfw);background:#f9f1e2;border:4px solid #caa77a;border-radius:8px;padding:12px 12px 8px;
  display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow);transition:transform .12s, box-shadow .12s;}
.shelf:hover .shelf-body{transform:translateY(-4px);box-shadow:0 0 0 4px rgba(255,210,63,.55), var(--shadow-lg);}
.shelf:hover .shelf-sign{filter:brightness(1.08);}
.shelf-row{display:flex;justify-content:space-around;align-items:flex-end;border-bottom:8px solid #caa77a;
  padding-bottom:4px;min-height:70px;gap:6px;}
/* 진열대 폭에 맞춰 물건 칸도 함께 줄어요 (한 줄에 3개가 넘치지 않게) */
.shelf-item{font-size:44px;line-height:1;display:flex;align-items:flex-end;justify-content:center;
  width:calc((var(--shelfw) - 62px)/3);height:68px;overflow:hidden;}
.shelf-item .prod-mini{width:88%;height:auto;max-height:100%;}
.shelf-label{margin-top:8px;font-weight:800;color:var(--ink-soft);font-size:1.02em;background:#fff;
  border:2px solid var(--line);border-radius:999px;padding:6px 18px;}
/* 캐릭터가 지금 서 있는 진열대 — 한 번 더 누르면 들어가요 (노란 테두리로 분명하게) */
.shelf.here .shelf-body{box-shadow:0 0 0 5px #ffd23f, var(--shadow-lg);}
.shelf.here .shelf-sign{outline:3px solid #ffd23f;outline-offset:2px;}
.shelf.heart .shelf-body{background:#fff5f5;border-color:#ffb3b3;}
.shelf.heart .shelf-row{border-color:#ffb3b3;}
/* 좋아한 문구 진열대 그림 — 하트+쇼핑백 이모지 대신 한 장으로. */
.shelf-liked-img{height:148px;width:auto;max-width:100%;object-fit:contain;display:block;}
/* 코너 진열대의 대표 그림 한 장 (2026-08-09).
   ⚠️ 진열대 몸통 높이는 '칸(.shelf-row)의 min-height'가 아니라 **그림 자체 높이**로 정해집니다.
   이 앱은 box-sizing:border-box 라서 min-height 안에 아래 여백 4px과 선반 선 8px이
   포함돼 버리거든요. 그래서 min-height 로 맞추면 '좋아요' 진열대보다 11px 작아집니다.
   → 대표 그림·아이콘·좋아요 그림의 **높이를 셋 다 똑같이(148px)** 두는 것이 정답이에요. */
.shelf-row.rep{align-items:center;justify-content:center;}
.shelf-rep-img{height:148px;width:auto;max-width:100%;object-fit:contain;display:block;}
/* 대표 그림이 없을 때 쓰는 코너 아이콘 — .cicon 이 1.15em 이라 글자 크기로 키워요 */
.shelf-bigicon{display:flex;align-items:center;justify-content:center;height:148px;font-size:118px;line-height:1;}

/* 매장 안을 걸어다니는 내 캐릭터 */
.pano-char{position:absolute;bottom:5%;z-index:5;transform:translateX(-50%);pointer-events:none;
  transition:left 1.1s cubic-bezier(.45,.05,.4,1);display:flex;flex-direction:column;align-items:center;}
.pano-char-inner{display:flex;align-items:flex-end;justify-content:center;}
.pano-char .avatar{border-width:4px;}
/* 걸어다니는 내 캐릭터 밑 이름표 (학생 명단을 쓸 때만 나와요) */
.pano-char-name{margin-top:4px;background:rgba(255,255,255,.94);border:2px solid var(--line);
  border-radius:999px;padding:2px 12px;font-weight:900;font-size:.92em;color:var(--ink);
  box-shadow:var(--shadow);white-space:nowrap;max-width:150px;overflow:hidden;text-overflow:ellipsis;}
.pano-char-shadow{width:56px;height:12px;margin-top:2px;border-radius:50%;

  background:rgba(30,34,54,.22);filter:blur(2px);transition:transform .3s;}
.pano-char.walking .pano-char-inner{animation:charwalk .38s ease-in-out infinite;}
.pano-char.walking .pano-char-shadow{transform:scaleX(.8);opacity:.7;}
@keyframes charwalk{
  0%{transform:translateY(0) rotate(-4deg);}
  50%{transform:translateY(-9px) rotate(4deg);}
  100%{transform:translateY(0) rotate(-4deg);}
}

/* ===== 상품 페이지 넘기기 (스크롤 대신 다음 버튼) ===== */
/* 고르GO: 좋아한 문구가 있으면 '지금 바구니'와 나란히 (세로로 쌓으면 화면을 넘쳐요) */
.choose-cols{display:flex;flex-direction:column;gap:10px;}
.choose-cols.two{flex-direction:row;align-items:flex-start;}
.choose-cols.two > .card{flex:1 1 0;min-width:0;}
.choose-cols.two .choose-list{grid-template-columns:1fr;}   /* 좁아지니 1단으로 */
@media (max-width:820px){ .choose-cols.two{flex-direction:column;} }
.choose-list{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;}   /* 바구니 목록 2단 */
@media (max-width:700px){ .choose-list{grid-template-columns:1fr;} }
/* 물건이 많을 때(9개 이상): 3개씩 한 줄 */
.list3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
@media (max-width:760px){ .list3{grid-template-columns:repeat(2,1fr);} }
/* 하단 이동 줄 (모든 화면 공통 모양) */
.stage-nav{margin-top:2px;}
.stage-nav .btn.ghost{min-height:44px;}
.grid.paged{grid-template-columns:repeat(3,1fr);}   /* 한 화면 3개 x 2줄 = 6개 */
@media (max-width:700px){ .grid.paged{grid-template-columns:repeat(2,1fr);} }
.pager{display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap;}
.pager .btn{min-width:150px;font-size:1.15em;}
.pager-info{background:#fff;border:2px solid var(--line);border-radius:999px;padding:10px 20px;
  font-weight:900;font-size:1.1em;box-shadow:var(--shadow);white-space:nowrap;}
.pager-dots{display:flex;gap:7px;align-items:center;}
.pager-dots i{width:12px;height:12px;border-radius:50%;background:#d9dde8;display:block;}
.pager-dots i.on{background:var(--sky);transform:scale(1.25);}

/* ===== 가로 2단 배열 (홈 도입부 · 지갑 화면) — 스크롤 없이 한 화면 ===== */
.hero-cols{display:flex;gap:26px;align-items:center;text-align:left;padding:18px 24px;}
.hero-cols .hero-left{flex:0 0 44%;display:flex;justify-content:center;min-width:0;}
.hero-cols .hero-img{max-height:58vh;width:auto;max-width:100%;margin:0;}
.hero-cols .hero-right{flex:1;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;min-width:0;}
.ws-cols{display:flex;gap:22px;align-items:stretch;margin-top:8px;}
/* 지갑 화면 왼쪽 : 위=설명 그림(작게), 아래=내가 고른 캐릭터(크게).
   ★ 주인공은 '나'예요 — 설명 그림은 '무엇을 하는 화면인지' 알려 주는 보조 그림이라 작게,
     내가 고른 캐릭터는 크게 보여 줘요. 위쪽에 붙여(flex-start) 캐릭터 자리를 넉넉히 잡아요. */
.ws-left{flex:0 0 36%;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:0;min-width:0;}
.ws-left .wallet-kid{max-height:22vh;width:auto;max-width:300px;margin:0;flex:0 0 auto;}
/* 설명 그림은 위에 그대로 두고, 캐릭터는 '그림 아래 남은 공간의 정중앙'에 놓아요.
   flex:1 로 남은 높이를 모두 차지한 뒤 그 안에서 가운데 정렬(justify-content:center). */
.ws-me{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;}
/* 캐릭터 뒤에 은은한 원을 깔아 '주인공'처럼 보이게 */
.ws-me .avatar{box-shadow:0 0 0 6px #fff, 0 0 0 11px #ffe9a8, var(--shadow-lg);}
.ws-me-name{font-size:1.55em;font-weight:900;color:var(--ink);line-height:1.2;text-align:center;}
.ws-right{flex:1;display:flex;flex-direction:column;gap:10px;justify-content:center;min-width:0;}
.ws-presets{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.ws-presets .choice{justify-content:center;font-size:1.05em;font-weight:900;padding:12px 6px;white-space:nowrap;}
@media (max-width:700px){
  .hero-cols{flex-direction:column;}
  .hero-cols .hero-img{max-height:26vh;}
  .ws-cols{flex-direction:column;}
  .ws-left .wallet-kid{max-height:16vh;max-width:190px;}
  /* 좁은 화면에선 설명 그림과 캐릭터를 나란히 (세로로 쌓으면 화면을 넘쳐요) */
  .ws-left{flex-direction:row;gap:16px;justify-content:center;}
  .ws-me .avatar{width:112px !important;height:112px !important;}
  .ws-me-name{font-size:1.2em;}
}
/* 세로가 짧은 기기(노트북·전자칠판) — 설명 그림을 더 줄이고 캐릭터는 크게 지켜요 */
@media (max-height:820px){
  .ws-left .wallet-kid{max-height:17vh;max-width:250px;}
  .ws-me .avatar{width:144px !important;height:144px !important;}
  .ws-me-name{font-size:1.35em;}
}

/* ===== 홈 화면 (그림을 크게 강조, 눌러서 입장) ===== */
.home-screen{display:flex;flex-direction:column;}
.home-stage{display:flex;flex-direction:column;align-items:center;gap:14px;}
.home-img-wrap{position:relative;display:inline-block;max-width:100%;}
.home-enter{position:relative;display:block;padding:0;border:5px solid #fff;background:none;cursor:pointer;
  border-radius:26px;overflow:hidden;box-shadow:var(--shadow-lg);transition:border-color .15s;}
/* ⚠️ 홈 그림에는 '움직이는' 마우스 효과를 넣지 말 것 (2026-07-27).
   예전엔 :hover 로 3px 떠올랐는데, 이 그림이 화면 거의 전부를 차지하다 보니
   마우스가 들락날락할 때마다 화면 전체가 둥둥 뜨는 것처럼 보였어요.
   시선을 붙잡기 어려운 학생에게는 그 자체가 방해가 됩니다.
   게다가 태블릿·전자칠판은 손으로 누르는데, 누른 뒤 hover 상태가 남아 뜬 채로 있기도 했어요.
   대신 '테두리 색'만 바꿔서 누를 수 있다는 걸 알려요 — 자리는 그대로. */
.home-enter:hover, .home-enter:focus-visible{border-color:#ffd23f;}
/* 홈 그림은 화면 아래까지 꽉 차게 (2026-07-29).
   vh만 쓰면 위아래 여백(위 14px + .app 아래 60px + 테두리 10px)만큼 늘 남았어요.
   calc로 그 여백을 빼서 '남는 높이 전부'를 그림이 쓰게 합니다. */
.home-screen{padding-bottom:10px;}
.home-enter .hero-img{display:block;margin:0;border-radius:0;box-shadow:none;
  background:none;padding:0;border:none;
  max-height:calc(100vh - 44px);width:auto;max-width:100%;}
.home-enter-hint{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);white-space:nowrap;
  background:linear-gradient(135deg,#ff8a8a,#ff6b6b);color:#fff;font-weight:900;font-size:1.2em;
  padding:12px 26px;border-radius:999px;box-shadow:var(--shadow-lg);animation:homePulse 1.8s ease-in-out infinite;}
@keyframes homePulse{0%,100%{transform:translateX(-50%) scale(1);}50%{transform:translateX(-50%) scale(1.05);}}
.home-tools{position:absolute;top:12px;right:12px;display:flex;gap:8px;z-index:3;}
.home-tools .iconbtn{background:rgba(255,255,255,.94);width:56px;height:56px;font-size:1.4em;}
.home-welcome{text-align:center;}
.home-welcome .hint{font-size:1.25em;}
@media (max-height:820px){
  .home-tools .iconbtn{width:48px;height:48px;font-size:1.2em;}
  .home-enter-hint{font-size:1.05em;padding:9px 20px;bottom:12px;}
}

/* ===== 전체화면 모드 : 네비바(상단 스텝바) 숨기고 화면을 최대한 크게 ===== */
.fs-exit-fab{display:none;position:fixed;top:10px;right:12px;z-index:70;width:52px;height:52px;border-radius:50%;
  border:2px solid var(--line);background:rgba(255,255,255,.92);font-size:1.35em;box-shadow:var(--shadow-lg);cursor:pointer;}
.fs-exit-fab:hover{background:#fff;transform:scale(1.05);}
body.fs-active .fs-exit-fab{display:inline-flex;align-items:center;justify-content:center;}
body.fs-active .topbar{display:none;}
body.fs-active .app{padding-top:8px;}
body.fs-active .pano-view{height:clamp(360px,64vh,900px);}
body.fs-active .home-enter .hero-img{max-height:86vh;}
body.fs-active .facade-scene{height:clamp(480px,88vh,1080px);}
body.fs-active .elev-scene{height:clamp(460px,80vh,960px);}

/* ===== 쇼핑 캐릭터 아바타 ===== */
.avatar{border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;
  border:3px solid #fff;box-shadow:var(--shadow);object-fit:cover;background:#fff;line-height:1;}
.avatar-img{object-fit:cover;}
/* '나' 프로필 — 캐릭터+이름표를 통째로 감싸는 파란 테두리 (배경에 묻히지 않게) */
.shopper-chip{display:inline-flex;align-items:center;gap:8px;background:#fff8d9;border:3px solid #7fb4e0;
  border-radius:999px;padding:4px 12px 4px 4px;box-shadow:0 0 0 3px rgba(127,180,224,.20),var(--shadow);
  font-weight:900;white-space:nowrap;}
.shopper-chip .chip-me{background:#eef2ff;color:#4a5db0;border-radius:999px;padding:1px 8px;font-size:.78em;font-weight:900;}
/* 칩을 누르면 캐릭터를 바꿀 수 있어요 */
.shopper-chip.as-btn{font:inherit;font-weight:900;color:inherit;cursor:pointer;transition:transform .1s, box-shadow .12s;}
.shopper-chip.as-btn:hover{transform:translateY(-2px);box-shadow:0 0 0 4px rgba(127,180,224,.30),var(--shadow-lg);}
.figure-avatar{display:inline-flex;}
.figure-avatar .avatar{border-width:4px;}
/* 즐기GO의 '해 볼까요' 카드: 왼쪽 '나' 캐릭터 + 오른쪽 [그림 위, 글자 버튼 아래] */
.do-card{display:flex;flex-direction:row;align-items:center;gap:14px;padding:12px;}
.me-figure{display:inline-flex;flex-direction:column;align-items:center;gap:4px;flex:none;}
.me-figure .avatar{border-width:4px;}
.me-name{font-weight:900;font-size:.95em;color:var(--ink);background:#f4f7ff;border:2px solid var(--line);
  border-radius:999px;padding:2px 12px;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.do-col{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:8px;}
.do-col .scene-mini{width:auto;height:64px;margin:0;padding:4px;border-radius:12px;}

/* ===== 즐긴 날 도장판 ===== */
.stampcard{margin-top:16px;background:linear-gradient(160deg,#fff,#fff8ec);border:3px solid #f0d9a8;
  border-radius:20px;padding:14px 16px;box-shadow:var(--shadow);}
.stamp-head{display:flex;align-items:center;gap:10px;font-size:1.15em;margin-bottom:10px;flex-wrap:wrap;}
.stamp-count{background:#fff2c2;border-radius:999px;padding:2px 12px;font-weight:900;font-size:.85em;color:#7a5a12;}
.stamp-slots{display:grid;grid-template-columns:repeat(10,1fr);gap:8px;}
.stamp-slot{aspect-ratio:1/1;border-radius:50%;border:3px dashed #e2d3b4;background:#fffdf7;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-height:52px;}
.stamp-slot .stamp-num{color:#cbbfa6;font-weight:900;font-size:1.05em;}
.stamp-slot.got{border-style:solid;border-color:#f0a63e;background:#fff2d8;}
.stamp-slot .stamp-mark{font-size:1.5em;line-height:1;}
.stamp-slot .stamp-mark-img{width:62%;height:auto;max-height:62%;object-fit:contain;display:block;}
.stamp-slot .stamp-date{font-size:.62em;font-weight:800;color:#a4762a;}
.stamp-slot.today{box-shadow:0 0 0 4px rgba(255,210,63,.5);animation:stamppop .5s ease;}
@keyframes stamppop{0%{transform:scale(.4) rotate(-18deg);opacity:0;}70%{transform:scale(1.12) rotate(4deg);}100%{transform:scale(1) rotate(0);}}
body.reduce-motion .stamp-slot.today{animation:none;}
@media (max-width:760px){ .stamp-slots{grid-template-columns:repeat(5,1fr);} }
@media (max-height:800px){
  .stampcard{margin-top:6px;padding:7px 10px;}
  .stamp-head{font-size:.95em;margin-bottom:4px;}
  .stamp-slots{gap:4px;}
  .stamp-slot{min-height:30px;border-width:2px;}
  .stamp-slot .stamp-mark{font-size:1.05em;}
  .stamp-slot .stamp-date{font-size:.55em;}
  .stampcard p{font-size:.82em !important;margin-top:3px !important;}
  .panel .hint.soft{padding:7px 12px;font-size:.96em;}
  .stampcard{margin-top:5px;}
  /* 마무리 화면 활동 카드도 조금 더 작게 */
  .actgrid.compact .act{width:168px;padding:7px;gap:2px;}
  .actgrid.compact .act .act-thumb{max-height:74px;object-fit:cover;}
  .actgrid.compact .act .muted{font-size:.85em;}
}

/* ===== 누가 쇼핑할까요? (학생 고르기) ===== */
.stu-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;}
.stu-card{display:flex;align-items:center;gap:14px;background:#fff;border:3px solid var(--line);
  border-radius:20px;padding:16px 18px;box-shadow:var(--shadow);cursor:pointer;font:inherit;color:inherit;
  transition:transform .12s, box-shadow .12s;min-height:88px;text-align:left;}
.stu-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:#b9d9ee;}
.stu-mark{font-size:2.4em;line-height:1;flex:none;}
.stu-name{font-weight:900;font-size:1.5em;min-width:0;overflow:hidden;text-overflow:ellipsis;}
.stu-stamps{font-size:.82em;font-weight:800;color:#a4762a;background:#fff2d8;border-radius:999px;padding:1px 10px;white-space:nowrap;
  display:inline-flex;align-items:center;gap:4px;}
.stu-stamps .stamp-mark-img{width:1.4em;height:1.4em;object-fit:contain;}
.stamp-title{display:inline-flex;align-items:center;gap:8px;}
.stamp-title .stamp-mark-img{width:1.5em;height:1.5em;object-fit:contain;}
@media (max-height:800px){
  .stu-card{min-height:72px;padding:12px 14px;}
  .stu-mark{font-size:2em;}
  .stu-name{font-size:1.3em;}
}

/* 선생님 설정: 학생 명단 편집 */
.stu-edit{background:#fff;border:2px solid var(--line);border-radius:14px;padding:8px 10px;}
/* 선생님 설정: 우리 반 상품 더하기 */
.cprod-form{background:#f7f9ff;border:2px solid var(--line);border-radius:14px;padding:12px;}
.cprod-row{background:#fff;border:2px solid var(--line);border-radius:12px;padding:6px 10px;gap:10px;align-items:center;}
.cprod-thumb{width:44px;height:44px;flex:none;border-radius:10px;background:#fff;border:2px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:22px;overflow:hidden;}
.cprod-thumb img{width:100%;height:100%;object-fit:contain;}
.cprod-thumb.big{width:60px;height:60px;}
.stu-voice{display:inline-flex;gap:4px;flex:none;}
.stu-voice .choice.sm{padding:6px 10px;font-size:.86em;min-height:38px;}
.stu-marks{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
.stu-mark-pick{font-size:1.5em;line-height:1;background:#f7f9ff;border:2px solid var(--line);
  border-radius:12px;padding:6px 9px;cursor:pointer;}
.stu-mark-pick.on{background:#e7f6ff;border-color:#5ec8f2;}

/* ===== 캐릭터 고르기 화면 ===== */
.cs-cols{display:flex;gap:22px;align-items:stretch;margin-top:8px;}
.cs-preview{flex:0 0 34%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  background:linear-gradient(160deg,#fff,#f3f0fb);border:2px solid var(--line);border-radius:20px;padding:16px;min-width:0;}
.cs-preview .avatar{border-width:5px;}
.cs-preview .cs-name{width:100%;text-align:center;font-size:1.15em;font-weight:900;border:2px solid var(--line);
  border-radius:14px;padding:10px 12px;}
.cs-preview .cs-name.locked{background:#fff;color:var(--ink);border-color:#bcd9ea;}
.cs-right{flex:1;display:flex;flex-direction:column;gap:10px;min-width:0;}
/* 캐릭터 12종을 4개씩 3줄로 — 그림을 크게 보여 줘요 (화면 높이에 맞춰 자동으로 커지고 작아져요) */
.cs-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
.cs-cell .avatar{width:clamp(52px,8.6vh,104px) !important;height:clamp(52px,8.6vh,104px) !important;
  font-size:clamp(26px,4.3vh,52px) !important;
  /* 그림이 뜨기 전에도 빈 구멍처럼 보이지 않게 옅은 자리를 깔아 둬요 */
  background:#f3f0fb;}
.cs-cell{border:3px solid var(--line);background:#fff;border-radius:16px;padding:8px 4px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:4px;font:inherit;box-shadow:var(--shadow);transition:transform .1s;}
.cs-cell:hover{transform:translateY(-2px);}
.cs-cell.on{border-color:var(--purple);box-shadow:0 0 0 4px rgba(179,157,219,.35),var(--shadow);background:#f8f4ff;}
.cs-cell .cs-lbl{font-size:.92em;font-weight:800;color:var(--ink-soft);}
.cs-photo-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
@media (max-width:760px){
  .cs-cols{flex-direction:column;}
  .cs-grid{grid-template-columns:repeat(3,1fr);}   /* 좁으면 3개씩 4줄 */
}
@media (max-height:820px){
  .cs-grid{gap:8px;}
  .cs-cell{padding:5px 3px;gap:2px;}
  .cs-cell .avatar{border-width:2px;}
  .cs-cell .cs-lbl{font-size:.85em;}
}

/* ===== 배경 이미지 슬롯 (이미지\배경\ 폴더에 파일을 넣으면 자동 적용) ===== */
.bg-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none;}
.bg-dim{position:absolute;inset:0;pointer-events:none;}
.wallpaper{position:fixed;inset:0;width:100vw;height:100vh;object-fit:cover;z-index:-1;opacity:.9;pointer-events:none;}
.hero{position:relative;overflow:hidden;}
.hero > *{position:relative;z-index:1;}
.hero > .bg-img, .hero > .bg-dim{position:absolute;z-index:0;}
.building-scene{position:relative;border-radius:26px;overflow:hidden;padding:22px 12px;}
.building-scene > .building{position:relative;z-index:1;}
.pano-strip > .bg-img{z-index:0;}
.pano-floorline{z-index:0;}
.pano-deco{position:relative;z-index:1;}
.shelf{z-index:1;}
.corner-banner{display:block;width:100%;height:140px;object-fit:cover;border-radius:18px;
  margin-bottom:14px;box-shadow:var(--shadow);}
/* 코너 제목 줄: 배너 이미지가 있으면 제목 뒤 배경으로 깔려요 (높이 추가 없음) */
.corner-head{position:relative;border-radius:16px;overflow:hidden;padding:2px 8px;margin-bottom:3px;}
.corner-head .bg-img{z-index:0;}
.corner-title{background:rgba(255,255,255,.86);border-radius:999px;padding:6px 18px;box-shadow:var(--shadow);}

/* ===== 4:3 화면(전자칠판·노트북·아이패드 가로)에서 세로로 다 들어오게 ===== */
@media (max-height:900px){
  .hero-img{max-height:36vh;width:auto;max-width:100%;}

}
/* ===== 컴팩트 레이아웃 : 모든 화면에서 스크롤 없이 한 화면에 (전체화면 포함) ===== */
@media (max-height:10000px){
  .stage-scene{max-width:340px;max-height:17vh;width:auto;}   /* 단계 삽화: 높은 화면에서만 작게 표시 */
  .hero h1{font-size:1.9em;}
  .hero-img{max-height:27vh;}
  .hero .sub{font-size:1.02em;}
  .btn.big{font-size:1.2em;padding:15px 26px;min-height:62px;}
  .app{padding-bottom:8px;}
  .stage-back .btn{min-height:40px;padding:7px 12px;font-size:.9em;}
  .stage-back{margin-bottom:0;}
  .stage-back-bottom{margin-top:10px;display:flex;justify-content:flex-start;}
  /* 상단바 한 줄로 압축 */
  .topbar{margin-bottom:10px;}
  .topbar-inner{padding:5px 8px;gap:6px;flex-wrap:nowrap;}
  .brand-logo{width:104px;}
  .steps{gap:4px;flex-wrap:nowrap;}
  .step{padding:4px 6px;font-size:.68em;min-height:36px;}
  .step .num{width:18px;height:18px;}
  .iconbtn{width:42px;height:42px;font-size:1.05em;}
  .budgetbar{padding:6px 12px;}
  .budgetbar .b-item b{font-size:1em;}
  .section-title{margin:4px 0 8px;font-size:1.15em;}
  .btn{min-height:48px;padding:11px 16px;}   /* 낮은 화면: 버튼 전체 살짝 압축 */
  /* 파노라마 : 화면 세로를 채우되 스크롤이 안 생기게 */
  .pano-view{height:clamp(300px,58vh,700px);}
  /* ⚠️ .shelf-body 와 .shelf-item 의 '가로폭'은 여기서 정하지 않아요 (2026-08-03).
     진열대 폭·간격은 --shelfw 변수 하나로 관리합니다(맨 위 :root 참고).
     예전엔 여기에 width:270px / 72px 고정값이 있었는데, 이 미디어쿼리가 max-height:10000px
     (=모든 화면)이라 변수를 늘 덮어써서 **폭은 안 바뀌고 간격만 바뀌는** 상태였어요.
     그 탓에 작은 화면에서 진열대 사이가 26px밖에 안 돼 붙어 보였습니다. */
  .shelf-row{min-height:60px;}
  .shelf-item{font-size:38px;height:58px;}
  .shelf-item .prod-mini{width:54px;height:54px;}
  .shelf-liked-img{height:126px;}
  /* 대표 그림·아이콘도 '좋아요' 그림(126px)과 똑같은 높이로 — 위 ⚠️ 설명 참고 */
  .shelf-rep-img{height:126px;}
  .shelf-bigicon{height:126px;font-size:100px;}
  .shelf-sign{font-size:1.12em;padding:9px 22px;}
  .shelf-label{font-size:.92em;padding:5px 15px;}
  .pano-hint{padding:6px 12px 8px;font-size:.78em;}
  .elev-btn{min-height:38px;padding:6px 10px;font-size:.9em;}
  /* 상품 카드 컴팩트 (3개 x 2줄이 한 화면에) */
  .grid.paged{gap:12px;}
  .paged .product{padding:8px;gap:4px;}
  .paged .product .art{height:50px;font-size:32px;}
  .paged .art .prod-photo{max-height:46px;}
  .paged .product .name{font-size:.9em;}
  .paged .product .price{font-size:.98em;}
  .paged .product .feat{display:none;}
  .paged .product .pill{padding:3px 9px;font-size:.8em;}
  .paged .btn.sm{min-height:38px;padding:6px 9px;font-size:.86em;}
  .paged .heart-btn{width:40px;height:40px;font-size:1em;}
  .pager{gap:12px;}
  .pager .btn{min-height:42px;min-width:126px;padding:8px 16px;}
  .pager-info{padding:5px 14px;font-size:.95em;}
  .pager-dots i{width:10px;height:10px;}
  .grid.paged{gap:10px;}
  .corner-banner{height:90px;margin-bottom:10px;}
  /* 점원 대화·결제 화면 압축 */
  .cashier{padding:12px;}
  /* 채팅창 밖의 큰 그림(계산 방법 고르기·돈 건네기)만 낮춰요 */
  .cashier .choice-figure .person-photo, .cashier .handover-fig .person-photo{height:84px;}
  /* ⚠️ 채팅창 얼굴은 '가로·세로를 함께' 줄여야 해요.
     예전엔 여기서 height만 84px로 낮춰서 116×84 타원이 됐고, 얼굴이 심하게 잘려
     그림이 깨져 보였어요. 정원(正圓)을 지키려면 반드시 둘을 같이 쓸 것. */
  .cashier-row .person-photo, .student-row .person-photo{width:100px;height:100px;}
  .cashier-row .figure-avatar .avatar, .student-row .figure-avatar .avatar{width:100px !important;height:100px !important;}
  .figure-avatar .avatar{width:76px !important;height:76px !important;}
  .talkcard{font-size:1.05em;padding:12px 18px;min-height:52px;}
  .receipt{max-height:58vh;overflow:auto;}   /* 영수증이 길면 영수증 안에서만 스크롤 */
  .scene-mini{width:120px;}
  /* 꾸미기 놀이터: 캔버스·팔레트를 화면 높이에 맞춰 줄이기 */
  .pg-cv{max-height:30vh;width:auto;max-width:100%;}
  .pg-tool{min-width:38px;min-height:38px;font-size:19px;border-radius:10px;}
  .pg-actions .btn{font-size:.88em;}
  .pg-paper{width:34px;height:34px;}
  .pg-swatch{width:34px;height:34px;}
  /* 건물 컴팩트 */
  .building-scene{padding:8px 10px;}
  .b-roof{padding:8px;font-size:1.1em;}
  .b-floor{padding:9px 16px;gap:12px;}
  .b-floor .ficons{font-size:1.25em;letter-spacing:3px;}
  .b-floor .fno{font-size:1.05em;padding:7px 11px;}
  .b-floor .fdesc{font-size:.9em;}
  .b-ground{min-height:32px;font-size:.9em;}
}

/* 낮은 화면에서는 안내띠를 조금 더 낮게 (숨기지 않아요 — 그림이 무엇을 할지 알려주니까) */
@media (max-height:860px){
  .stepbar{gap:12px;padding:6px 14px;}
  .stepbar .stage-scene{height:clamp(52px,10.5vh,104px);}
  .stepbar-cap{font-size:1.12em;}
}

/* 세로가 짧은 태블릿 가로(아이패드 768 · 갤럭시탭 720)에서 한 화면에 딱 들어오게 */
@media (max-height:800px){
  .pano-view{height:clamp(280px,54vh,640px);}
  /* 상품 카드(3개 x 2줄)를 살짝 낮춰서 목록이 스크롤 없이 들어와요 */
  .paged .product{padding:6px;gap:2px;}
  .paged .product .art{height:38px;font-size:26px;}
  .paged .art .prod-photo{max-height:34px;}
  .paged .heart-btn{width:32px;height:32px;font-size:.85em;}
  .pager .btn{min-height:36px;padding:5px 14px;}
  .pager-info{padding:6px 14px;font-size:.96em;}
  .corner-head{margin-bottom:2px;}
  .stepbar{padding:4px 12px;gap:10px;}
  .stepbar .stage-scene{height:clamp(40px,7vh,72px);}
  .stepbar-cap{font-size:1.02em;}
  /* 점원과 대화하는 계산 화면: 얼굴·말풍선·목록을 조금씩 줄여 한 화면에 */
  .cashier{padding:7px;}
  .cashier-row .person-photo,.student-row .person-photo{width:92px;height:92px;border-width:3px;}
  .cashier-row .figure-avatar .avatar,.student-row .figure-avatar .avatar{width:92px !important;height:92px !important;}
  .speech,.talkbubble{min-height:52px;}
  /* 목록은 6개씩 페이지로 나뉘므로 따로 스크롤을 두지 않아요.
     대신 페이지 화살표가 한 줄 더해지니 목록 줄 간격을 조금 줄여요. */
  .choose-list{gap:4px;}
  .choose-list.paged + .pager{margin-top:2px;}
  .choose-list .list-item{padding:3px 10px;font-size:.95em;}
  /* 두 칸이 나란히 있을 땐 페이지 줄도 작게 (한 화면에 들어가게) */
  .choose-cols.two .pager{gap:8px;}
  .choose-cols.two .pager .btn{min-width:92px;min-height:36px;padding:5px 10px;font-size:.9em;}
  .choose-cols.two .pager-info{padding:4px 12px;font-size:.9em;}
  .choose-cols.two .pager-dots{display:none;}
  .choose-cols.two .section-title{font-size:1em;margin-bottom:2px !important;}
  .choose-cols.two > .card{padding:9px !important;}
  .choose-cols{gap:8px;}
  /* 바코드 찍기 화면: 목록 페이지 줄도 작게 (찍는 칸·찍은 칸이 한 화면에) */
  .scanlist{gap:5px;}
  .drag-item{padding:5px 8px !important;gap:4px !important;}
  .drag-item .barcode{height:22px;}
  .wrap > .card{padding:9px !important;}
  .scanlist.paged + .pager{margin-top:2px;}
  .scanlist + .pager .btn{min-width:88px;min-height:34px;padding:4px 10px;font-size:.86em;}
  .scanlist + .pager .pager-info{padding:3px 10px;font-size:.86em;}
  .scanlist + .pager .pager-dots{display:none;}
  .chatbox{padding:8px 10px;gap:8px;margin:6px 0;}
  /* 점원·학생 말풍선을 똑같이 줄여요 (한쪽만 줄이면 글자 크기가 어긋나요) */
  .speech,.talkbubble{padding:9px 13px;font-size:1.02em;}
  .talkcard{padding:9px 13px;min-height:44px;font-size:1em;}
  .choose-list .list-item{padding:4px 10px;}
  .section-title{font-size:1.02em;margin-bottom:4px;}
  .cashier .muted.center{font-size:.85em;margin:2px 0 0;}
  .cashier-title{margin:0 0 2px;}
  /* 카드 결제 페이지: 단말기·카드를 조금 줄여 한 화면에 */
  .card-terminal{width:108px;}
  .card-face{width:54px;height:84px;}
  .bignum{font-size:1.3em;}
  .hint.fit{font-size:.95em;padding:8px 14px;}
}

@media (max-width:640px){
  .pano-strip{gap:22px;padding:22px 30px 0;}
  .shelf-body{width:210px;}
  .b-floor{padding:14px;gap:10px;}
  .b-floor .ficons{letter-spacing:3px;font-size:1.4em;}
}

@media (max-width:640px){
  body{font-size:calc(18px * var(--fs));}
  .steps{gap:5px;}
  .step{padding:6px 8px;font-size:.78em;min-height:42px;}
  .hero h1{font-size:1.8em;}
}

<body>
<div id="root"></div>
<script type="text/plain" id="appcode">
const { useState, useEffect, useRef, useCallback } = React;

/* =========================================================
   GO! 문구마켓  ―  체험형 문구점 웹앱
   상품/가격 수정 위치 →  아래 PRODUCTS 배열
   계산 함수      →  sum(), change() 등 (오류 없이 분리 관리)
========================================================= */

/* ---------- 상품 데이터 (수정은 여기서!) ---------- */
/* ─────────────────────────────────────────────────────────────
   상품 목록 — 2026-08-09 전면 정리

   ■ 코너의 경계 (이 기준으로 물건을 나눠요. 헷갈리면 여기로 돌아오세요)
     쓰기      글씨를 '쓰는' 도구            (다이소 필기구)
     그리기    색을 '칠하는' 도구와 종이     (다이소 미술)
     꾸미기    이미 있는 것에 '붙여서' 예쁘게 (다이소 데코·스티커)
     만들기    '재료'를 가지고 자유롭게       (다이소 만들기 재료)
     키트      '완성품이 정해진' 세트         (다이소 DIY 키트)
     놀이하기  가지고 '노는' 것               (다이소 완구)
     모으기    '모으고 간직'하는 것           (다이소 노트·다이어리)
     정리하기  '담고 세우고 분류'하는 것      (다이소 파일·수납)

   ■ 늘어놓는 순서 = 갈래순 (가나다순 아님)
     코너마다 6개씩 두 쪽이고, 쪽마다 갈래가 하나씩 옵니다.
     가나다순으로 하면 가장 기본인 연필이 2쪽으로 밀리고 펜이 1·2쪽으로 찢어져요.
     실제 다이소도 갈래로 진열하니, 앱에서 찾는 방법이 매장에서 그대로 통합니다.
     갈래 안에서는 '익숙한 것 → 재미있는 것' 순 (볼펜 → 젤펜 → 만년 연필).
     어느 쪽이 무슨 갈래인지는 이 목록 바로 아래 표에 적어 두었어요 (화면에는 안 나옴).

   ■ 값은 다이소처럼 1,000 / 2,000 / 3,000원
     500원짜리는 넣지 마세요. 이 앱은 '지폐'로 계산을 배우는데 동전이 필요해집니다.

   ■ 사진이 아직 없는 12개 (이름 옆 ※)
     사진이 없으면 이모지가 대신 나와요. 다이소에서 찍어
     이미지\상품\<이름>.png 로 넣으면 바로 바뀝니다.
   ───────────────────────────────────────────────────────────── */
const PRODUCTS = [
  /* ── 쓰기 ── 실물(다이소) 기준으로 2026-08-10 전면 교체. 사진 12장 모두 있음.
     1쪽 '쓰는 것'  : 연필 셋(깎아 쓰는 것 → 샤프 → 안 깎는 것) + 펜 셋(볼펜 → 젤펜 → 네임펜)
     2쪽 '돕는 것'  : 고치기 둘 → 깎기 → 표시 → 종이 → 자
     ⚠️ 연필 셋의 feat(특징)은 서로 다르게 쓰세요. 안 그러면 학생 눈에 다 같아 보여요. */
  { id:'w9', corner:'write', name:'연필(10자루)', price:1000, emoji:'✏️', color:'알록달록', feat:'깎아서 써요(HB·B·2B·4B 택1)', use:'부드럽게 잘 써지고 지우개로 지워져요.' },
  { id:'w7', corner:'write', name:'샤프 세트', price:2000, emoji:'✏️', color:'검정', feat:'샤프심을 넣어서 써요', use:'샤프심도 같이 들어 있어요.' },
  { id:'w5', corner:'write', name:'만년 연필', price:1000, emoji:'✏️', color:'회색(고양이 장식)', feat:'깎을 필요 없어요', use:'심이 잘 닳지 않아 오래 사용해요. 한 손으로 달칵 눌러 사용해요.' },
  { id:'w13', corner:'write', name:'볼펜(3색)', price:1000, emoji:'🖊️', color:'검정·파랑·빨강', feat:'부드럽게 글씨가 써져요', use:'검정·빨강·파랑이 함께 있는 3색 볼펜이에요.' },
  { id:'w4', corner:'write', name:'젤펜 세트', price:2000, emoji:'🖊️', color:'알록달록', feat:'젤펜 8개', use:'가볍고 여러 색으로 글씨를 써요.' },

/* 받침에 따라 조사를 골라 줘요 (예: 색연필'을' / 지우개'를') */
function josa(word, withBatchim, withoutBatchim){
  const s = String(word||'').trim();
  const last = s.charCodeAt(s.length-1);
  if(!(last>=0xAC00 && last<=0xD7A3)) return withoutBatchim;   // 한글이 아니면 받침 없음으로
  return ((last-0xAC00)%28) ? withBatchim : withoutBatchim;
}
/* 수량 (2026-08-09) — 바구니의 문구 하나하나가 qty(몇 개)를 가져요.
   qty가 없는 옛 기록(브라우저에 저장돼 있던 바구니)은 1개로 봅니다. */
const qtyOf   = (p) => Math.max(1, (p && p.qty) || 1);
const sum     = (items) => items.reduce((t,p)=> t + (p.price||0)*qtyOf(p), 0);
const countOf = (items) => items.reduce((n,p)=> n + qtyOf(p), 0);   // 몇 '개'인지 (종류 수가 아니라)
const change = (paid, total) => Math.max(0, (paid||0) - (total||0));
const shortfall = (paid, total) => Math.max(0, (total||0) - (paid||0));

/* ---------- 그림 주소 만들기 ----------
   그림 파일을 새로 바꿔도 바로 보이도록 주소 뒤에 번호(?v=)를 붙여요.
   그 방식이 안 되는 환경이면 자동으로 번호 없는 원래 주소로 넘어갑니다. */
const IMGV = Date.now();
/* 끌어다 놓는 자리를 '넉넉하게' 판정해요 (2026-07-29).
   소근육 조절이 어려운 학생은 작은 칸에 정확히 놓기가 힘들어요.
   칸 둘레로 pad(px)만큼 여유를 둬서, 가까이만 가도 들어간 것으로 봐요.
   ※ 이 앱은 정확도를 겨루는 곳이 아니라 '해 보는' 곳이에요. */
function nearRect(el, x, y, pad){
  if(!el) return false;
  const r = el.getBoundingClientRect();
  const p = pad==null ? 90 : pad;
  return x>=r.left-p && x<=r.right+p && y>=r.top-p && y<=r.bottom+p;
}
function imgList(base){

}

/* ---------- 음성 (하나의 목소리로 고정 · 겹침 방지) ----------
   voiceEnabled : 음성 전체 켜짐 여부
   autoVoice    : 자동 안내 재생 여부 (false면 🔊 버튼을 눌렀을 때만 재생)
   chosenVoice  : 한 번 고른 한국어 목소리를 계속 재사용 (목소리 섞임 방지)         */
let voiceEnabled = true;
let autoVoice = false;
let chosenVoice = null;
let koVoices = [];
let studentGender = 'female';   // 학생 목소리: 'female' | 'male'
let clerkGender = 'male';        // 점원(그림·목소리): 'male' | 'female'  (기본=남자 점원)
