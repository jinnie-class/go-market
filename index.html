/* =========================================================
   ② 고르GO!
========================================================= */
function ChooseStage({settings, likes, basket, setBasket, budget, total, remaining, maxItems, onBack, onNext, onRetry, onWalletReset, onChangeCharacter}){
  const inBasket = (id)=> basket.some(p=>p.id===id);
  const qtyIn = (id)=> { const f = basket.find(p=>p.id===id); return f ? qtyOf(f) : 0; };
  /* ⚠️ 개수 계산은 setBasket(b=> ...) 안에서 — 빠르게 두 번 눌러도 두 번 다 반영돼요.
     (같은 이유를 구경하GO! 화면의 addBasket 위에도 적어 두었어요) */
  const addBasket = (p)=>{
    if(countOf(basket)>=maxItems){ speak(`바구니에는 ${maxItems}개까지 담을 수 있어요.`); return; }
    // 예산을 넘어도 막지 않아요. 좋아하는 문구를 자유롭게 담고, 필요하면 스스로 바꿔요.
    setBasket(b=> b.some(x=>x.id===p.id)
      ? b.map(x=> x.id===p.id ? {...x, qty:qtyOf(x)+1} : x)
      : [...b, {...p, qty:1}]);
    playSfx('drop');
  };
  /* ➖ : 2개 이상이면 하나 줄이고, 1개일 때 누르면 바구니에서 빼요 */
  const lessBasket = (p)=>{
    setBasket(b=>{
      const cur = b.find(x=>x.id===p.id);
      if(!cur) return b;
      return qtyOf(cur) <= 1 ? b.filter(x=>x.id!==p.id)
                             : b.map(x=> x.id===p.id ? {...x, qty:qtyOf(x)-1} : x);
    });
    playSfx('drop');
  };
  const removeBasket = (id)=> setBasket(b=>b.filter(p=>p.id!==id));
  return (
    <div className="col" style={{gap:10}}>
      <BudgetBar name={settings.name} budget={budget} total={total} remaining={remaining} basketCount={countOf(basket)} maxItems={maxItems} wallet={settings.walletView!==false} onWalletReset={onWalletReset} onChangeCharacter={onChangeCharacter} />
      <StageScene stage="choose" />

      {/* 좋아한 문구가 있으면 두 칸을 나란히 (세로로 쌓으면 화면을 넘쳐요) */}
      <div className={"choose-cols"+(likes.length>0?' two':'')}>
      <div className="card" style={{padding:12}}>
        <div className="section-title" style={{fontSize:'1.1em', margin:'0 0 6px'}}>🧺 지금 바구니 <Speak text={'바구니에 '+countOf(basket)+'개, 합계 '+won(total)+'이에요.'} /></div>
        {basket.length===0 && <div className="muted">아직 담은 문구가 없어요. 아래에서 골라 담아 보세요.</div>}
        {/* 좋아한 문구 칸이 옆에 함께 나오면 바구니는 3개씩, 없으면 8개씩 (측정으로 정한 값) */}
        <Paged items={basket} per={likes.length>0 ? 3 : 8} resetKey={'basket'+basket.length+'-'+(likes.length>0)} cls="choose-list" render={p=>(
            <div key={p.id} className="list-item">
              <span><b>{p.name}</b> · {won(p.price)}</span>
              <QtyBox n={qtyOf(p)} onMinus={()=>lessBasket(p)} onPlus={()=>addBasket(p)} />
            </div>
          )} />
        {remaining<0 && <Hint kind="soft" style={{padding:'6px 12px', fontSize:'.95em'}} text="지갑보다 많아요. 물건을 하나 빼 볼까요?">💛 지갑보다 많아요. 물건을 하나 빼 볼까요?</Hint>}
      </div>

      {likes.length>0 && (
        <div className="card" style={{padding:12}}>
          <div className="section-title" style={{fontSize:'1.1em', margin:'0 0 6px'}}>"💗 좋아요" 중에서 고르기</div>
          {/* 큰 사진 카드 대신 목록으로 — 바구니와 나란히 한 화면에 들어가게 */}
          <Paged items={likes} per={3} resetKey={'choose-likes'} cls="choose-list" render={p=>(
              <div key={p.id} className="list-item">
                <span><b>{p.name}</b> · {won(p.price)}</span>
                {inBasket(p.id)
                  ? <QtyBox n={qtyIn(p.id)} onMinus={()=>lessBasket(p)} onPlus={()=>addBasket(p)} />
                  : <button className="btn sm mint" onClick={()=>addBasket(p)}>🧺 담기</button>}
              </div>
            )} />
        </div>
      )}
      </div>

      <div className="row stage-nav">
        <button className="btn ghost" onClick={onBack}>◀ 👀 구경하러 돌아가기</button>
        <span className="spacer"></span>
        <button className="btn primary big" disabled={basket.length===0}
          onClick={()=> basket.length? onNext() : speak('문구를 하나 이상 골라 주세요.')}>
          🔦 바코드를 찍으러 가기
        </button>
      </div>
    </div>
  );
}

/* =========================================================
   ③ 찍어보GO! (바코드)
========================================================= */
function ScanStage({settings, basket, scanned, setScanned, budget, total, onDone, onBack, onNext, celebrate, checkoutMode, setCheckoutMode}){
  const [flash, setFlash] = useState(false);
  const [guess, setGuess] = useState(null);        // 도전: 예상 합계

  // 바구니를 바꾼 뒤(빼거나 새로 담은 뒤) 다시 오면, 이미 없는 물건은 '찍은 목록'에서 정리해요.
  // (이게 어긋나면 7/6처럼 개수가 안 맞고 계산으로 못 넘어가는 문제가 생겨요)
  useEffect(()=>{
    setScanned(prev=>{
      const next = prev.filter(p=> basket.some(b=>b.id===p.id));
      return next.length===prev.length ? prev : next;
    });
  }, [basket]);

  /* 찍은 물건은 '바구니의 지금 상태'를 다시 찾아 씁니다 (2026-08-09).
     찍어 둔 사본을 그대로 쓰면, 학생이 고르기로 되돌아가 개수를 바꿨을 때
     옛 개수로 합계가 계산돼요. id로 다시 찾으면 언제나 지금 개수가 반영됩니다. */
  const validScanned = scanned.map(s=> basket.find(b=>b.id===s.id)).filter(Boolean);
  const notScanned = basket.filter(p=>!validScanned.some(x=>x.id===p.id));
  const allDone = basket.length>0 && notScanned.length===0;   // '남은 것이 없다'로 판정 (개수 비교 X)

  // 계산 방법을 다시 고르면 그동안 찍은 물건은 처음부터 다시 찍어요.
  const resetMode = ()=>{
    setScanned([]);
    setCheckoutMode(null);
    speak('계산 방법을 다시 골라요. 바코드는 처음부터 다시 찍어요.');
  };
  const scannedTotal = sum(validScanned);
  /* 바코드 '삑'은 공용 playSfx를 씀.
     예전엔 여기서 찍을 때마다 new AudioContext()를 만들었는데, 브라우저가 한 페이지에
     허용하는 개수(보통 6개)를 넘으면 그 뒤로 소리가 안 났음. 이제 하나를 계속 씀. */

  const scan = (p)=>{
    if(validScanned.some(x=>x.id===p.id)){ speak('이 물건은 이미 찍었어요. 다음 물건을 찍어 볼까요?'); return; }
    playSfx('beep'); setFlash(true); setTimeout(()=>setFlash(false), 400);
    const next=[...validScanned, p]; setScanned(next);
    /* 점원이 찍어 줄 때와 '같은 말'로 (2026-07-28).
       뒤에 “바코드를 잘 찾았어요!”를 붙이면 4.5초가 넘어서, 학생이 다음 물건을 찍는 순간
       물건 이름이 잘렸어요. 찍혔다는 것은 삑 소리·화면 반짝임·목록에 쌓이는 것으로 충분하고,
       매번 칭찬을 붙이면 이 앱이 피하려는 '평가 느낌'도 생겨요. */
    speak(p.name+' '+won(p.price), false, 'clerk');
    if(!settings.reduceMotion) celebrate();
    if(basket.every(b=> next.some(s=>s.id===b.id))){ onDone(); }
  };

  // 드래그로 스캐너에 가져다 놓기 (터치·마우스 모두 지원)
  const scannerRef = useRef(null);
  const [drag, setDrag] = useState(null);   // {p, x, y}
  const [hot, setHot] = useState(false);
  /* 스캐너도 둘레 70px까지 넉넉하게 (카드 넣기와 같은 이유 — nearRect 설명 참고) */
  const overScanner = (x,y)=> nearRect(scannerRef.current, x, y, 70);
  const startDrag = (e, p)=>{
    if(e.button===2) return;   // 오른쪽 버튼 무시
    e.preventDefault();        // 텍스트 선택·기본 드래그 막기
    // 마우스·터치·펜 좌표를 창(window) 이벤트로 직접 따라가요 (setPointerCapture 미사용: 전체화면에서도 동일하게 동작)
    setDrag({p, x:e.clientX, y:e.clientY});
    setHot(overScanner(e.clientX, e.clientY));
    const move=(ev)=>{ if(ev.cancelable) ev.preventDefault(); setDrag({p, x:ev.clientX, y:ev.clientY}); setHot(overScanner(ev.clientX, ev.clientY)); };
    const up=(ev)=>{
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
      window.removeEventListener('pointercancel', up);
      const dropped = overScanner(ev.clientX, ev.clientY);
      setDrag(null); setHot(false);
      if(dropped) scan(p);
    };
    window.addEventListener('pointermove', move, {passive:false});
    window.addEventListener('pointerup', up);
    window.addEventListener('pointercancel', up);
  };

  /* 합계 안내는 '마지막 물건 이름을 다 말한 뒤'에 해요.
     바로 말하면 마지막 물건이 찍히는 순간 그 이름을 덮어써서
     "파스텔 형광펜…"이 첫 글자만 들리고 끊겼어요(점원·키오스크 둘 다).
     화면에는 이미 '🎉 모든 물건의 가격을 확인했어요!'가 떠 있으니 잠깐 기다려도 괜찮아요. */
  useEffect(()=>{
    if(!allDone) return;
    /* 3.2초 = 가장 긴 상품명("구슬 팔찌 만들기 세트 2,000원")까지 다 말할 시간.
       2.6초로 뒀더니 "파스텔 형광펜 2,000원"이 끝나기 직전에 잘렸어요. */
    const t = setTimeout(()=> speak('모든 물건의 가격을 확인했어요! 모두 합해서 '+won(scannedTotal)+'이에요.'), 3200);
    return ()=> clearTimeout(t);
  }, [allDone]);

  /* 점원이 대신 찍어 주는 흐름 — 한 물건을 '다 말한 뒤' 다음 물건을 찍어요.
     예전엔 0.9초마다 밀어붙여서 “무지개 색연필 1,000원”을 다 말하기도 전에
     다음 삑 소리와 함께 말이 잘렸어요(이름만 들리고 가격이 사라짐). */
  const handOver = ()=>{
    const list = notScanned;
    let i = 0;
    const step = ()=>{
      if(i >= list.length){ window.setTimeout(onDone, 400); return; }
      const p = list[i++];
      playSfx('beep'); setFlash(true); window.setTimeout(()=>setFlash(false), 320);
      setScanned(prev=> prev.some(x=>x.id===p.id)? prev : [...prev, p]);
      /* 말이 끝나면 다음 물건. 물건 사이에 잠깐(0.35초) 쉬어 하나씩 들리게 해요 */
      speakThen(p.name+' '+won(p.price), 'clerk', ()=> window.setTimeout(step, 350), 900);
    };
    step();
  };

  return (
    <div className="col" style={{gap:8}}>
      <StageScene stage="scan" />

      {/* ① 어디서 계산할지 먼저 고르기 */}
      {!checkoutMode && (
        <div className="card center" style={{flexDirection:'column', gap:18}}>
          {/* 두 버튼에 이미 '점원이 찍어 줘요 / 내가 직접 찍어요' 설명이 붙어 있어서
              음성은 물음만 짧게 해요 (같은 말을 두 번 하지 않기) */}
          <Hint kind="fit" text="어디에서 계산할까요?" style={{fontSize:'1.5em'}}>
            🛒 어디에서 계산할까요?
          </Hint>
          <div className="row center" style={{gap:22, alignItems:'stretch', flexWrap:'wrap', width:'100%', maxWidth:960, margin:'0 auto'}}>
            <button className="card center" style={{flexDirection:'column', gap:16, flex:'1 1 340px', minWidth:280, padding:'40px 28px', cursor:'pointer', border:'3px solid var(--line)'}}
              onClick={()=>{ setCheckoutMode('clerk'); speak('점원에게 가서 계산해요.', true, 'clerk'); }}>
              <div className="choice-figure"><ClerkFigure /></div>
              <b style={{fontSize:'1.7em'}}>점원에게 가기</b>
              <span className="muted" style={{fontSize:'1.2em', lineHeight:1.5}}>점원이 바코드를 찍어 줘요.<br/>인사하고 이야기하며 계산해요.</span>
            </button>
            <button className="card center" style={{flexDirection:'column', gap:16, flex:'1 1 340px', minWidth:280, padding:'40px 28px', cursor:'pointer', border:'3px solid var(--line)'}}
              onClick={()=>{ setCheckoutMode('kiosk'); speak('키오스크에서 내가 직접 찍어요.', true); }}>
              <div className="choice-figure"><KioskFigure /></div>
              <b style={{fontSize:'1.7em'}}>키오스크에서 하기</b>
              <span className="muted" style={{fontSize:'1.2em', lineHeight:1.5}}>내가 직접 바코드를 찍고<br/>혼자 계산해요.</span>
            </button>
          </div>
          <div className="row stage-nav" style={{width:'100%', justifyContent:'flex-start'}}>
            <button className="btn ghost" onClick={onBack}>◀ 🧺 고르기로 돌아가기</button>
          </div>
        </div>
      )}

      {/* ②-A 점원이 찍어 주는 경우 */}
      {checkoutMode==='clerk' && (
        <div className="card center" style={{flexDirection:'column', gap:8, padding:12}}>
          {/* 점원 그림 옆에 말풍선처럼 문장을 놓아요 */}
          <div className="row center" style={{gap:14, flexWrap:'wrap', justifyContent:'center'}}>
            <div className="handover-fig"><ClerkFigure /></div>
            <Hint kind="fit" style={{padding:'10px 18px', margin:0}} text="점원이 바코드를 찍어 줄 거예요. 물건을 건네 볼까요?">
              점원이 바코드를 찍어 줘요.<br/>물건을 건네 볼까요?
            </Hint>
          </div>
          {notScanned.length>0 && (
            <button className="btn primary big" onClick={handOver}>🤝 점원에게 물건 건네기</button>
          )}
          {/* 찍은 물건도 6개씩 나눠 보여 줘요 (스크롤 없이) */}
          <div style={{width:'100%', maxWidth:920}}>
            <Paged items={validScanned} per={6} followLast={true} resetKey="clerkscan" cls="choose-list" render={(p,i,now)=>(
              <div key={p.id} className={"list-item"+(now?' now':'')}><span>{p.name}{qtyOf(p)>1 && <b className="qty-tag"> &times;{qtyOf(p)}</b>}</span><b>{won(p.price*qtyOf(p))}</b></div>
            )} />
          </div>
          {validScanned.length>0 && (
            <div className="row center"><b>현재 합계</b><b className="bignum" style={{color:'#c0392b'}}>{won(scannedTotal)}</b></div>
          )}
          <button className="btn ghost sm" onClick={resetMode}>◀ 계산 방법 다시 고르기</button>
        </div>
      )}

      {/* ②-B 키오스크에서 내가 찍는 경우 */}
      {checkoutMode==='kiosk' && (
      <React.Fragment>
      <Hint style={{padding:'4px 12px'}} text="물건을 스캐너로 끌어다 놓으면 바코드가 찍혀요.">🔦 물건을 스캐너로 <b>끌어다 놓아요</b>.</Hint>
      <div className="wrap" style={{gap:12, alignItems:'flex-start'}}>

        {/* 왼쪽: 고른 상품 (끌어서 스캐너로) */}
        <div className="card" style={{flex:'1 1 260px', padding:12}}>
          <b>🧺 내가 고른 문구</b>
          <p className="muted" style={{fontSize:'.85em', margin:'4px 0 0'}}>물건을 손가락으로 눌러 스캐너로 끌어요.</p>
          <div className="col" style={{gap:6, marginTop:6}}>
            {notScanned.length===0 && <div className="muted good-txt">모두 찍었어요! ✨</div>}
            {/* 많이 골라도 스크롤이 안 생기게 3개씩 나눠 보여 줘요 */}
            <Paged items={notScanned} per={2} resetKey={'notscan'+notScanned.length} cls="col scanlist" render={p=>(
              <div key={p.id} className="list-item drag-item"
                style={{flexDirection:'column', alignItems:'stretch', gap:6, textAlign:'left', opacity: drag&&drag.p.id===p.id?0.35:1}}
                onPointerDown={(e)=>startDrag(e,p)}>
                <div className="row" style={{alignItems:'center', gap:8, flexWrap:'nowrap'}}>
                  <span style={{fontSize:'1.6em', flex:'0 0 auto', display:'flex', alignItems:'center'}}>
                    <ProductImg key={p.id} p={p} mini={true} />
                  </span>
                  <b style={{whiteSpace:'nowrap'}}>{p.name}</b>
                  {qtyOf(p)>1 && <b className="qty-tag">&times;{qtyOf(p)}</b>}
                  <span className="grab-hint" style={{flex:'0 0 auto', marginLeft:'auto'}}>✋ 끌기</span>
                </div>
                <div className="row" style={{alignItems:'center', gap:8, flexWrap:'nowrap'}}>
                  <span className="barcode">{Array.from({length:9}).map((_,i)=><i key={i}></i>)}</span>
                  <span className="spacer"></span>
                  <button className="btn sm mint" style={{flex:'0 0 auto'}} onPointerDown={(e)=>e.stopPropagation()} onClick={()=>scan(p)} title="여기를 눌러도 찍혀요">🔦 찍기</button>
                </div>
              </div>
            )} />
          </div>
        </div>

        {/* 가운데: 스캐너 (드롭 존) */}
        <div className="card center" style={{flex:'1 1 260px', flexDirection:'column', gap:10, padding:12}}>
          <b>📡 바코드 스캐너</b>
          <div ref={scannerRef} className={"scanner "+(flash?'pop ':'')+(hot?'hot':'')}
            style={{width:'100%', background: flash?'#eafaf1':undefined}}>
            <div className="scanline"></div>
            <div style={{fontSize:'3.2em'}}>{flash?'✅':(hot?'🎯':'🔦')}</div>
            <div style={{fontWeight:800, color:'#0b4a63'}}>
              {flash?'삑! 잘 찍었어요' : (hot?'여기에 놓으세요!' : '물건을 여기로 끌어오세요')}
            </div>
          </div>
          <div className="row center" style={{gap:8}}>
            <button className="btn ghost sm" onClick={onBack}>⬅️ 다시 고르기</button>
            <button className="btn ghost sm" onClick={resetMode}>◀ 계산 방법</button>
          </div>
        </div>

        {/* 오른쪽: 찍은 목록 */}
        <div className="card" style={{flex:'1 1 240px', padding:12}}>
          <b>🧾 찍은 물건</b>
          <div className="col" style={{gap:6, marginTop:6}}>
            {validScanned.length===0 && <div className="muted">아직 찍은 물건이 없어요.</div>}
            {/* 찍은 물건도 4개씩 (찍는 칸과 같은 화면에 나란히 두려고).
                followLast: 방금 찍은 물건이 있는 쪽으로 화면이 저절로 넘어가요 —
                예전엔 찍을 때마다 1쪽으로 되돌아가서, 학생이 '다음'을 눌러도 소용없었어요. */}
            <Paged items={validScanned} per={4} followLast={true} resetKey="kioskscan" cls="col scanlist" render={(p,i,now)=>(
              <div key={p.id} className={"list-item"+(now?' now':'')}><span>{p.name}{qtyOf(p)>1 && <b className="qty-tag"> &times;{qtyOf(p)}</b>}</span><b>{won(p.price*qtyOf(p))}</b></div>
            )} />
          </div>
          <hr/>
          <div className="row"><b>현재 합계</b><span className="spacer"></span><b className="bignum" style={{color:'#c0392b'}}>{won(scannedTotal)}</b></div>
        </div>
      </div>
      </React.Fragment>
      )}

      {checkoutMode && !allDone && basket.length>0 && (
        <div className="card" style={{display:'flex', alignItems:'center', gap:10, padding:'8px 14px', flexWrap:'wrap'}}>
          <button className="btn ghost sm" onClick={onBack}>◀ 🧺 고르기</button>
          <Hint kind="warm" style={{padding:'6px 12px', fontSize:'.95em', margin:0, textAlign:'left'}}
            text={'아직 '+notScanned.length+'개 남았어요. 모두 찍으면 계산하러 갈 수 있어요.'}>
            🔦 아직 <b>{notScanned.length}개</b> 남았어요. 모두 찍으면 계산하러 갈 수 있어요.
            <span className="pill" style={{marginLeft:10}}>{validScanned.length} / {basket.length} 개 찍음</span>
          </Hint>
          <span className="spacer" style={{flex:1}}></span>
          <button className="btn sm" disabled onClick={()=>{}}>💳 계산하러 가기</button>
        </div>
      )}

      {allDone && (
        <div className="card" style={{background:'#f0faff', padding:12}}>
          <Hint kind="fit" text={'모든 물건의 가격을 확인했어요! 모두 합해서 '+won(scannedTotal)+'이에요.'}>
            🎉 모든 물건의 가격을 확인했어요! 모두 합해서 <b>{won(scannedTotal)}</b>이에요.
          </Hint>

          {settings.difficulty==='easy' && (
            <div className="row center" style={{marginTop:12}}>
              <span className="bignum">합계 {won(scannedTotal)}</span>
              <span className={"pill"} style={{fontSize:'1em', padding:'8px 14px', background: scannedTotal<=budget?'#eafaf1':'#fff6e6', color:scannedTotal<=budget?'#177245':'#6a5200'}}>
                {scannedTotal<=budget? '💰 내 돈으로 살 수 있어요.' : '돈이 조금 더 필요해요.'}
              </span>
            </div>
          )}
          {settings.difficulty==='normal' && (
            <div className="row center" style={{marginTop:12}}>
              <span className="bignum">가진 돈 {won(budget)}</span>
              <span className="bignum" style={{color:'#c0392b'}}>물건값 {won(scannedTotal)}</span>
              <span className="bignum good-txt">남은 돈 {won(budget-scannedTotal)}</span>
            </div>
          )}
          {settings.difficulty==='challenge' && (
            <div style={{marginTop:12}}>
              {guess===null ? (
                <div className="col center" style={{gap:10}}>
                  <b>합계가 얼마일까요? 먼저 예상해 볼까요?</b>
                  <div className="wrap center" style={{gap:10}}>
                    {Array.from(new Set([scannedTotal, scannedTotal+1000, Math.max(1000,scannedTotal-1000), scannedTotal+2000]))
                      .sort((a,b)=>a-b).map(v=>(
                      <button key={v} className="btn ghost" onClick={()=>{setGuess(v); speak(v===scannedTotal?'딩동댕! 정확해요.':'실제 합계는 '+won(scannedTotal)+'이에요.');}}>{won(v)}</button>
                    ))}
                  </div>
                </div>
              ):(
                <Hint kind={(guess===scannedTotal?'':'warm')+' fit'}>
                  {guess===scannedTotal? '딩동댕! 정확하게 예상했어요. ' : '괜찮아요. '} 실제 합계는 <b>{won(scannedTotal)}</b>이에요.
                </Hint>
              )}
            </div>
          )}

          <div className="row" style={{marginTop:14}}>
            <button className="btn ghost" onClick={onBack}>◀ 🧺 고르기로 돌아가기</button>
            <span className="spacer"></span>
            <button className="btn primary big" onClick={onNext}>💳 계산하러 가기</button>
          </div>
        </div>
      )}

      {drag && <div className="drag-ghost" style={{left:drag.x, top:drag.y}}>
        <span className="drag-ghost-inner"><ProductImg p={drag.p} mini /></span>
      </div>}
    </div>
  );
}

/* =========================================================
   ④ 계산하GO!
========================================================= */
function PayStage({settings, basket, total, budget, onBack, onGoPay, checkoutMode}){
  const forced = settings.pay!=='choose' ? settings.pay : null;
  const chatOn = checkoutMode==='clerk' && settings.cashierChat!==false;
  const [phase, setPhase] = useState(chatOn? 'greet':'pay'); // greet | pay

  return (
    <div className="col" style={{gap:10}}>
      <StageScene stage="pay" />
      <div className="card" style={{padding:12}}>
        <div className="section-title" style={{fontSize:'1.1em', margin:'0 0 6px'}}>
          {checkoutMode==='kiosk' ? '🖥️ 셀프 계산대' : '🧾 점원 계산대'} <Speak text={'모두 합해서 '+won(total)+'이에요.'} /></div>
        <Paged items={basket} per={6} resetKey={'pay'+basket.length} cls="choose-list" render={p=>(
          <div key={p.id} className="list-item"><span>{p.name}{qtyOf(p)>1 && <b className="qty-tag"> &times;{qtyOf(p)}</b>}</span><b>{won(p.price*qtyOf(p))}</b></div>
        )} />
        <hr/>
        <div className="row"><b>총 금액</b><span className="spacer"></span><b className="bignum" style={{color:'#c0392b'}}>{won(total)}</b></div>
      </div>

      {phase==='greet' && (
        <CashierChat mode="greet" total={total} studentName={settings.name} onDone={()=>{ setPhase('pay'); speak('이제 돈을 내고 계산해요.'); }} />
      )}

      {phase==='pay' && (
        <div className="card center" style={{flexDirection:'column', gap:10, padding:14}}>
          <b style={{fontSize:'1.2em'}}>어떻게 계산할까요?</b>
          <div className="row" style={{justifyContent:'center'}}>
            {(!forced || forced==='cash') && <button className="btn mint big" onClick={()=>onGoPay('cash')}>💵 현금으로 내기</button>}
            {(!forced || forced==='card') && <button className="btn sky big" onClick={()=>onGoPay('card')}>💳 카드로 내기</button>}
          </div>
        </div>
      )}

      <div className="row stage-nav">
        <button className="btn ghost" onClick={onBack}>◀ 🔦 바코드로 돌아가기</button>
      </div>
    </div>
  );
}

/* ---- 결제 페이지 (현금/카드 고른 뒤 넘어오는 별도 페이지) ---- */
function PayPageArt({method}){
  // 문장 이름 → 짧은 이름 순서로 여러 파일 이름을 찾아요
  const names = method==='cash'
    ? ['현금으로 돈을 내요','현금으로 내기']
    : ['카드로 계산해요','카드로 내기'];
  const srcs = [];
  names.forEach(nm=> imgList('이미지/'+nm).forEach(x=> srcs.push(x)));
  const [i, setI] = useState(0);
  const [failed, setFailed] = useState(false);
  if(failed) return null;
  return <img className="stage-scene" src={srcs[i]} alt=""
    onError={()=>{ if(i<srcs.length-1) setI(i+1); else setFailed(true); }} />;
}

function PayingPage({settings, basket, total, method, paidBills, setPaidBills, onBack, onRetry, onDone, checkoutMode}){
  const chatOn = checkoutMode==='clerk' && settings.cashierChat!==false;
  const [pending, setPending] = useState(null);
  const [closing, setClosing] = useState(false);
  const cap = method==='cash' ? '현금으로 돈을 내요' : '카드로 계산해요';
  /* 계산이 끝나는 세 갈래(간단 현금·현금 연습·카드)가 모두 여기로 모이므로,
     완료음 '딩동'은 여기 한 곳에만 넣어요. */
  const finishPay = (info)=>{ playSfx('done'); if(chatOn){ setPending(info); setClosing(true); } else onDone(info); };

  return (
    <div className="app">
      <div className="stepbar">
        <PayPageArt key={method} method={method} />
        <div className="stepbar-cap"><span>{cap}</span><Speak text={cap} /></div>
      </div>

      {!closing && (
        <div className="stage-back noprint">
          <button className="btn" onClick={onBack}>◀ 💳 계산 방법 다시 고르기</button>
        </div>
      )}

      <div className="col" style={{gap:18}}>
        {!closing && method==='cash' && (settings.moneyPractice
          ? <CashPay settings={settings} total={total} paidBills={paidBills} setPaidBills={setPaidBills}
              onBack={onBack} onRetry={onRetry}
              onComplete={(paid,chg)=>finishPay({method:'cash', total, items:basket, paid, change:chg, date:new Date()})} />
          : <SimplePayCash settings={settings} total={total} onBack={onBack}
              onComplete={(paid,chg)=>finishPay({method:'cash', total, items:basket, paid, change:chg, date:new Date()})} />
        )}
        {!closing && method==='card' && (
          <CardPay total={total} items={basket} onBack={onBack}
            onComplete={()=>finishPay({method:'card', total, items:basket, date:new Date()})} />
        )}
        {closing && <CashierChat mode="closing" onDone={()=> onDone(pending)} />}
      </div>
    </div>
  );
}

/* ---- 간단 현금 결제 (여가 중심 기본값) : 돈 건네기 한 번으로 끝 ----
   지폐 세기·거스름돈 계산 없이, 지갑에서 돈을 꺼내 건네는 '경험'에 집중해요.
   자세한 계산 연습은 교사 설정에서 moneyPractice 를 켜면 아래 CashPay 로 바뀌어요. */
function SimplePayCash({settings, total, onBack, onComplete}){
  const [done, setDone] = useState(false);
  const bills = billsFor(total);
  const hand = ()=>{
    if(done) return;
    setDone(true);
    /* 완료음 '딩동'은 세 갈래가 모이는 PayingPage.finishPay 에서 한 번만 울려요.
       말을 '다 한 뒤'에 넘어가요 (2026-07-28) — 예전엔 1.3초로 정해 두어
       "지갑에서 돈을 꺼내 건넸…"까지만 들리고 다음 장면(점원 인사)이 말을 잘랐어요. */
    speakThen('지갑에서 돈을 꺼내 건넸어요. 스스로 잘 계산했어요!', null,
      ()=> window.setTimeout(()=> onComplete(total, 0), 500), 1500);
  };
  return (
    <div className="card center" style={{flexDirection:'column', gap:16}}>
      <div className="section-title" style={{fontSize:'1.2em', justifyContent:'center'}}>💵 현금으로 내기</div>
      <div className="bignum" style={{color:'#c0392b'}}>{won(total)}</div>
      {bills.length>0 && (
        <div className="wrap center" style={{gap:6}}>
          {bills.map((b,i)=><MiniBill key={i} b={b} />)}
        </div>
      )}
      <Hint kind="fit" text="지갑에서 돈을 꺼내 점원에게 건네요.">🤝 지갑에서 돈을 꺼내 점원에게 건네요.</Hint>
      {!done
        ? <button className="btn mint big" style={{minWidth:220}} onClick={hand}>🤝 돈 건네기</button>
        : <div className="good-txt" style={{fontSize:'1.35em', fontWeight:900}}>✅ 스스로 잘 계산했어요!</div>}
      {!done && <button className="btn ghost sm" onClick={onBack}>◀ 💳 계산 방법 다시 고르기</button>}
    </div>
  );
}

/* ---- 현금 결제 (계산 연습 모드) ---- */
function CashPay({settings, total, paidBills, setPaidBills, onBack, onRetry, onComplete}){
  const BILLS=[1000,5000,10000,50000];
  const paid = paidBills.reduce((a,b)=>a+b,0);
  const need = shortfall(paid, total);
  const chg = change(paid, total);
  const enough = paid>=total;
  const [guessChg, setGuessChg] = useState(null); // 도전용 거스름돈 예상

  const add = (b)=>{ setPaidBills(list=>[...list,b]);
    const np=paid+b;
    if(np<total) speak(won(total-np)+'이 더 필요해요.');
    else if(np===total) speak('돈을 알맞게 냈어요!');
    else speak('거스름돈은 '+won(np-total)+'이에요.');
  };
  const reset = ()=>{ setPaidBills([]); onRetry(); speak('괜찮아요. 다시 해 볼까요?'); };

  // 쉬움: 필요한 지폐 강조 (부족분을 채우는 가장 작은 지폐)
  const highlight = (b)=>{
    if(settings.difficulty!=='easy') return false;
    return !enough && b<=Math.max(need,1000);
  };
  const dim = (b)=> settings.difficulty==='easy' && !enough && b>need && need>0 && need<b;

  const chgOptions = ()=> Array.from(new Set([chg, chg+1000, Math.max(0,chg-1000), chg+2000])).sort((a,b)=>a-b);

  return (
    <div className="card" style={{textAlign:'center'}}>
      <div className="section-title" style={{fontSize:'1.2em', justifyContent:'center'}}>💵 현금으로 내기</div>
      <div className="paycols">
        {/* 왼쪽: 금액 확인 + 안내 (‘돈을 알맞게 냈어요’까지) */}
        <div className="col paycol left" style={{gap:12}}>
          {/* 이름과 금액이 붙어 보이지 않게 위아래로 나눠 놓아요 */}
          <div className="row paysum" style={{justifyContent:'center'}}>
            <div className="pay-item card"><span className="lbl">물건값</span><b className="bignum" style={{color:'#c0392b'}}>{won(total)}</b></div>
            <div className="pay-item card"><span className="lbl">내가 낸 돈</span><b className="bignum">{won(paid)}</b></div>
            {!enough
              ? <div className="pay-item card" style={{background:'#fff6e6'}}><span className="lbl">더 필요한 돈</span><b className="bignum" style={{color:'#e8663a'}}>{won(need)}</b></div>
              : <div className="pay-item card" style={{background:'#eafaf1'}}><span className="lbl">거스름돈</span><b className="bignum good-txt">{won(chg)}</b></div>}
          </div>
          <Hint kind={(enough?'':'warm')+' fit'} text={ !enough ? won(need)+'이 더 필요해요.' : (chg>0? '거스름돈은 '+won(chg)+'이에요.' : '돈을 알맞게 냈어요!')}>
            {/* 색은 위 요약칸과 통일 — 물건값(빨강) · 거스름돈(초록) */}
            {!enough ? <span>{won(need)}이 더 필요해요.</span>
              : chg>0 ? <span>거스름돈은 <b className="good-txt">{won(chg)}</b>이에요.</span>
              : <span style={{color:'#c0392b', fontWeight:900}}>돈을 알맞게 냈어요!</span>}
          </Hint>
        </div>

        {/* 오른쪽: 지폐 넣기 (‘지폐를 눌러 계산대에 넣어요’부터 ‘다시 넣기’까지) */}
        <div className="col paycol right" style={{gap:12}}>
          <p style={{fontWeight:800, margin:0}}>지폐를 눌러 계산대에 넣어요 👇</p>
          <div className="row" style={{gap:14, justifyContent:'center', flexWrap:'wrap'}}>
            {BILLS.map(b=>(
              <button key={b} className={"bill b"+b+(highlight(b)?' glow':'')+(dim(b)?' dim':'')} onClick={()=>add(b)}>
                <BillFace b={b} />
              </button>
            ))}
          </div>
          {/* 넣은 돈은 한 장씩 늘어놓지 않고 '몇 장'으로 묶어 보여 줘요. */}
          {paidBills.length>0 && (
            <div className="row" style={{justifyContent:'center', flexWrap:'wrap', gap:8}}>
              <span className="muted">넣은 돈</span>
              {[10000,5000,1000].filter(v=>paidBills.some(b=>b===v)).map(v=>(
                <span key={v} className="pill">{v.toLocaleString('ko-KR')}원 × {paidBills.filter(b=>b===v).length}장</span>
              ))}
              <b className="bignum">{won(paid)}</b>
              <button className="btn sm yellow" onClick={reset}>↩️ 다시 넣기</button>
            </div>
          )}
        </div>
      </div>

      {/* 도전: 거스름돈 예상 */}
      {settings.difficulty==='challenge' && enough && chg>0 && guessChg===null && (
        <div className="card" style={{marginTop:14, background:'#f3f0fb'}}>
          <b>거스름돈이 얼마일까요? 골라 볼까요?</b>
          <div className="wrap" style={{gap:10, marginTop:10}}>
            {chgOptions().map(v=>(
              <button key={v} className="btn ghost" onClick={()=>{setGuessChg(v); speak(v===chg?'딩동댕! 정확해요.':'거스름돈은 '+won(chg)+'이에요.');}}>{won(v)}</button>
            ))}
          </div>
        </div>
      )}
      {settings.difficulty==='challenge' && guessChg!==null && (
        <Hint kind={(guessChg===chg?'':'warm')+' fit'}>실제 거스름돈은 <b>{won(chg)}</b>이에요.</Hint>
      )}

      <div className="row" style={{marginTop:18, justifyContent:'center'}}>
        <button className="btn primary big" disabled={!enough}
          onClick={()=> enough? onComplete(paid, chg) : speak(won(need)+'이 더 필요해요.')}>
          ✅ 계산하기
        </button>
      </div>
    </div>
  );
}

/* ---- 카드 결제 (모의) ---- */
function CardPay({total, items, onBack, onComplete}){
  const [phase, setPhase] = useState('wait');  // wait | checking | done
  const [drag, setDrag] = useState(null);      // {x,y}
  const [hot, setHot] = useState(false);
  const slotRef = useRef(null);
  const dots = phase==='checking';
  const done = phase==='done';

  /* 말이 '끝난 뒤' 다음으로 넘어가요 (2026-07-28).
     예전엔 1.3초·2.7초·3.9초로 밀어붙여서 "카드를 넣었…", "계산이 끝났…"처럼
     말이 중간에 잘렸어요(다음 말이 앞말을 취소하기 때문). 이제 speakThen 으로 이어요. */
  const runProcess = ()=>{
    setPhase('checking');
    speakThen('카드를 넣었어요. 확인하고 있어요.', null, ()=>{
      speakThen('잠시 기다려 주세요.', null, ()=>{
        setPhase('done');
        speakThen('계산이 끝났어요.', null, ()=> window.setTimeout(onComplete, 700), 1200);
      }, 1100);
    }, 2200);
  };

  /* 단말기 넣는 곳은 96×66px 남짓이라 정확히 놓기 어려웠어요(PC에서 여러 번 시도해야 했음).
     둘레 120px까지 '가까이 오면' 들어간 것으로 봐요 — 단말기 전체를 덮는 넉넉한 크기예요. */
  const overSlot = (x,y)=> nearRect(slotRef.current, x, y, 120);
  const startDrag = (e)=>{
    if(phase!=='wait') return;
    if(e.button===2) return;
    setDrag({x:e.clientX, y:e.clientY});
    const move=(ev)=>{ setDrag({x:ev.clientX, y:ev.clientY}); setHot(overSlot(ev.clientX, ev.clientY)); };
    const up=(ev)=>{
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
      window.removeEventListener('pointercancel', up);
      const ok=overSlot(ev.clientX, ev.clientY);
      setDrag(null); setHot(false);
      if(ok) runProcess();
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
    window.addEventListener('pointercancel', up);
  };

  return (
    <div className="card center" style={{flexDirection:'column', gap:18, padding:'26px 24px'}}>
      <div className="section-title" style={{fontSize:'1.2em'}}>💳 카드로 내기</div>
      <div className="bignum" style={{color:'#c0392b'}}>계산 금액 {won(total)}</div>

      {phase==='wait' && (
        <div className="hint fit" style={{fontSize:'1.02em', margin:'2px 0'}}>
          💳 오른쪽 카드를 끌어서 단말기 <b>아래에 넣어요</b>
        </div>
      )}

      {/* 왼쪽: 단말기 / 넉넉한 간격 / 오른쪽: 세로 카드 (위쪽 정렬) */}
      <div className="row center" style={{gap:60, alignItems:'flex-start', flexWrap:'wrap', margin:'8px 0 2px'}}>
        <div className="col center" style={{gap:4}}>
          <div style={{position:'relative', width:200, maxWidth:'100%'}}>
            <svg viewBox="0 0 200 235" className="card-terminal" role="img" aria-label="카드 단말기">
              <rect x="16" y="22" width="168" height="168" rx="18" fill="#3b4a63"/>
              <rect x="34" y="38" width="132" height="54" rx="8" fill={done? '#d8f7e4':'#dbeeff'}/>
              {done
                ? <path d="M74 65 l13 14 25 -29" stroke="#2fbf71" strokeWidth="9" fill="none" strokeLinecap="round" strokeLinejoin="round"/>
                : (dots
                    ? <g fill="#7ea8d4">
                        <circle cx="82" cy="65" r="7"><animate attributeName="opacity" values="1;.2;1" dur="1.2s" repeatCount="indefinite" begin="0s"/></circle>
                        <circle cx="100" cy="65" r="7"><animate attributeName="opacity" values="1;.2;1" dur="1.2s" repeatCount="indefinite" begin="0.3s"/></circle>
                        <circle cx="118" cy="65" r="7"><animate attributeName="opacity" values="1;.2;1" dur="1.2s" repeatCount="indefinite" begin="0.6s"/></circle>
                      </g>
                    : <rect x="50" y="59" width="100" height="12" rx="6" fill="#9fc4e6"/>)}
              {[0,1,2,3].map(r=>[0,1,2].map(c=>(
                <rect key={r+'-'+c} x={46+c*40} y={104+r*17} width="30" height="13" rx="4" fill="#58698a"/>
              )))}
              {/* 아래 슬롯 */}
              <rect x="44" y="182" width="112" height="24" rx="8" fill="#2a3547"/>
              <rect x="74" y="190" width="52" height="9" rx="4" fill="#0e131c"/>
              {/* 꽂힌 세로 카드 : 노란 칩이 위쪽(먼저 들어감) */}
              {phase!=='wait' && (
                <g>
                  <rect x="74" y="190" width="52" height="42" rx="6" fill="#ff9e7a"/>
                  <rect x="88" y="194" width="24" height="16" rx="3" fill="#ffd66b"/>
                  <rect x="74" y="216" width="52" height="10" fill="#e8663a"/>
                </g>
              )}
            </svg>
            <div ref={slotRef} className={"card-slot "+(hot?'hot':'')}></div>
          </div>
          {phase==='wait' && (
            <div className="row" style={{alignItems:'center', gap:8, marginTop:'-26px', width:'100%', paddingLeft:'43%'}}>
              <span style={{fontWeight:900, color: hot?'#c0392b':'#ff5a5a', fontSize:'1.9em', lineHeight:1}}>{hot ? '여기!' : '⬆'}</span>
              <span style={{fontWeight:800, color:'#ff5a5a', fontSize:'.95em', whiteSpace:'nowrap'}}>카드를 여기로</span>
            </div>
          )}
        </div>

        {phase==='wait' && (
          <button className="drag-card" onPointerDown={startDrag}
            style={{opacity: drag?0.35:1, marginTop:60}} aria-label="카드를 끌어서 단말기 아래에 넣기">
            <div className="card-face"></div>
          </button>
        )}
      </div>

      {phase!=='wait' && (
        <div style={{fontWeight:800, color:'#1b4b8f', fontSize:'1.2em', textAlign:'center'}}>
          {phase==='checking' ? '카드를 확인하고 있어요...' : '계산이 끝났어요!'}
        </div>
      )}

      {phase==='wait' && (
        <div className="row center">
          <button className="btn ghost" onClick={onBack}>◀ 💳 계산 방법 다시 고르기</button>
          <button className="btn sky" onPointerDown={(e)=>e.stopPropagation()} onClick={runProcess}>💳 카드 넣기(버튼)</button>
        </div>
      )}

      <p className="muted center" style={{fontSize:'.9em'}}>※ 실제 카드 번호·비밀번호는 넣지 않아요. 체험용이에요.</p>

      {/* 드래그 중 손가락 따라오는 카드 */}
      {drag && <div className="card-ghost" style={{left:drag.x, top:drag.y}}><div className="card-face"></div></div>}
    </div>
  );
}

/* ---- 여가활동 선택 페이지 (그림 자리 + 활동 고르기 + 타이머) ---- */
/* 활동별 삽화 : 활동을 고르면 '이미지/활동/<활동이름>.png' 를 보여줘요.
   그 활동 그림이 없으면 자동으로 기본 '이미지/무엇을 할까요.png' 로 넘어가고,
   그것도 없으면 안내 자리(art-slot)가 나와요. */
function ActivityArt({activity}){
  const bases = [];
  if(activity) bases.push('이미지/활동/' + activity);
  bases.push('이미지/무엇을 할까요');
  const srcs = [];
  bases.forEach(b=> imgList(b).forEach(s=> srcs.push(s)));
  const [i, setI] = useState(0);
  const [failed, setFailed] = useState(false);
  useEffect(()=>{ setI(0); setFailed(false); }, [activity]);   // 활동이 바뀌면 처음부터 다시 찾기
  if(failed) return (
    <div className="art-slot">그림을 넣을 자리예요.<br/>이미지 폴더에 <b>“활동/{activity||'무엇을 할까요'}.png”</b>로 넣어 주세요.</div>
  );
  return <img className="stage-scene" src={srcs[i]} alt={(activity||'무엇을 할까요')+' 그림'}
    onError={()=>{ if(i<srcs.length-1) setI(i+1); else setFailed(true); }} />;
}

/* 활동 카드용 그림: 이미지/활동/<활동이름>.png 가 있으면 이모지 '위에' 그림을 더 보여줘요.
   그림이 없으면 아무것도 안 나오고 이모지만 그대로 나와요. (한글 못 읽는 학생 배려) */
function ActivityThumb({activity, icon}){
  const srcs = imgList('이미지/활동/' + activity);
  const [i, setI] = useState(0);
  const [failed, setFailed] = useState(false);
  // 사진이 있으면 사진만 보여 주고, 사진이 없을 때만 이모지로 대신해요.
  if(!activity || failed) return icon ? <span className="ai">{icon}</span> : null;
  return <img className="act-thumb" src={srcs[i]} alt=""
    onError={()=>{ if(i<srcs.length-1) setI(i+1); else setFailed(true); }} />;
}

function PlayPage({settings, basket, activity, setActivity, onBack, onFinish, onGoPlayground}){
  const [timer, setTimer] = useState(null);   // 남은 초
  const [howMode, setHowMode] = useState(null); // 'real'(진짜 문구로) — '화면에서 놀기'는 별도 화면으로 이동
  const timerRef = useRef(null);
  const cap = activity || '내가 고른 문구로 무엇을 하며 즐길까요?';

  useEffect(()=>{ speak('내가 고른 문구로 무엇을 하며 즐길까요?'); }, []);
  useEffect(()=> ()=> clearInterval(timerRef.current), []);

  const startTimer = (min)=>{
    clearInterval(timerRef.current);
    if(min==='free'){ setTimer('free'); return; }
    setTimer(min*60);
    timerRef.current = setInterval(()=> setTimer(t=>{
      if(t==='free') return t;
      /* 화면에 '완성하지 않아도 괜찮아요' 같은 말이 이미 붙어 있어서 음성은 한 문장만 */
      if(t<=1){ clearInterval(timerRef.current); speak('시간이 다 되었어요. 완성하지 않아도 괜찮아요.'); return 0; }
      return t-1;
    }), 1000);
  };
  const fmt=(s)=> s==='free'?'자유':`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
  const acts = suggestActivities(basket);

  return (
    <div className="app">
      <div className="stepbar">
        <ActivityArt key={activity||'none'} activity={activity} />
        <div className="stepbar-cap"><span>{cap}</span><Speak text={cap} /></div>
      </div>

      <div className="stage-back noprint">
        {activity
          ? <button className="btn" onClick={()=>{ setActivity(null); setHowMode(null); speak('다른 활동을 골라요.', true); }}>◀ 다른 활동 고르기</button>
          : <button className="btn" onClick={onBack}>◀ 🧾 영수증·물건 확인으로</button>}
      </div>

      <div className="col" style={{gap:16}}>
        {!activity && (
          <Paged items={acts} per={4} resetKey="acts" cls="actgrid" render={a=>(
            <button key={a.title} className="act" onClick={()=>{setActivity(a.title); setHowMode(null); speak(a.title, true);}}>
              <span className="ai">{a.icon}</span>
              <b>{a.title}</b>
              <span className="muted">{a.desc}</span>
            </button>
          )} />
        )}

        {/* 활동을 고르면: 화면에서 놀지 / 진짜 문구로 할지 선택 */}
        {activity && howMode===null && (
          <div className="card center" style={{flexDirection:'column', gap:16}}>
            <b style={{fontSize:'1.15em'}}>‘{activity}’ 어떻게 즐길까요? <Speak text={activity+' 어떻게 즐길까요? 화면에서 꾸미며 놀 수도 있고, 산 진짜 문구로 할 수도 있어요.'} /></b>
            <div className="row center" style={{gap:16, alignItems:'stretch', flexWrap:'wrap'}}>
              <button className="act on" style={{cursor:'pointer'}} onClick={()=>{ speak('화면에서 꾸미며 놀아요.', true); onGoPlayground && onGoPlayground(); }}>
                <span className="ai">🎨</span><b>화면에서 놀기</b><span className="muted">꾸미기 놀이터로 가요.</span>
              </button>
              <button className="act" style={{cursor:'pointer'}} onClick={()=>{setHowMode('real'); speak('내가 산 진짜 문구로 해요.', true);}}>
                <span className="ai">🙌</span><b>진짜 문구로 하기</b><span className="muted">교실에서 산 물건으로 해요.</span>
              </button>
            </div>
          </div>
        )}

        {/* 진짜 문구로 하기 : 타이머 + 격려 */}
        {activity && howMode==='real' && (
          <div className="card center" style={{flexDirection:'column', gap:14}}>
            <b style={{fontSize:'1.2em'}}>⏰ 얼마나 즐길까요?</b>
            <div className="row center">
              {[{v:10,t:'10분'},{v:15,t:'15분'},{v:'free',t:'자유롭게'}].map(o=>(
                <button key={o.t} className="btn ghost" onClick={()=>startTimer(o.v)}>{o.t}</button>
              ))}
            </div>
            {timer!==null && <div className="timer">{fmt(timer)}</div>}
            {/* 안심시키는 말은 '두 개까지'만 (2026-07-28). 넷을 한꺼번에 띄우면
                읽을 것이 많아져 오히려 부담이 돼요. 남긴 둘은 서로 다른 이야기를 해요 —
                '끝까지 안 해도 된다'와 '바꿔도 된다'. */}
            <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:8, justifyItems:'center'}}>
              <span className="pill">완성하지 않아도 괜찮아요.</span>
              <span className="pill">다른 활동으로 바꾸어도 괜찮아요.</span>
            </div>
            <div className="row center" style={{gap:10}}>
              <button className="btn ghost" onClick={()=>setHowMode(null)}>◀ 다시 고르기</button>
              <button className="btn primary big" onClick={onFinish}>🏁 오늘 활동 마무리하기</button>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

/* ---- 꾸미기 놀이터 : 내가 산 문구로 화면에서 직접 꾸미며 놀기 ----
   도장을 톡톡 찍거나 붓으로 쓱쓱 색칠해요. 정답도 완성도 없어요.
   canvas 한 장에 그려서 PNG로 저장하거나 크게 자랑할 수 있어요. */
const PG_CW = 560, PG_CH = 340;   // 캔버스 내부 해상도
function Playground({settings, basket, activity, onBack, onDone}){
  const PAPERS = ['#fffdf5','#fdeef3','#eaf7fe','#eafaf1','#f3f0fb','#fff7e6'];
  const COLORS = ['#ff6b6b','#ff9f43','#ffd23f','#2fbf71','#5ec8f2','#5b6ef5','#b39ddb','#ff8fb1','#8b5a2b','#2b2b3a'];
  /* 도장으로 쓸 수 없는 이모지는 걸러요 (2026-07-28).
     · 비어 있거나 공백뿐인 것 — 선생님이 상품을 추가할 때 이모지를 안 넣은 경우
     · 흰색 도형(⬜⚪▫️◽◻️) — 흰 종이 위에 찍으면 안 보여서 '빈 칸'처럼 보였어요 */
  const BLANKISH = ['⬜','⚪','▫️','◽','◻️'];
  const boughtEmojis = Array.from(new Set(
    basket.map(p=>p.emoji).filter(e=> e && String(e).trim() && BLANKISH.indexOf(e)<0)
  ));
  const FUN = ['⭐','🌈','💗','🌸','✨','🎈','🦋','🐰','🍀','🌟','😊','🎀','🌷','🐱','🍭','🎨'];
  const STAMPS = Array.from(new Set([...boughtEmojis, ...FUN])).slice(0, 18);
  const SZ = { small:{stamp:34, brush:8}, medium:{stamp:54, brush:16}, large:{stamp:82, brush:30} };

  const [paper, setPaper]   = useState(PAPERS[0]);
  const [tool, setTool]     = useState('stamp');  // 'stamp'(도장) | 'brush'(색칠)
  const [stamp, setStamp]   = useState(STAMPS[0]);
  const [color, setColor]   = useState(COLORS[0]);
  const [size, setSize]     = useState('medium');
  const [actions, setActions] = useState([]);     // 되돌리기용 기록
  const [proud, setProud]   = useState(null);      // 자랑하기 이미지(dataURL)
  const canvasRef = useRef(null);
  const downRef = useRef(false);
  const curRef  = useRef(null);
  const px = SZ[size];

  useEffect(()=>{ speak('꾸미기 놀이터예요. 도장을 찍고 색칠해 보아요.'); }, []);

  // 캔버스 다시 그리기 (기록 전체를 새로 그림)
  useEffect(()=>{
    const cv = canvasRef.current; if(!cv) return;
    const ctx = cv.getContext('2d');
    ctx.clearRect(0,0,PG_CW,PG_CH);
    ctx.fillStyle = paper; ctx.fillRect(0,0,PG_CW,PG_CH);
    actions.forEach(a=>{
      if(a.type==='stroke'){
        ctx.strokeStyle=a.color; ctx.lineWidth=a.width; ctx.lineCap='round'; ctx.lineJoin='round';
        ctx.beginPath();
        a.points.forEach((p,i)=> i? ctx.lineTo(p.x,p.y) : ctx.moveTo(p.x,p.y));
        if(a.points.length===1) ctx.lineTo(a.points[0].x+0.01, a.points[0].y+0.01);
        ctx.stroke();
      } else {
        ctx.font = a.size+'px "Segoe UI Emoji","Apple Color Emoji",serif';
        ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText(a.emoji, a.x, a.y);
      }
    });
    if(actions.length===0){
      ctx.fillStyle='rgba(90,90,110,.42)'; ctx.font='700 22px sans-serif';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText('여기에 톡톡 찍고, 쓱쓱 색칠해요 ✨', PG_CW/2, PG_CH/2);
    }
  }, [actions, paper]);

  const xy = (e, cv)=>{ const r=cv.getBoundingClientRect();
    return { x:(e.clientX-r.left)/r.width*PG_CW, y:(e.clientY-r.top)/r.height*PG_CH }; };

  const onDown = (e)=>{
    const cv=canvasRef.current; if(!cv) return;
    try{ cv.setPointerCapture(e.pointerId); }catch(_){}
    const p = xy(e, cv);
    if(tool==='stamp'){
      setActions(a=>[...a, {type:'stamp', emoji:stamp, x:p.x, y:p.y, size:px.stamp}]);
    } else {
      downRef.current = true;
      curRef.current = {type:'stroke', color, width:px.brush, points:[p]};
      const ctx=cv.getContext('2d');
      ctx.strokeStyle=color; ctx.lineWidth=px.brush; ctx.lineCap='round'; ctx.lineJoin='round';
      ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(p.x+0.01,p.y+0.01); ctx.stroke();
    }
  };
  const onMove = (e)=>{
    if(!downRef.current || tool!=='brush') return;
    const cv=canvasRef.current, cur=curRef.current; if(!cv||!cur) return;
    const p = xy(e, cv); const prev = cur.points[cur.points.length-1];
    cur.points.push(p);
    const ctx=cv.getContext('2d');
    ctx.strokeStyle=cur.color; ctx.lineWidth=cur.width; ctx.lineCap='round'; ctx.lineJoin='round';
    ctx.beginPath(); ctx.moveTo(prev.x,prev.y); ctx.lineTo(p.x,p.y); ctx.stroke();
  };
  const onUp = ()=>{
    if(tool==='brush' && downRef.current && curRef.current){
      const stroke=curRef.current; downRef.current=false; curRef.current=null;
      setActions(a=>[...a, stroke]);
    }
  };

  const undo  = ()=> setActions(a=>a.slice(0,-1));
  const clear = ()=>{ setActions([]); speak('깨끗한 종이로 다시 시작해요.', true); };

  const save = ()=>{
    const cv=canvasRef.current; if(!cv) return;
    try{
      const url=cv.toDataURL('image/png');
      const a=document.createElement('a');
      a.href=url; a.download=(settings.name? settings.name+'_':'')+'GO문구마켓_내작품.png';
      document.body.appendChild(a); a.click(); a.remove();
      speak('내 작품을 그림 파일로 저장했어요.', true);
    }catch(_){ speak('이 환경에서는 저장이 어려워요. 화면을 그대로 보여 주어도 좋아요.', true); }
  };
  const brag = ()=>{
    const cv=canvasRef.current; if(!cv) return;
    try{ setProud(cv.toDataURL('image/png')); }catch(_){ setProud('unavailable'); }
    speak('멋진 작품이 완성됐어요! 선생님과 친구에게 보여 주세요.', true);
  };

  const SizeBtns = ()=>(
    <div className="wrap center" style={{gap:8}}>
      <span className="lbl" style={{alignSelf:'center'}}>크기</span>
      {[{v:'small',t:'작게'},{v:'medium',t:'보통'},{v:'large',t:'크게'}].map(o=>(
        <button key={o.v} className={"btn sm "+(size===o.v?'purple':'ghost')} onClick={()=>setSize(o.v)}>{o.t}</button>
      ))}
    </div>
  );

  return (
    <div className="card center" style={{flexDirection:'column', gap:8, padding:12}}>
      <div className="section-title" style={{fontSize:'1.1em', justifyContent:'center', margin:0}}>
        🎨 꾸미기 놀이터
        {activity && <span className="pill" style={{background:'#f3f0fb', color:'#3e2e63', fontWeight:800, marginLeft:8}}>🎯 {activity}</span>}
        <Speak text="내가 산 문구로 꾸며 보아요. 도장을 찍고 색칠해요." />
      </div>

      {/* 도장 / 색칠 고르기 */}
      <div className="wrap center" style={{gap:10}}>
        <button className={"btn sm "+(tool==='stamp'?'purple':'ghost')} onClick={()=>setTool('stamp')}>🔖 도장</button>
        <button className={"btn sm "+(tool==='brush'?'purple':'ghost')} onClick={()=>{setTool('brush'); speak('붓으로 쓱쓱 색칠해요.', true);}}>🖌️ 색칠</button>
      </div>

      {/* 종이 색 */}
      <div className="wrap center" style={{gap:8}}>
        <span className="lbl" style={{alignSelf:'center'}}>🖼️ 종이</span>
        {PAPERS.map(c=>(
          <button key={c} className={"pg-paper"+(paper===c?' on':'')} style={{background:c}}
            aria-label="종이 색 고르기" onClick={()=>setPaper(c)} />
        ))}
      </div>

      {/* 도장 팔레트 (도장 모드) */}
      {tool==='stamp' && (
        <div className="wrap center" style={{gap:8}}>
          <span className="lbl" style={{alignSelf:'center'}}>🔖 도장</span>
          {STAMPS.map(s=>(
            <button key={s} className={"pg-tool"+(stamp===s?' on':'')} aria-label={"도장 "+s} onClick={()=>setStamp(s)}>{s}</button>
          ))}
        </div>
      )}

      {/* 색 팔레트 (색칠 모드) */}
      {tool==='brush' && (
        <div className="wrap center" style={{gap:8}}>
          <span className="lbl" style={{alignSelf:'center'}}>🎨 색</span>
          {COLORS.map(c=>(
            <button key={c} className={"pg-swatch"+(color===c?' on':'')} style={{background:c}} aria-label="붓 색 고르기" onClick={()=>setColor(c)} />
          ))}
        </div>
      )}

      <SizeBtns />

      <canvas ref={canvasRef} className="pg-cv" width={PG_CW} height={PG_CH}
        style={{background:paper, cursor: tool==='brush'?'crosshair':'pointer'}}
        onPointerDown={onDown} onPointerMove={onMove} onPointerUp={onUp} onPointerCancel={onUp} />

      <div className="wrap center" style={{gap:8}}>
        <span className="pill" style={{fontSize:'.82em', padding:'4px 10px'}}>마음대로 꾸며도 괜찮아요.</span>
      </div>

      <div className="wrap center pg-actions" style={{gap:6}}>
        <button className="btn ghost sm" onClick={undo} disabled={actions.length===0}>↩️ 되돌리기</button>
        <button className="btn ghost sm" onClick={clear} disabled={actions.length===0}>🧽 지우기</button>
        <button className="btn ghost sm" onClick={onBack}>◀ 다른 활동</button>
        <button className="btn sky sm" onClick={save} disabled={actions.length===0}>🖼️ 저장</button>
        <button className="btn yellow sm" onClick={brag} disabled={actions.length===0}>✨ 자랑하기</button>
        <button className="btn primary sm" onClick={()=>{ speak('멋지게 꾸몄어요! 정말 잘했어요.', true); onDone(); }}>🎉 완성했어요!</button>
      </div>

      {/* 자랑하기 : 작품을 크게 보여 주기 */}
      {proud && (
        <div className="overlay" onClick={()=>setProud(null)}>
          <div className="modal center" style={{flexDirection:'column', gap:16, maxWidth:640}} onClick={e=>e.stopPropagation()}>
            <div className="section-title" style={{justifyContent:'center', margin:0}}>✨ {settings.name||'우리 친구'}의 멋진 작품! ✨</div>
            {proud!=='unavailable'
              ? <img className="pg-proud-img" src={proud} alt="내가 꾸민 작품" />
              : <div className="muted">이 환경에서는 그림으로 보여 주기 어려워요. 화면을 그대로 보여 주어도 좋아요.</div>}
            <Hint kind="soft" text="선생님과 친구에게 보여 주세요. 정말 잘했어요!">👏 선생님과 친구에게 보여 주세요. 정말 잘했어요!</Hint>
            <div className="wrap center" style={{gap:10}}>
              <button className="btn ghost" onClick={()=>setProud(null)}>◀ 더 꾸밀래요</button>
              {proud!=='unavailable' && <button className="btn sky" onClick={save}>🖼️ 저장하기</button>}
              <button className="btn primary big" onClick={()=>{ setProud(null); speak('정말 멋진 작품이에요! 잘했어요.', true); onDone(); }}>🎉 완성했어요!</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function Receipt({settings, receipt}){
  if(!receipt) return null;
  const d = receipt.date? new Date(receipt.date): new Date();
  const dateStr = `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
  return (
    <div className="receipt rollout">
      <div className="center" style={{flexDirection:'column'}}>
        <b style={{fontSize:'1.3em', letterSpacing:2}}>GO! 문구마켓</b>
        <span style={{fontSize:'.85em'}}>{dateStr}</span>
      </div>
      <hr/>
      <div className="r-row"><span>학생</span><span>{settings.name||'우리 학생'}</span></div>
      <hr/>
      {receipt.items.map(p=>(<div key={p.id} className="r-row">
        <span>{p.name}{qtyOf(p)>1 && ' ×'+qtyOf(p)}</span><span>{won(p.price*qtyOf(p))}</span>
      </div>))}
      <hr/>
      <div className="r-row"><b>총 금액</b><b>{won(receipt.total)}</b></div>
      <div className="r-row"><span>계산 방법</span><span>{receipt.method==='cash'?'현금':'카드'}</span></div>
      {receipt.method==='cash' && <div className="r-row"><span>낸 돈</span><span>{won(receipt.paid)}</span></div>}
      {receipt.method==='cash' && <div className="r-row"><span>거스름돈</span><span>{won(receipt.change)}</span></div>}
      {receipt.method==='card' && <div className="r-row"><span>카드로 계산</span><span>완료 ✅</span></div>}
      <hr/>
      <div className="center"><b>즐거운 여가시간 보내세요! 🌈</b></div>
    </div>
  );
}

function suggestActivities(basket){
  const has=(kw)=> basket.some(p=> kw.some(k=> p.name.includes(k) || p.corner===k));
  const acts=[];
  if(has(['스티커','테이프','deco']))
    acts.push({icon:'📔',title:'나만의 수첩 꾸미기',desc:'스티커로 예쁘게 꾸며요.'},
              {icon:'🏷️',title:'이름표 꾸미기',desc:'내 이름표를 만들어요.'},
              {icon:'💌',title:'친구에게 줄 카드 꾸미기',desc:'카드를 예쁘게 꾸며요.'});
  if(has(['색연필','사인펜','스케치북','물감','draw']))
    acts.push({icon:'🎨',title:'자유롭게 그림 그리기',desc:'마음껏 그려요.'},
              {icon:'😊',title:'오늘의 기분 그리기',desc:'지금 기분을 그려요.'},
              {icon:'⭐',title:'좋아하는 것 그리기',desc:'좋아하는 걸 그려요.'});
  if(has(['색종이']))
    acts.push({icon:'🦢',title:'자유 종이접기',desc:'접고 싶은 걸 접어요.'},
              {icon:'🎩',title:'종이 모자 만들기',desc:'모자를 만들어요.'},
              {icon:'🧑‍🤝‍🧑',title:'친구와 함께 꾸미기',desc:'같이 만들어요.'});
  if(has(['클레이']))
    acts.push({icon:'🍩',title:'좋아하는 음식 만들기',desc:'맛있는 걸 만들어요.'},
              {icon:'🐶',title:'동물 만들기',desc:'귀여운 동물을 만들어요.'},
              {icon:'✨',title:'자유롭게 모양 만들기',desc:'원하는 모양을 만들어요.'});
  if(has(['젤펜','연필','형광펜','메모','수첩','편지','write','gather']))
    acts.push({icon:'✉️',title:'친구에게 짧은 편지 쓰기',desc:'마음을 전해요.'},
              {icon:'💗',title:'가족에게 감사 카드 쓰기',desc:'고마움을 적어요.'},
              {icon:'🔮',title:'미래의 나에게 편지 쓰기',desc:'나에게 편지를 써요.'});
  if(has(['필통','보관함','파일','organize']))
    acts.push({icon:'🗂️',title:'내가 좋아하는 문구 정리하기',desc:'깔끔하게 정리해요.'},
              {icon:'👝',title:'필통 꾸미기',desc:'필통을 꾸며요.'},
              {icon:'📦',title:'문구 종류별로 나누어 담기',desc:'종류별로 정리해요.'});
  if(has(['블록','뜨개','비즈','십자수','프라모델','펠트','미니어처','다이아몬드','kit']))
    acts.push({icon:'🧩',title:'키트로 만들어 완성하기',desc:'차근차근 완성해요.'},
              {icon:'🏆',title:'완성한 작품 전시하기',desc:'만든 작품을 자랑해요.'},
              {icon:'🧶',title:'천천히 손으로 만들기',desc:'하나씩 만들어요.'});
  if(has(['보드게임','퍼즐','팽이','요요','비눗방울','카드','볼링','스퀴시','toy']))
    acts.push({icon:'🎲',title:'친구와 게임하기',desc:'같이 놀이해요.'},
              {icon:'🧩',title:'퍼즐 맞추기',desc:'조각을 맞춰요.'},
              {icon:'🎉',title:'혼자서도 재미있게 놀기',desc:'좋아하는 놀이를 해요.'});
  if(acts.length===0)
    acts.push({icon:'🎨',title:'자유롭게 그림 그리기',desc:'마음껏 그려요.'},
              {icon:'✂️',title:'자유롭게 만들기',desc:'재미있게 만들어요.'});
  // 중복 제거
  const seen=new Set(); return acts.filter(a=> seen.has(a.title)?false:(seen.add(a.title),true));
}

/* =========================================================
   마무리: 오늘의 문구 취향
========================================================= */
/* 즐긴 날 도장판 — 10칸을 채우면 새 판이 시작돼요.
   '얼마나 잘했나'가 아니라 '오늘도 즐겁게 다녀왔다'는 기념이에요.
   그래서 단계마다 주지 않고, 한 번 다녀오면 도장 하나만 찍혀요. */
/* 도장 그림 — 이미지\도장 아이콘.png 가 있으면 그 그림, 없으면 이모지 */
function StampMark(){
  const srcs = imgList('이미지/도장 아이콘');
  const [i, setI] = useState(0);
  const [failed, setFailed] = useState(false);
  if(failed) return <span className="stamp-mark">🛍️</span>;
  return <img className="stamp-mark-img" src={srcs[i]} alt=""
    onError={()=>{ if(i<srcs.length-1) setI(i+1); else setFailed(true); }} />;
}
function StampBoard({stamps}){
  const PER = 10;
  const total = stamps.length;
  const page = Math.floor(Math.max(0,total-1) / PER);      // 지금 채우는 중인 판
  const filled = total - page*PER;                          // 이번 판에 찍힌 개수
  const mine = stamps.slice(page*PER);
  const justFull = filled===PER;
  return (
    <div className="stampcard">
      <div className="stamp-head">
        <b className="stamp-title"><StampMark /> 즐겁게 다녀온 날</b>
        <span className="stamp-count">도장 {total}개</span>
        <span className="spacer" style={{flex:1}}></span>
        {page>0 && <span className="muted" style={{fontSize:'.85em'}}>{page+1}번째 도장판</span>}
      </div>
      <div className="stamp-slots">
        {Array.from({length:PER}).map((_,i)=>{
          const got = mine[i];
          const isToday = got && i===filled-1;
          return (
            <span key={i} className={"stamp-slot"+(got?' got':'')+(isToday?' today':'')}>
              {got ? <React.Fragment><StampMark /><span className="stamp-date">{got.date}</span></React.Fragment>
                   : <span className="stamp-num">{page*PER+i+1}</span>}
            </span>
          );
        })}
      </div>
      <p className="muted center" style={{margin:'8px 0 0', fontSize:'.92em'}}>
        {justFull ? '도장판을 다 채웠어요! 다음에 새 도장판을 시작해요 🎊'
                  : '오늘도 즐겁게 다녀왔어요. 다음에 또 놀러 와요!'}
      </p>
    </div>
  );
}

function FinishScreen({settings, basket, likes, activity, onReplay, onRestart, onPrintList, stamps, onStamp}){
  useEffect(()=>{ onStamp && onStamp(); }, []);   // 다녀온 기념 도장 1개 (같은 회기엔 한 번만)
  /* 산 문구를 두 개까지 적고, 더 있으면 '등 ○가지'로 묶어요. (여러 개 산 날과 맞게)
     (예전엔 맨 처음 담은 것 하나만 적어서, 여러 개 산 날과 맞지 않았어요) */
  const items = basket.map(p=>p.name);
  const nm = settings.name || '우리 학생';
  const itemText = items.length===0 ? null
    : items.length===1 ? items[0]
    : items.length===2 ? items[0]+', '+items[1]
    : items[0]+', '+items[1]+' 등 '+items.length+'가지';
  const actName = activity ? activity.replace(/하기.*/, '하기') : null;
  const nmJosa = josa(nm, '은', '는');                 // 홍강윤'은' / 지영'이는'→'는'
  const itemJosa = itemText ? josa(itemText, '을', '를') : '를';
  const summary = itemText
    ? `${nm}${nmJosa} 오늘 ${itemText}${itemJosa} 샀어요. ` + (actName? `그리고 ${actName} 활동을 하며 즐겼어요.` : '')
    : `${nm}${nmJosa} 오늘 문구점에 다녀왔어요.`;

  /* 여기는 고르는 화면이 아니라 '오늘 있었던 일'을 보여 주는 화면이라
     '골라 보세요'가 아니라 이렇게 알려 줘요.
     그리고 첫 문장을 '다 말한 뒤'(onend) 보라색 칩 내용까지 이어서 읽어 줘요 —
     정해진 시간으로 밀어붙이면 "오늘의 문구 취향이…"처럼 앞말이 잘려요.
     수동 모드(눌렀을 때만)에서는 speak가 아무 말도 하지 않으므로 조용히 넘어가요. */
  useEffect(()=>{
    speakThen('오늘의 문구 취향이에요.', null, ()=> window.setTimeout(()=> speak(summary), 350), 1800);
  }, []);

  return (
    <div className="app" style={{paddingTop:20}}>
      <div className="panel">
        <div className="section-title">🌈 오늘의 문구 취향 <Speak text={summary} /></div>
        <Hint kind="soft" onSpeak={summary}>
          {/* 문장 단위로 줄바꿈 (문장이 중간에 끊기지 않게) */}
          {itemText
            ? <span className="sent">{nm}{nmJosa} 오늘 <b style={{color:'#1b6fd6'}}>{itemText}</b>{itemJosa} 샀어요.&nbsp;</span>
            : <span className="sent">{nm}{nmJosa} 오늘 문구점에 다녀왔어요.</span>}
          {itemText && actName && <span className="sent">그리고 <b style={{color:'#e23b3b'}}>{actName}</b> 활동을 하며 즐겼어요.</span>}
        </Hint>

        {stamps && <StampBoard stamps={stamps} />}

        <p style={{fontWeight:800, marginTop:22}}>🎨 내가 산 문구로 이런 활동을 할 수 있어요</p>
        {/* 활동 고르기 화면과 같은 4개. 내가 고른 활동이 빠지지 않도록 맨 앞에 놓아요. */}
        <div className="actgrid compact">
          {(function(){
            const all = suggestActivities(basket);
            const mine = all.filter(a=> a.title===activity);
            const rest = all.filter(a=> a.title!==activity);
            return [...mine, ...rest].slice(0,4);
          })().map(a=>(
            <div key={a.title} className="act" style={{cursor:'default'}}>
              <ActivityThumb activity={a.title} icon={a.icon} />
              <b>{a.title}</b>
              <span className="muted">{a.desc}</span>
            </div>
          ))}
        </div>

        <div className="col center" style={{marginTop:24, gap:14}}>
          <div className="row center" style={{gap:12}}>
            <button className="btn ghost" onClick={onReplay}>🔁 오늘 활동 다시 보기</button>
            <button className="btn ghost" onClick={()=>{ if(confirm('처음부터 다시 할까요? 기록이 지워져요.')) onRestart(); }}>🆕 처음부터 다시 하기</button>
            <button className="btn sky" onClick={onPrintList}>🖨️ 실제 문구점 쇼핑 리스트</button>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ---- 금액을 지폐로 분해 (교육용, 1천원 단위) ---- */
function billsFor(amount){
  let a = Math.max(0, Math.round((amount||0)/1000)*1000);
  const out=[];
  while(a>=50000){ out.push(50000); a-=50000; }
  while(a>=10000){ out.push(10000); a-=10000; }
  while(a>=5000){ out.push(5000); a-=5000; }
  while(a>=1000){ out.push(1000); a-=1000; }
  return out;
}
/* 큰 지폐 버튼('지폐를 눌러 계산대에 넣어요')의 얼굴.
   이미지/지폐/1000.png 등이 있으면 그 그림을, 없으면 예전처럼 숫자만 보여 줘요.
   ※ 그림 파일을 넣고 빼는 것만으로 바뀌므로 코드를 다시 고칠 필요가 없어요 (2026-08-09). */
function BillFace({b}){
  const srcs = imgList('이미지/지폐/'+b);
  const [i, setI] = useState(0);
  const [failed, setFailed] = useState(false);
  if(!failed) return <img className="bill-img" src={srcs[i]} alt={won(b)}
    onError={()=>{ if(i<srcs.length-1) setI(i+1); else setFailed(true); }} />;
  return <div className="amt">{b.toLocaleString('ko-KR')}<span className="won">원</span></div>;
}
/* 지폐 그림 : 이미지/지폐/10000.png 등이 있으면 실제 화폐 사진, 없으면 지폐 모양 그래픽 */
function MiniBill({b}){
  const srcs = imgList('이미지/지폐/'+b);
  const [i, setI] = useState(0);
  const [failed, setFailed] = useState(false);
  if(!failed) return <img className="billnote-img" src={srcs[i]} alt={won(b)}
    onError={()=>{ if(i<srcs.length-1) setI(i+1); else setFailed(true); }} />;
  const cls = b>=50000?'n50000':b>=10000?'n10000':b>=5000?'n5000':'n1000';
  return (
    <span className={"billnote "+cls} aria-label={won(b)}>
      <span className="billnote-num">{b.toLocaleString('ko-KR')}</span>
      <span className="billnote-won">원</span>
    </span>
  );
}

/* ---- 지갑 시각화 (남은 돈을 지폐로) ----
   상단 지갑에 지폐를 몇 장까지 한 장씩 늘어놓을지. 이보다 많으면 '만 원 4장'처럼 묶어요.
   4장 = 1024×768에서 상단 줄이 한 줄로 유지되는 한계(측정값). 이 숫자를 올리면 스크롤이 생겨요. */
const WALLET_BILL_MAX = 7;   /* 이 값을 올리면 좁은 기기에서 상단 줄이 두 줄이 돼요 */
function Wallet({amount, over, onReset}){
  const bills = over? [] : billsFor(amount);
  const IcoTag = onReset ? 'button' : 'span';
  return (
    <div className="wallet">
      <IcoTag className={"wallet-ico"+(onReset?' wallet-ico-btn':'')}
        onClick={onReset||undefined}
        title={onReset? '지갑을 다시 정하기' : undefined}
        aria-label={onReset? '지갑을 다시 정하기' : undefined}>{over? '😮':'👛'}</IcoTag>
      <span className="wallet-lbl">{over? '돈이 모자라요' : '지갑에 남은 돈'}</span>
      {/* 지폐는 '한 장씩' 보여 주는 게 기본이에요 — 학생이 돈을 세어 보고
          '이만큼 있다'를 눈으로 아는 것이 이 앱의 목적이라서요.
          다만 예산이 큰 날은 지폐가 너무 많아져요(49,000원 = 9장). 그러면 상단 줄이
          2~3줄로 늘어나 매장 그림이 밀려 내려가고 화면에 스크롤이 생겨요.
          그래서 8장 이상일 때만 '만 원 4장'처럼 묶어서 보여 줍니다.
          기준 7장은 측정으로 정한 값 — 1024×768(가장 좁은 기기)에서 7장까지는
          넘침 0, 8장부터 37px 넘쳤어요.
          수업에서 쓰는 금액은 대부분 7장 이하라 평소엔 늘 한 장씩 보여요
          (19,000원=6장까지 그대로, 49,000원=9장쯤 되어야 묶임). */}
      <span className="wallet-bills">
        {(!over && bills.length===0) && <span className="muted">텅 비었어요</span>}
        {bills.length<=WALLET_BILL_MAX
          ? bills.map((b,i)=><MiniBill key={i} b={b} />)
          : [10000,5000,1000].filter(v=>bills.some(b=>b===v)).map(v=>{
              const cnt = bills.filter(b=>b===v).length;
              return (
                <span key={v} className="bill-group">
                  <MiniBill b={v} />
                  {/* '×4'는 곱셈이라 어려워요. '4장'으로 세어 읽게 씁니다 */}
                  {cnt>1 && <span className="bill-x">{cnt}장</span>}
                </span>
              );
            })}
      </span>
      <b className="wallet-amt" style={{color: over?'#e8663a':'#177245'}}>{won(Math.max(0,amount))}</b>
      <Speak text={over? '돈이 조금 모자라요.' : '지갑에 남은 돈은 '+won(Math.max(0,amount))+'이에요.'} />
    </div>
  );
}


/* ---- 점원과의 대화 연습 (기능적 의사소통) ---- */
/* 단계 그림: 파일(stage1~5)이 있으면 그림, 없으면 SVG 장면으로 자동 대체 */
function StageArt({num, s}){
  const names = {1:'구경하기', 2:'고르기', 3:'찍어보기', 4:'계산하기', 5:'즐기기'};
  const nm = names[num];
  const cap = s.cap;                          // 예: "문구점을 구경해요"
  const capU = cap.replace(/ /g, '_');         // 띄어쓰기를 _ 로 바꾼 이름도 함께 찾아요
  // 찾는 순서 : 문장 그대로 이름(구경해요 등) → 짧은 이름(구경하기).  '이미지' 폴더와 '이미지/활동' 폴더 모두 확인.
  const bases = ['이미지/'+cap, '이미지/'+capU, '이미지/활동/'+cap, '이미지/활동/'+capU,
                 '이미지/'+nm, '이미지/활동/'+nm];
  const srcs = [];
  bases.forEach(b=> imgList(b).forEach(x=> srcs.push(x)));
  srcs.push('이미지/stage'+num+'.png', 'stage'+num+'.png');
  const [i, setI] = useState(0);
  const [failed, setFailed] = useState(false);
  if(failed){
    return (
      <svg className="stage-scene" viewBox="0 0 480 150" preserveAspectRatio="xMidYMid meet" role="img" aria-label={s.cap}>
        <rect x="0" y="0" width="480" height="150" rx="20" fill={s.bg}/>
        <rect x="0" y="130" width="480" height="20" fill="rgba(0,0,0,0.045)"/>
        {s.art}
      </svg>
    );
  }
  return <img className="stage-scene" src={srcs[i]} alt=""
    onError={()=>{ if(i<srcs.length-1) setI(i+1); else setFailed(true); }} />;
}

/* =========================================================
   쇼핑 캐릭터 고르기 (기본 캐릭터 · 내 얼굴 사진으로 만들기)
========================================================= */
function CharacterSelect({initial, onConfirm, onHome, onBack, lockedName}){
  const [sel, setSel] = useState(()=> initial || {kind:'preset', id:'fox'});
  const [name, setName] = useState((initial && initial.name) || '');
  const fileRef = useRef(null);
  /* 안내를 조금(1.2초) 늦게 시작해요 — 앞 화면에서 학생이 고른 '자기 이름'을
     끝까지 듣고 넘어오게 하려고요. 바로 말하면 이름이 잘려요. */
  useEffect(()=>{
    const t = setTimeout(()=> speak('마음에 드는 캐릭터를 눌러 보세요.'), 1200);
    return ()=> clearTimeout(t);
  }, []);

  const pickPreset = (c)=>{ setSel({kind:'preset', id:c.id, name:c.name}); sayBtn(c.name); };


  // 사진(카메라)로 캐릭터 만들기 : 정사각형으로 잘라 작게 저장 (이 기기에만 저장)
  const onPhoto = (e)=>{
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (ev)=>{
      const img = new Image();
      img.onload = ()=>{
        try{
          const S=240, cv=document.createElement('canvas'); cv.width=S; cv.height=S;
          const ctx=cv.getContext('2d');
          const min=Math.min(img.width, img.height);
          const sx=(img.width-min)/2, sy=(img.height-min)/2;
          ctx.drawImage(img, sx, sy, min, min, 0, 0, S, S);
          let url; try{ url=cv.toDataURL('image/jpeg', 0.85); }catch(_){ url=ev.target.result; }
          setSel({kind:'photo', photo:url});
          sayBtn('멋진 사진이에요!');
        }catch(_){ setSel({kind:'photo', photo:ev.target.result}); }
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  };

  const confirm = ()=>{
    const ch = {...sel, name: name.trim() || (sel.kind==='preset' ? (CHARACTERS.find(c=>c.id===sel.id)||{}).name : '나') };
    speak((ch.name||'내 캐릭터')+'(으)로 쇼핑하러 가요!');
    onConfirm(ch);
  };

  return (
    <div className="app charselect" style={{paddingTop:12, maxWidth:1020}}>
      <BgImg name="벽지" className="wallpaper" />
      <div className="row" style={{marginBottom:8}}>
        <button className="brand step-btn" onClick={onHome} title="처음 화면으로"><BrandLogo /></button>
        {onBack && <button className="btn ghost" onClick={onBack}>◀ 🙋 누가 쇼핑할까요?</button>}
      </div>
      <div className="panel" style={{paddingTop:16, paddingBottom:16}}>
        <div className="section-title" style={{margin:'0 0 6px'}}>🧑‍🎨 나의 쇼핑 캐릭터를 골라요
          <Speak text="쇼핑하러 갈 나의 캐릭터를 골라요. 마음에 드는 캐릭터를 눌러 보세요." /></div>

        <div className="cs-cols">
          <div className="cs-preview">
            <Avatar character={sel} size={130} />
            {/* 명단을 쓰면 학생 이름이 곧 내 이름이라, 이름칸을 따로 두지 않아요(이름이 둘로 갈라지지 않게) */}
            {lockedName
              ? <div className="cs-name locked">{lockedName}</div>
              : <input className="cs-name" value={name} maxLength={8} placeholder="이름 (선택)"
                  onChange={e=>setName(e.target.value)} aria-label="캐릭터 이름" />}
          </div>

          <div className="cs-right">
            <div className="cs-grid">
              {CHARACTERS.map(c=>(
                <button key={c.id} className={"cs-cell"+(sel.kind==='preset'&&sel.id===c.id?' on':'')}
                  onClick={()=>pickPreset(c)} aria-label={c.name}>
                  <Avatar character={{kind:'preset', id:c.id}} size={52} />
                  <span className="cs-lbl">{c.name}</span>
                </button>
              ))}
            </div>
            <div className="cs-photo-row">
              <input type="file" accept="image/*" capture="user" ref={fileRef}
                onChange={onPhoto} style={{display:'none'}} />
              {/* 다른 캐릭터처럼 누르면 이름을 읽어 줘요 (글자를 못 읽는 학생이 무엇인지 알 수 있게) */}
              <button className="btn sky" onClick={()=>{ sayBtn('내 얼굴로 만들기'); fileRef.current && fileRef.current.click(); }}>📷 내 얼굴로 만들기</button>
              {sel.kind==='photo' && <span className="pill" style={{background:'#eafaf1', color:'#177245'}}>✅ 내 사진 캐릭터</span>}
              <span className="muted" style={{fontSize:'.82em'}}>사진은 이 기기에만 저장돼요.</span>
            </div>
          </div>
        </div>

        <button className="btn primary big" style={{width:'100%', marginTop:12}} onClick={confirm}>
          🛍️ 이 캐릭터로 쇼핑하러 가기
        </button>
      </div>
    </div>
  );
}

function CashierChat({mode, total, studentName, onDone}){
  const script = mode==='greet' ? [
    /* 말할 거리를 '두 개씩' 줘요 — 어느 쪽을 골라도 맞는 말이에요(정답 고르기가 아니라 '내가 골라 말하기'). */
    { c:'안녕하세요! 어서 오세요.', o:[{t:'안녕하세요!'}, {t:'반가워요!'}] },
    { c:'무엇을 사고 싶어요?',      o:[{t:'이거 주세요.'}, {t:'이거 살게요.'}] },
    { c:'네, 모두 '+won(total)+'이에요.', o:[{t:'네, 계산할게요.'}, {t:'네, 알겠어요.'}] },
  ] : [
    { c:'계산이 끝났어요. 여기 있어요.', o:[{t:'감사합니다.'}, {t:'고맙습니다.'}] },
    { c:'또 오세요! 안녕히 가세요.',     o:[{t:'안녕히 계세요.'}, {t:'또 올게요!'}] },
  ];
  const [i, setI] = useState(0);
  const [busy, setBusy] = useState(false);   // 학생이 말하는 동안 버튼 잠금 (겹치기·건너뛰기 방지)
  /* ⚠️ 점원은 speak(자동 안내를 따름), 학생은 sayBtnThen(눌렀을 때만) — 일부러 다릅니다.
     버그가 아니에요. 점원은 '나에게 말을 걸어오는 상대'라 저절로 말하고,
     학생 대사는 '내가 골라서 하는 말'이라 눌러야 나와요. 실제 가게에서 점원이 먼저
     인사하면 내 차례에 대답하는 순서 그대로예요. 학생 말까지 자동으로 나오면
     학생은 보고만 있게 되어 대화 연습이 되지 않아요. (2026-07-28 확인) */
  // 다음 단계로 오면 점원이 먼저 말하고, 학생 버튼 잠금을 풀어요.
  useEffect(()=>{ speak(script[i].c, false, 'clerk'); setBusy(false); }, [i]);
  const cur = script[i];
  const pick = (opt)=>{
    if(busy) return;
    setBusy(true);
    // 학생이 고른 말을 '끝까지' 한 뒤(onend) 잠깐(0.45초) 쉬고 다음으로 넘어가요.
    // 말이 끝나기 전에 점원이 말을 가로채거나 화면이 넘어가던 문제를 없앴어요.
    const advance = ()=> window.setTimeout(()=>{
      if(i < script.length-1) setI(i+1); else onDone();
    }, 450);
    sayBtnThen(opt.t, 'student', advance, Math.max(1100, opt.t.length*150));
  };
  return (
    <div className="card cashier">
      <div className="row" style={{marginBottom:4}}>
        <b style={{fontSize:'1.15em'}}>점원과 이야기해요</b>
        <span className="spacer"></span>
        <span className="pill">{i+1} / {script.length}</span>
      </div>
      <div className="chatbox">
        <div className="cashier-row">
          <ClerkFigure />
          <div className="speech"><span>{cur.c}</span><Speak text={cur.c} role="clerk" /></div>
        </div>
        <div className="student-row">
          <StudentFigure />
          <div className="wrap" style={{gap:10, justifyContent:'flex-end'}}>
            {cur.o.map((o,idx)=>(
              <button key={idx} className="talkbubble" onClick={()=>pick(o)} disabled={busy}>
                <span className="tb-spk">🔊</span> {o.t}
              </button>
            ))}
          </div>
        </div>
      </div>
      <p className="muted center" style={{marginTop:6}}>점원에게 할 말을 골라 눌러요.</p>
    </div>
  );
}

/* ---- 다회기 진전도 ---- */
function independenceScore(checks){
  const vals = Object.values(checks||{});
  if(vals.length===0) return null;
  const indep = vals.filter(v=>v==='도움 없이 수행함' || v==='그림 단서를 보고 수행함').length;
  return Math.round((indep/vals.length)*100);
}
function ProgressGraph({history}){
  if(!history || history.length===0)
    return <p className="muted">아직 저장된 회기가 없어요. 아래 “이 회기 저장하기”를 누르면 기록이 쌓여요.</p>;
  const n=history.length, W=Math.max(320, n*80), H=190, pad=34;
  const px=(i)=> n===1? W/2 : pad + i*(W-2*pad)/(n-1);
  const py=(v)=> H-pad - ((v||0)/100)*(H-2*pad);
  const path = history.map((h,i)=>(i===0?'M':'L')+px(i)+' '+py(h.score)).join(' ');
  return (
    <div style={{overflowX:'auto'}}>
      <svg width={W} height={H} style={{maxWidth:'none'}}>
        {[0,50,100].map(v=>(
          <g key={v}>
            <line x1={pad} y1={py(v)} x2={W-pad} y2={py(v)} stroke="#eee" />
            <text x={6} y={py(v)+4} fontSize="11" fill="#999">{v}</text>
          </g>
        ))}
        {n>1 && <path d={path} fill="none" stroke="#4ecdc4" strokeWidth="3" />}
        {history.map((h,i)=>(
          <g key={i}>
            <circle cx={px(i)} cy={py(h.score)} r="6" fill="#2fbf71" />
            <text x={px(i)} y={py(h.score)-12} fontSize="12" textAnchor="middle" fill="#177245">{h.score}%</text>
            <text x={px(i)} y={H-pad+18} fontSize="11" textAnchor="middle" fill="#888">{h.date}</text>
          </g>
        ))}
      </svg>
      <p className="muted" style={{fontSize:'.85em'}}>세로축: 스스로(도움 적게) 수행한 항목의 비율(%) · 가로축: 회기 날짜</p>
    </div>
  );
}

/* ---- 스위치 / 훑기(scanning) 조작 ---- */
function SwitchScanner({enabled, interval}){
  const idxRef = useRef(0);
  useEffect(()=>{
    if(!enabled) return;
    let stopped=false, timer=null, items=[];
    const clearHi = ()=>{ document.querySelectorAll('.scan-hi').forEach(el=>el.classList.remove('scan-hi')); };
    const collect = ()=> Array.prototype.slice.call(
      document.querySelectorAll('#root button:not([disabled]), #root input, #root select, #root a[href], #root [tabindex]'))
      .filter(el=> el.offsetParent!==null);
    const step = ()=>{
      if(stopped) return;
      clearHi();
      items = collect();
      if(items.length){
        if(idxRef.current>=items.length) idxRef.current=0;
        const el=items[idxRef.current];
        el.classList.add('scan-hi');
        try{ el.scrollIntoView({block:'center', behavior:'smooth'}); }catch(e){}
        idxRef.current = (idxRef.current+1) % items.length;
      }
      timer=setTimeout(step, interval||2600);
    };
    const onKey = (e)=>{
      if(e.code==='Space' || e.key===' ' || e.key==='Enter'){
        const el=document.querySelector('.scan-hi');
        if(el){ e.preventDefault(); el.click(); idxRef.current=0; }
      }
    };
    timer=setTimeout(step, 900);
    window.addEventListener('keydown', onKey, true);
    return ()=>{ stopped=true; clearTimeout(timer); clearHi(); window.removeEventListener('keydown', onKey, true); };
  }, [enabled, interval]);
  if(!enabled) return null;
  return <div className="scan-badge noprint">🔀 스위치 모드 — 스페이스바로 선택</div>;
}

<script>
(function(){
  var root = document.getElementById('root');
  function showErr(title, detail){
    root.innerHTML = '<div style="max-width:780px;margin:40px auto;padding:24px;border:2px solid #ffb3b3;'
      + 'border-radius:16px;background:#fff5f5;font-family:sans-serif;color:#2b2b3a;line-height:1.6;">'

      + '<p>아래 내용을 캐처해 알려주세요.</p>'
      + '<pre style="white-space:pre-wrap;word-break:break-word;background:#fff;padding:14px;'
      + 'border-radius:10px;border:1px solid #eee;font-size:13px;color:#555;">' + detail + '</pre></div>';
  }
  window.addEventListener('error', function(e){
    if(root && !root.hasChildNodes()){
      showErr('실행 중 문제가 생겼어요',
        (e.message||'') + '\n' + (e.filename||'') + ' : ' + (e.lineno||''));
    }
  });
  try{
    if(typeof React==='undefined' || typeof ReactDOM==='undefined'){
      showErr('구성 파일을 못 불러왔어요',
        'React 파일을 찾을 수 없어요.\nindex.html 과 vendor 폴더가 같은 위치에 있는지 확인해 주세요.');
      return;
    }
    if(typeof Babel==='undefined'){
      showErr('구성 파일을 못 불러왔어요',
        'Babel 파일(vendor/babel.js)를 찾을 수 없어요. vendor 폴더를 확인해 주세요.');
      return;
    }
    var src = document.getElementById('appcode').textContent;
    var compiled;
    try{
      compiled = Babel.transform(src, {presets:[['react', {runtime:'classic'}]]}).code;
    }catch(err){
      showErr('화면을 준비하다 문법 문제가 있었어요', String(err && err.message || err));
      return;
    }
    try{
      (0, eval)(compiled);
    }catch(err){
      showErr('화면을 그리다 문제가 생겼어요',
        String(err && err.message || err) + '\n\n' + (err && err.stack || ''));
      return;
    }
  }catch(err){
    showErr('알 수 없는 문제', String(err && err.message || err));
  }
})();
</script>
