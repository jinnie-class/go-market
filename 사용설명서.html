<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GO! 문구마켓 — 사용설명서</title>
<style>
  /* 이 쪽은 **PDF를 감싸는 껍데기**입니다 (2026-08-13).
     설명서를 HTML로 '다시 만들면' 글꼴·줄바꿈·쪽 나눔이 달라져서
     "인쇄해도 PDF 그대로"가 깨집니다. 그래서 내용은 손대지 않고
     사용설명서.pdf 를 그대로 띄우고, 위에 단추만 붙였어요. */
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{ margin:0; font-family:"맑은 고딕","Malgun Gothic",system-ui,sans-serif;
        color:#2b2b3a; background:#eef1f6; display:flex; flex-direction:column; }
  .bar{ flex:0 0 auto; display:flex; align-items:center; gap:12px; flex-wrap:wrap;
        padding:12px 18px; background:#fff; border-bottom:2px solid #dfe3ea;
        box-shadow:0 2px 10px rgba(0,0,0,.06); }
  .ttl{ font-weight:900; font-size:1.12em; margin-right:auto; }
  .btn{ font:inherit; font-weight:900; font-size:1em; color:#fff; cursor:pointer;
        border:0; border-radius:999px; padding:12px 22px; text-decoration:none;
        white-space:nowrap; display:inline-block; }
  .btn.print{ background:linear-gradient(135deg,#4aa3e8,#2b7fc4); box-shadow:0 4px 12px rgba(43,127,196,.34); }
  .btn.save{ background:linear-gradient(135deg,#e8663a,#c94f26); box-shadow:0 4px 12px rgba(201,79,38,.32); }
  .btn:hover{ filter:brightness(1.07); }
  .wrap{ flex:1 1 auto; min-height:0; padding:14px; }
  iframe{ width:100%; height:100%; border:2px solid #dfe3ea; border-radius:12px; background:#fff; }
  .fallback{ padding:14px 18px 22px; color:#5b6b7d; font-size:.95em; text-align:center; }
  .fallback b{ color:#2b2b3a; }
  @media (max-width:640px){
    .ttl{ flex:1 0 100%; margin-bottom:4px; }
    .btn{ padding:11px 18px; font-size:.95em; }
  }
</style>
</head>
<body>
  <div class="bar">
    <span class="ttl">📖 GO! 문구마켓 사용설명서</span>
    <button type="button" class="btn print" onclick="doPrint()">🖨️ 인쇄하기</button>
    <a class="btn save" href="사용설명서.pdf" download="GO! 문구마켓 사용설명서.pdf">⬇️ PDF 내려받기</a>
  </div>

  <div class="wrap">
    <iframe id="pv" src="사용설명서.pdf" title="사용설명서"></iframe>
  </div>

  <div class="fallback">
    설명서가 위에 보이지 않나요? <b><a href="사용설명서.pdf" target="_blank">여기를 눌러 바로 열어 보세요.</a></b>
    <br>휴대전화나 일부 태블릿에서는 이 자리에 PDF가 안 나올 수 있어요.
  </div>

<script>
  /* 인쇄는 **PDF 자체**를 인쇄해야 모습이 그대로예요.
     같은 폴더의 파일이라 대개 아래 방법으로 바로 인쇄 창이 뜨고,
     브라우저가 막으면 PDF를 새 창으로 열어 그 창에서 인쇄하게 합니다. */
  function doPrint(){
    var f = document.getElementById('pv');
    try{
      f.contentWindow.focus();
      f.contentWindow.print();
    }catch(e){
      window.open('사용설명서.pdf', '_blank');
    }
  }
</script>
</body>
</html>
